<title>残月陨石演出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: GBA-ratio stage on top, controls + beat timeline below, single column. */
:root{
  --bg:#0c0d16; --panel:#151827; --line:#2a2f48; --fg:#e8eaf2; --muted:#8f96ad;
  --gold:#f2c45a; --gold-dim:#8a6e30;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);padding-block:20px 40px;padding-inline:16px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-family:var(--f-px);font-weight:400;font-size:clamp(13px,2.2vw,18px);color:var(--gold);letter-spacing:.06em;line-height:1.6}
h1 span{font-family:var(--f-body);font-weight:700;font-size:1.25em;letter-spacing:.02em}
header p{margin:0;color:var(--muted);font-size:13px;line-height:1.7;max-width:66ch}
.stage{width:100%;aspect-ratio:3/2;max-width:100%;background:#000;border:2px solid var(--line);border-radius:4px;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{color:var(--muted);font-size:12px;letter-spacing:.08em}
button{font:inherit;font-size:13px;color:var(--fg);background:#1e2236;border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--gold-dim)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:#1a1406;border-color:var(--gold);font-weight:700}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
input[type=range]{width:110px;accent-color:var(--gold)}
.val{font-family:var(--f-px);font-size:10px;color:var(--gold);min-width:6ch}
.tl{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tl-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.tl-head b{font-family:var(--f-px);font-size:10px;color:var(--fg);font-weight:400}
.track{position:relative;display:flex;height:40px;overflow:hidden;cursor:pointer;user-select:none;touch-action:none}
.seg{border-right:2px solid var(--bg);background:#1f2438;display:flex;align-items:center;justify-content:center;min-width:0;font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap}
.seg.on{background:#33301e;color:var(--gold)}
.seg.key{background:#2e1c1c}
.seg.key.on{background:#55291f;color:#ffd2b8}
.head{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);pointer-events:none}
.beats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;font-size:12px;color:var(--muted)}
.beats div{display:flex;gap:8px;min-width:0}
.beats .t{font-family:var(--f-px);font-size:9px;line-height:18px;color:var(--fg);min-width:7ch}
.note{font-size:12px;color:var(--muted);line-height:1.7}
@media (max-width:520px){ .seg{font-size:0} }
</style>

<div class="wrap">
  <header>
    <h1>ZANGETSU <span>残月的余响 · 陨石打击</span></h1>
    <p>GBA 原生分辨率 240×160、整数倍放大的像素演出；机体 SD 比例。Feena 用质量加速器把一块陨石砸向对方小兵。点或拖时间轴跳到任意一拍，命中停顿和震动可以现场调。</p>
  </header>

  <div class="stage"><canvas id="cv" width="240" height="160" aria-label="像素横版战斗演出"></canvas></div>

  <div class="controls">
    <div class="grp"><button class="primary" id="play">▶ 播放（带音效）</button><button id="pause">暂停</button></div>
    <div class="grp"><span class="lbl">结果</span><button id="rKill" aria-pressed="true">击破</button><button id="rLive" aria-pressed="false">未击破</button></div>
    <div class="grp"><span class="lbl">速度</span>
      <button data-sp="0.25" aria-pressed="false">¼</button><button data-sp="0.5" aria-pressed="false">½</button>
      <button data-sp="1" aria-pressed="true">1×</button><button data-sp="2" aria-pressed="false">2×</button></div>
    <div class="grp"><span class="lbl">命中停顿</span><input type="range" id="stop" min="0" max="250" step="10" value="100"><span class="val" id="stopV">100ms</span></div>
    <div class="grp"><span class="lbl">震动</span><input type="range" id="shake" min="0" max="200" step="10" value="100"><span class="val" id="shakeV">100%</span></div>
    <div class="grp"><span class="lbl">音效</span><button id="snd" aria-pressed="true">开</button></div>
  </div>

  <div class="tl">
    <div class="tl-head"><span>时间轴（1× 下的真实时长，点或拖动跳到那一拍）</span><span><b id="now">0</b> / <b id="total">0</b> ms</span></div>
    <div class="track" id="track"><div class="head" id="head"></div></div>
    <div class="beats" id="beats"></div>
    <div class="note">红色两拍（命中停顿、冲击）最影响打击感。觉得哪一拍不对，直接说「坠落再快一点」「停顿 150」就行。</div>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv');
let g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const W = 240, H = 160;

/* ---------------- settings & timeline ---------------- */
const S = { stop: 100, shake: 1, speed: 1, kill: true, sound: true };
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const IMPACT = 4150;
function beats() {
  const s = S.stop, A = t => t + s;
  const L = [
    { k: 'enter', n: '入场', a: 0, b: 450 },
    { k: 'cutin', n: '切入台词', a: 450, b: 1700 },
    { k: 'charge', n: '蓄力', a: 1700, b: 2550 },
    { k: 'fire', n: '发射', a: 2550, b: 2850 },
    { k: 'pan', n: '转镜', a: 2850, b: 3250 },
    { k: 'omen', n: '预兆', a: 3250, b: 3550 },
    { k: 'fall', n: '坠落', a: 3550, b: IMPACT },
    { k: 'stop', n: '命中停顿', a: IMPACT, b: IMPACT + s, key: true },
    { k: 'hit', n: '冲击', a: A(IMPACT), b: A(4500), key: true },
    { k: 'drain', n: '扣血', a: A(4500), b: A(5200) },
  ];
  if (S.kill) { L.push({ k: 'kill', n: '击破', a: A(5200), b: A(6550) }, { k: 'exit', n: '退场', a: A(6550), b: A(7050) }); }
  else { L.push({ k: 'recoil', n: '后仰', a: A(5200), b: A(5900) }, { k: 'exit', n: '退场', a: A(5900), b: A(6400) }); }
  return L;
}
let BEATS = beats();
const total = () => BEATS[BEATS.length - 1].b;
const toBase = t => t < IMPACT ? t : (t < IMPACT + S.stop ? IMPACT : t - S.stop);

/* ---------------- helpers ---------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeIn = t => t * t * t, easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const r = Math.round;
const step = (t, ms) => Math.floor(t / ms) * ms;      // GBA-style choppy motion
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const px = (x, y, c) => { g.fillStyle = c; g.fillRect(r(x), r(y), 1, 1); };
const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(r(x), r(y), r(w), r(h)); };
function disc(cx, cy, rad, c, dither) {       // pixel circle, optional checker dither
  g.fillStyle = c; const R2 = rad * rad;
  for (let y = -rad; y <= rad; y++) for (let x = -rad; x <= rad; x++) {
    if (x * x + y * y > R2) continue;
    if (dither && ((x + y + r(cx) + r(cy)) & 1)) continue;
    g.fillRect(r(cx) + x, r(cy) + y, 1, 1);
  }
}
function ring(cx, cy, rx, ry, c) {             // pixel ellipse outline
  g.fillStyle = c; const n = Math.max(12, r((rx + ry) * 3));
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; g.fillRect(r(cx + Math.cos(a) * rx), r(cy + Math.sin(a) * ry), 1, 1); }
}

/* ---------------- sprites (original SD pixel art, outline added automatically) ---------------- */
const PAL = {
  K: '#141623', W: '#f2f4fa', L: '#c3cde3', B: '#8794b6', D: '#4d5878', G: '#f2c45a', g: '#a8742c', C: '#7ff0ff',
  M: '#b4524a', m: '#5e2830', n: '#e3876a', Y: '#ffe066', w: '#ffffff', r: '#3a1e22', R: '#9aa0aa', k: '#555a66',
};
const FEENA = [
'..........GGGGGGGG............',
'........GG........GG..........',
'........GG........GG..........',
'..........GGGGGGGG............',
'...........LLLLLL.............',
'..........LWWWWWWL............',
'.........LWWWWWWWWL...........',
'........LWWWWWWWWWWL..........',
'.......LWWWWWWWWWWWBL.........',
'......LWWWWWWWWWWWWBBL........',
'......DDDDDDDDDWWWWBBL........',
'......DCCCCCCCDWWWWBBL........',
'......DCWCCCCCDWWWWBBL........',
'......DDDDDDDDDWWWWBBL........',
'.......LWWWWWWWWWWWBBL..BB.....',
'.......LLWGGWWWWWWBBL..BLB.....',
'........LLLWWWWWWBBBL.BLLB.....',
'.........DDLLLLLLBBD.BLLB......',
'..........DDDDDDDD..BLLB.......',
'.......LLLLDDDDLLLLBLB.........',
'.....LWWWWBDDDDBWWWWLB.........',
'....LWWWWWBWGGWBWWWWWL.........',
'....LWWWWWBWGGWBWWWWWL.........',
'....BLLLLLBWWWWBLLLLLB.........',
'..........BWWWWB...............',
'.........DLWWWWLD..............',
'.........DLWWWWLD..............',
'........DLLWWWWLLD.............',
'........DLWWWWWWLD.............',
'.......DLWWWWWWWWLD............',
'.......DLWWWGWWWWLD............',
'......DLWWWWGWWWWWLD...........',
'......DLWWWWGWWWWWLD...........',
'.....DLWWWWWGWWWWWWLD..........',
'.....DLWWWWWGWWWWWWLD..........',
'....DLLWWWWWGWWWWWWLLD.........',
'....DBLLLLLLGLLLLLLLBD.........',
'....DBBBBBBBGBBBBBBBBD.........',
'.....GGGGGGGGGGGGGGGG..........',
'.........DBB....BBD............',
'.........DBB....BBD............',
'........DBBB...DBBB............',
'.......DDDDD...DDDDD...........',
];
const ARM_DOWN = ['..LL..', '.LWWL.', 'LWWWWL', 'LWWWBL', '.LWWB.', '.LWWB.', '.BLLB.', '.DBBD.'];
const ARM_UP = ['.DBBD.', '.BLLB.', '.LWWB.', '.LWWB.', '.LWWB.', '.LWWB.', '.LWWB.', '.LWWB.', 'LWWWBL', 'LWWWWL', '.LWWL.'];
const GRUNT = [
'.......mmmmmmmmm..............',
'......mMMMMMMMMMm.............',
'.....mMMnnMMMMMMMm............',
'.....mMnnMMMMMMMMm............',
'.....mmmmmmmmmmmmm............',
'.....mrrrrrrrYYYrm............',
'.....mrrrrrrrYwYrm............',
'.....mmmmmmmmmmmmm............',
'.....mMMMMMMMMMMMm............',
'......mMMMMMMMMMm.............',
'.......mmmmmmmmm..............',
'..nnnnn..mmmmm..nnnnnnnn......',
'.nMMMMMn.mMMMm.nMMMMMMMMn.....',
'.nMMMMMMnMMMMMnMMMMMMMMMMn....',
'.mMMMMMMMMMMMMMMMMMMMMMMMm....',
'.mmMMMMMMMMMMMMMMMMMMMMMmm....',
'..mmmMMMMMMYYMMMMMMMMmmmm.....',
'....mMMMMMMYYMMMMMMMMm........',
'....mMMMMMMMMMMMMMMMMm........',
'.....mmMMMMMMMMMMMMmm.........',
'.....mmmmmmmmmmmmmmmm.........',
'......mMMMm....mMMMm..........',
'......mMMMm....mMMMm..........',
'......mMMMm....mMMMm..........',
'.....mMMMMm....mMMMMm.........',
'.....mMMMMm....mMMMMm.........',
'.....mnnnnm....mnnnnm.........',
'....mmmmmmmm..mmmmmmmm........',
];
const ROCK = ['...rrrr...', '..rkkkkr..', '.rkRkkkkr.', 'rkkkkRkkkr', 'rkRkkkkkkr', 'rkkkkkRkkr', 'rkkRkkkkkr', '.rkkkkkRr.', '..rkkkkr..', '...rrrr...'];

function buildSprite(layers, w, h, outline = PAL.K, flip = false) {
  // layers: [{grid, x, y}] painted in order; returns canvas with 1px auto outline (+1px padding)
  const grid = Array.from({ length: h }, () => Array(w).fill(null));
  for (const L of layers) L.grid.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.' && PAL[ch]) { const yy = y + L.y, xx = x + L.x; if (yy >= 0 && yy < h && xx >= 0 && xx < w) grid[yy][xx] = PAL[ch]; } }));
  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
  const q = c.getContext('2d');
  const at = (x, y) => (y >= 0 && y < h && x >= 0 && x < w) ? grid[y][x] : null;
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    const v = at(x, y);
    const fx = flip ? (w - 1 - x) : x;
    if (v) { q.fillStyle = v; q.fillRect(fx + 1, y + 1, 1, 1); }
    else if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1)) { q.fillStyle = outline; q.fillRect(fx + 1, y + 1, 1, 1); }
  }
  return c;
}
function whiteOf(sp) { const c = document.createElement('canvas'); c.width = sp.width; c.height = sp.height; const q = c.getContext('2d'); q.drawImage(sp, 0, 0); q.globalCompositeOperation = 'source-in'; q.fillStyle = '#fff'; q.fillRect(0, 0, c.width, c.height); return c; }
const RIFLE = ['RRRRRRRRRRRRR', 'kkkkkkRRkkkkk', '......kk.....'];
const SP = {
  feenaIdle: buildSprite([{ grid: FEENA, x: 3, y: 0 }, { grid: ARM_DOWN, x: 4, y: 20 }], 34, 43),
  feenaCast: buildSprite([{ grid: FEENA, x: 3, y: 0 }, { grid: ARM_UP, x: 3, y: 10 }], 34, 43),
  grunt: buildSprite([{ grid: GRUNT, x: 0, y: 0 }, { grid: RIFLE, x: 15, y: 15 }], 30, 28),
  rock: buildSprite([{ grid: ROCK, x: 0, y: 0 }], 10, 10, '#1a0f0a'),
  head: buildSprite([{ grid: FEENA.slice(0, 19), x: 0, y: 0 }], 30, 19),
};
SP.gruntWhite = whiteOf(SP.grunt);

/* ---------------- 1-bit text (crisp bitmap look) ---------------- */
const TXT = new Map();
function text(str, font, color, outline, opts = {}) {
  const key = str + '|' + font + '|' + color + '|' + outline;
  let c = TXT.get(key);
  if (!c) {
    const m = document.createElement('canvas').getContext('2d'); m.font = font;
    const w = Math.ceil(m.measureText(str).width) + 4, size = parseInt(font.match(/(\d+)px/)[1], 10), h = size + 6;
    const raw = document.createElement('canvas'); raw.width = w; raw.height = h;
    const q = raw.getContext('2d'); q.font = font; q.textBaseline = 'top'; q.fillStyle = '#fff'; q.fillText(str, 2, 2);
    const d = q.getImageData(0, 0, w, h), on = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) on[i] = d.data[i * 4 + 3] > 120 ? 1 : 0;
    c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
    const o = c.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (on[y * w + x]) { o.fillStyle = color; o.fillRect(x + 1, y + 1, 1, 1); }
      else if (outline && ((x > 0 && on[y * w + x - 1]) || (x < w - 1 && on[y * w + x + 1]) || (y > 0 && on[(y - 1) * w + x]) || (y < h - 1 && on[(y + 1) * w + x]))) { o.fillStyle = outline; o.fillRect(x + 1, y + 1, 1, 1); }
    }
    TXT.set(key, c);
  }
  return c;
}
function drawText(str, x, y, font, color, outline, align = 'left', scale = 1) {
  const c = text(str, font, color, outline);
  const w = c.width * scale, h = c.height * scale;
  const dx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  g.drawImage(c, r(dx), r(y), r(w), r(h));
  return c.width;
}
const FONT_CN = n => `${n}px "Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif`;
const FONT_CNB = n => `700 ${n}px "Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif`;
const FONT_PX = n => `${n}px "Press Start 2P","Courier New",monospace`;

/* ---------------- world ---------------- */
const GROUND = 118;
const ENEMY_X = 70, ALLY_X = 330;
const CAM_ALLY = 280, CAM_ENEMY = 116;
const ENEMY = { name: '量产型·小兵', lv: 14, max: 6200 };
const ALLY = { name: 'Feena·月辉', lv: 20, max: 11250 };
const DMG = 5180;
const hpStart = () => S.kill ? 4900 : 6200;
const R = rng(20261012);
const STARS = Array.from({ length: 90 }, () => ({ x: R() * 520, y: R() * 92, b: R() < .15, tw: R() * 8 }));
const CRATERS = Array.from({ length: 16 }, () => ({ x: R() * 560 - 60, y: GROUND + 4 + R() * 30, rx: 4 + r(R() * 9), ry: 1 + r(R() * 2) }));
const CHARGE = Array.from({ length: 30 }, () => ({ a: R() * Math.PI * 2, d: 18 + R() * 26, delay: R() * 500 }));
const DEBRIS = Array.from({ length: 40 }, () => { const a = -Math.PI * (0.1 + R() * 0.8); const sp = 40 + R() * 120; return { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: R() < .3 ? 2 : 1, life: 450 + R() * 600, hot: R() < .5 }; });
const SPARK = Array.from({ length: 16 }, () => ({ a: R() * Math.PI * 2, sp: 30 + R() * 50, life: 220 + R() * 200 }));
const FIRE = ['#fffbe0', '#ffe066', '#ffa23a', '#e8502c', '#8a2420'];

/* ---------------- background ---------------- */
function background(cam, tb) {
  rect(0, 0, W, H, '#07081a');
  rect(0, 60, W, 40, '#0c0e24');
  for (let y = 56; y < 60; y++) for (let x = (y & 1); x < W; x += 2) px(x, y, '#0c0e24');   // dithered sky band
  for (const s of STARS) {
    const x = ((s.x - cam * 0.08) % 520 + 520) % 520 - 140;
    if (x < 0 || x >= W) continue;
    const on = s.b || (Math.floor(tb / 260 + s.tw) % 5) !== 0;
    if (on) px(x, s.y, s.b ? '#ffffff' : '#7d86b8');
  }
  // earth
  const ex = 150 - cam * 0.1, ey = 28;
  disc(ex, ey, 14, '#2a5da8'); disc(ex, ey, 14, '#3f86d6', true);
  disc(ex - 4, ey - 3, 4, '#5fae5a'); disc(ex + 5, ey + 4, 3, '#5fae5a');
  for (let y = -14; y <= 14; y++) for (let x = -14; x <= 14; x++) { if (x * x + y * y > 196) continue; if (x + y > 6) px(ex + x, ey + y, '#13284d'); else if (x + y > 2 && ((x + y) & 1)) px(ex + x, ey + y, '#13284d'); }
  // far ridge
  for (let x = 0; x < W; x++) {
    const wx = x + cam * 0.4;
    const h = r(12 + 6 * Math.sin(wx / 26) + 4 * Math.sin(wx / 11 + 1.3));
    rect(x, 100 - h, 1, h, '#232842');
    px(x, 100 - h, '#363d60');
  }
  // ground
  rect(0, 100, W, H - 100, '#545a72');
  for (let y = 100; y < 104; y++) for (let x = (y & 1); x < W; x += 2) px(x, y, '#3c4158');
  rect(0, 100, W, 1, '#8c93ae');
  for (const c of CRATERS) {
    const x = c.x - cam + W / 2; if (x < -20 || x > W + 20) continue;
    for (let i = -c.rx; i <= c.rx; i++) { const hh = Math.max(0, r(c.ry * Math.sqrt(1 - (i * i) / (c.rx * c.rx)))); rect(x + i, c.y - hh, 1, hh * 2 + 1, '#3c4158'); }
    rect(x - c.rx + 1, c.y + c.ry + 1, c.rx * 2 - 1, 1, '#7d84a0');
  }
}

/* ---------------- HUD ---------------- */
function frame9(x, y, w, h) {
  rect(x, y, w, h, '#101428'); rect(x, y, w, 1, '#c3cde3'); rect(x, y + h - 1, w, 1, '#4d5878'); rect(x, y, 1, h, '#c3cde3'); rect(x + w - 1, y, 1, h, '#4d5878');
}
function hpBar(x, y, w, frac, lag) {
  rect(x - 1, y - 1, w + 2, 5, '#141623');

/* ---------------- one frame (pure function of t) ---------------- */
function render(t) {

/* ---------------- timeline UI ---------------- */
const track = document.getElementById('track'), head = document.getElementById('head');

function buildTimeline() {

  for (const b of BEATS) { const d = document.createElement('div'); d.className = 'seg' + (b.key ? ' key' : ''); d.style.flex = `${Math.max(1, b.b - b.a)} 0 0`; d.textContent = b.n; d.dataset.k = b.k; track.insertBefore(d, head); }
  beatsEl.innerHTML = BEATS.map(b => `<div><span class="t">${b.b - b.a}ms</span><span>${b.n}</span></div>`).join('');
  totEl.textContent = total();
}
function updateTimeline(t) {
  head.style.left = `calc(${(t / total()) * 100}% - 1px)`;
  nowEl.textContent = Math.round(t);
  for (const n of track.querySelectorAll('.seg')) { const b = BEATS.find(x => x.k === n.dataset.k); n.classList.toggle('on', t >= b.a && t < b.b); }

/* ---------------- playback ---------------- */

}

function seek(nt) { playing = false; t = clamp(nt, 0, total()); render(t); updateTimeline(t); }

document.querySelectorAll('[data-sp]').forEach(b => b.addEventListener('click', () => { S.speed = +b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));

const shakeI = document.getElementById('shake'), shakeV = document.getElementById('shakeV');
