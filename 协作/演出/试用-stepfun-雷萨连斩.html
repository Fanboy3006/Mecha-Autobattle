<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: GBA-ratio stage on top, controls + beat timeline below, single column. */
:root{
  --bg:#0c0d16; --panel:#151827; --line:#2a2f48; --fg:#e8eaf2; --muted:#8f96ad;
  --gold:#f2c45a; --gold-dim:#8a6e30; --vio:#b9a6ff;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);padding-block:20px 40px;padding-inline:16px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-family:var(--f-px);font-weight:400;font-size:clamp(13px,2.2vw,18px);color:var(--gold);letter-spacing:.06em;line-height:1.6}
h1 span{font-family:var(--f-body);font-weight:700;font-size:1.25em;letter-spacing:.02em}
header p{margin:0;color:var(--muted);font-size:13px;line-height:1.7;max-width:66ch}
.stage{width:100%;aspect-ratio:3/2;max-width:100%;background:#000;border:2px solid var(--line);border-radius:4px;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{color:var(--muted);font-size:12px;letter-spacing:.08em}
button{font:inherit;font-size:13px;color:var(--fg);background:#1e2236;border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--gold-dim)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:#1a1406;border-color:var(--gold);font-weight:700}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
input[type=range]{width:110px;accent-color:var(--gold)}
.val{font-family:var(--f-px);font-size:10px;color:var(--gold);min-width:6ch}
.tl{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tl-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.tl-head b{font-family:var(--f-px);font-size:10px;color:var(--fg);font-weight:400}
.track{position:relative;display:flex;height:40px;overflow:hidden;cursor:pointer;user-select:none;touch-action:none}
.seg{border-right:2px solid var(--bg);background:#1f2438;display:flex;align-items:center;justify-content:center;min-width:0;font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap}
.seg.on{background:#33301e;color:var(--gold)}
.seg.key{background:#2e1c1c}
.seg.key.on{background:#55291f;color:#ffd2b8}
.head{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);pointer-events:none}
.beats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;font-size:12px;color:var(--muted)}
.beats div{display:flex;gap:8px;min-width:0}
.beats .t{font-family:var(--f-px);font-size:9px;line-height:18px;color:var(--fg);min-width:7ch}
.note{font-size:12px;color:var(--muted);line-height:1.7}
@media (max-width:520px){ .seg{font-size:0} }

<div class="wrap">
  <header>
    <h1>RAZER B1 <span>影界·万刃归一 · 近战突进连斩</span></h1>
    <p>GBA 原生分辨率 240×160、整数倍放大的像素演出；机体 SD 比例。雷萨（影世界·近卫）拔刀突进，穿过画面直取量产型小兵，四段连斩后一剑「万刃归一」。点或拖时间轴跳到任意一拍，命中停顿和震动可以现场调。</p>
  </header>

  <div class="stage"><canvas id="cv" width="240" height="160" aria-label="像素横版战斗演出"></canvas></div>

  <div class="controls">
    <div class="grp"><button class="primary" id="play">▶ 播放（带音效）</button><button id="pause">暂停</button></div>
    <div class="grp"><span class="lbl">结果</span><button id="rKill" aria-pressed="true">击破</button><button id="rLive" aria-pressed="false">未击破</button></div>
    <div class="grp"><span class="lbl">速度</span>
      <button data-sp="0.25" aria-pressed="false">¼</button><button data-sp="0.5" aria-pressed="false">½</button>
      <button data-sp="1" aria-pressed="true">1×</button><button data-sp="2" aria-pressed="false">2×</button></div>
    <div class="grp"><span class="lbl">命中停顿</span><input type="range" id="stop" min="0" max="250" step="10" value="100"><span class="val" id="stopV">100ms</span></div>
    <div class="grp"><span class="lbl">震动</span><input type="range" id="shake" min="0" max="200" step="10" value="100"><span class="val" id="shakeV">100%</span></div>
    <div class="grp"><span class="lbl">音效</span><button id="snd" aria-pressed="true">开</button></div>
  </div>

  <div class="tl">
    <div class="tl-head"><span>时间轴（1× 下的真实时长，点或拖动跳到那一拍）</span><span><b id="now">0</b> / <b id="total">0</b> ms</span></div>
    <div class="track" id="track"><div class="head" id="head"></div></div>
    <div class="beats" id="beats"></div>
    <div class="note">红色四拍是连斩的小停顿，紧接一掌大斩大停顿；命中停顿滑条同时管小的（半档）和大的（整档）。觉得哪一拍不对，直接说「冲刺再快一点」「大停顿 150」就行。</div>
  </div>
</div>

function baseOf(t) {

/* ================= helpers ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const px = (x, y, c) => { g.fillStyle = c; g.fillRect(r(x), r(y), 1, 1); };
const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(r(x), r(y), r(w), r(h)); };

/* 斩击光弧：一段带粗细变化的像素圆弧（月牙），prog 控制已画出的比例 */
function slashArc(cx, cy, a0, a1, rad, prog_, cOut, cMid, cIn) {
  const n = Math.max(10, r(rad * Math.abs(a1 - a0)));

  for (let i = 0; i <= n; i++) {

    const k = (a - a0) / (a1 - a0);

/* ---- 字符点阵 → canvas（自动 1px 深色描边） ---- */
function buildSprite(layers, w, h, outline = PAL.K) {
  const grid = Array.from({ length: h }, () => Array(w).fill(null));
  for (const L of layers) L.grid.forEach((row, y) => [...row].forEach((ch, x) => {

  const at = (x, y) => (y >= 0 && y < h && x >= 0 && x < w) ? grid[y][x] : null;
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    const v = at(x, y);
    if (v) { q.fillStyle = v; q.fillRect(x + 1, y + 1, 1, 1); }

const TXT = new Map();

    const w = Math.ceil(m.measureText(str).width) + 4, size = parseInt(font.match(/(\d+)px/)[1], 10), h = size + 6;
    const raw = document.createElement('canvas'); raw.width = w; raw.height = h;

    c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;

}

}

    cam = p < .55 ? lerp(CAM_START, 228, p / .55) : lerp(228, CAM_FIGHT, (p - .55) / .45);
  } else cam = CAM_FIGHT;

  /* ---- 震动（整数像素、跳帧） ---- */
  let sx = 0, sy = 0;
  HITS.forEach((at, i) => { const ai = tb - at; if (ai >= 0) { const q = step(ai, 33), amp = (i === 3 ? 2.6 : 2) * S.shake * Math.exp(-q / 70); sx += r(amp * Math.sin(q * 1.7 + i)); sy += r(amp * Math.cos(q * 1.3 + i)); } });
  { const ai = tb - T_FIN; if (ai >= 0) { const q = step(ai, 33), amp = 5 * S.shake * Math.exp(-q / 160); sx += r(amp * Math.sin(q * .3)); sy += r(amp * Math.cos(q * .41)); } }
  { const kt = tb - 4650; if (S.kill && kt >= 0) { const q = step(kt, 33), amp = 3.5 * S.shake * Math.exp(-q / 220); sx += r(amp * Math.sin(q * .37)); sy += r(amp * Math.cos(q * .29)); } }
  if (tb > 2140 && tb < 2260) { const q = step(tb - 2140, 33), amp = 1.2 * S.shake * Math.exp(-q / 60); sx += r(amp * Math.sin(q * 2.1)); }

  g.setTransform(1, 0, 0, 1, 0, 0);
  rect(0, 0, W, H, '#000');
  g.save(); g.translate(sx, sy);
  background(cam, tb);

  const exs = ENEMY_W - cam + W / 2;                       // 小兵屏幕 x
  const axs = ALLY_W - cam + W / 2;                        // 雷萨起段屏幕 x

  /* ---- 冲刺速度线 ---- */
  if (tb > 2250 && tb < 2620) for (let i = 0; i < 12; i++) {
    const y = 10 + i * 9, len = 26 + (i % 3) * 16;
    const x = ((i * 79 - ts * 2.4) % (W + 90) + W + 90) % (W + 90) - 45;
    rect(x, y, len, 1, i % 3 ? '#8f86c488' : '#d8d2ffcc');
  }

  /* ---- 雷萨（先定姿势，退场会覆盖） ---- */
  const dashP = prog(tb, 2250, 2600);
  let axw = ALLY_W;                                        // 世界坐标
  if (tb >= 2250 && tb < 2600) axw = dashP < .55 ? lerp(ALLY_W, 160, easeIn(dashP / .55)) : lerp(160, 118, easeOut((dashP - .55) / .45));
  else if (tb >= 2600) axw = 118;
  let pose = null;                                         // {sp, cx, feetY}
  if (tb < 400) {                                          // 入场：从右侧滑入 + 落地尘
    const q = easeOut(prog(tb, 0, 320));
    pose = { sp: 'raIdle', cx: lerp(axs + 60, axs, q), feetY: GROUND };
    if (q < 1) for (let i = 0; i < 5; i++) disc(axs + (i - 2) * 5, GROUND + 2, 3, '#565d7d', true);
  } else if (tb < 1750) {                                  // 切入期间不画机体
  } else if (tb < 2250) {                                  // 拔刀蓄势
    pose = { sp: 'raDraw', cx: axs, feetY: GROUND };
    const glow = prog(tb, 1780, 2200);
    for (let i = 0; i < 14; i++) {                          // 影尘向刀锋汇聚
      const a = i / 14 * Math.PI * 2, d = 24 - 16 * glow + (i % 3) * 3;
      const lt = (ts - 1750 - i * 37) % 420; if (lt < 0) continue;
      const q = lt / 420, dd = d * (1 - easeIn(q));
      px(axs - 4 + Math.cos(a) * dd, GROUND - 25 + Math.sin(a) * dd * .7, q > .7 ? '#e8dcff' : '#8f6adf');
    }
    if (glow > .15) ring(axs - 4, GROUND - 25, r(5 + glow * 5), r(2 + glow * 2), glow > .7 ? '#e45ad0' : '#7b5cb2');
    if (glow > .5) for (let x = -12; x <= 12; x += 2) px(axs + x + (Math.floor(ts / 66) % 2), GROUND + 2, '#8f6adf');
    if (tb > 2100 && (Math.floor(ts / 33) % 2) === 0) {     // 出刀前一瞬的刀光
      line(axs - 8, GROUND - 20, axs + 16, GROUND - 38, '#ffffff');
      line(axs - 8, GROUND - 18, axs + 16, GROUND - 36, '#b9a6ff');
    }
  } else if (tb < 2600) {                                  // 冲刺穿过画面
    for (let i = 1; i <= 3; i++) {                          // 残影
      const q = clamp(dashP - i * .12, 0, 1);
      const gx = q < .55 ? lerp(ALLY_W, 160, easeIn(q / .55)) : lerp(160, 118, easeOut((q - .55) / .45));
      ghost('raDash', gx - cam + W / 2, GROUND, SP.ghostVd);
    }
    pose = { sp: 'raDash', cx: axw - cam + W / 2, feetY: GROUND };
    for (let i = 0; i < 6; i++) rect(axw - cam + W / 2 - 14 - i * 6, GROUND - 2 - (i % 2), 8, 1, '#565d7d');   // 脚下尘
  } else if (tb < 3200) {                                  // 连斩①~④
    const k = tb < 2750 ? 0 : tb < 2900 ? 1 : tb < 3050 ? 2 : 3;
    pose = comboPose(k, tb);
  } else if (tb < 3400) {                                  // 大斩定格
    pose = { sp: 'raFin', cx: 162 + r(4 * prog(tb, 3200, 3400)), feetY: GROUND - 6 };
  } else {                                                 // 收势
    pose = { sp: 'raIdle', cx: 162, feetY: GROUND };
  }
  const exitP = prog(tb, S.kill ? 5450 : 4700, S.kill ? 5850 : 5100);
  if (exitP > 0 && exitP < .8) {                           // 退场：向右疾走 + 残影
    const q = exitP / .8;
    for (let i = 1; i <= 2; i++) ghost('raDash', lerp(162, 162 + 210 * easeIn(clamp(q - i * .16, 0, 1)), 1), GROUND, SP.ghostVd);
    pose = { sp: 'raDash', cx: lerp(162, 162 + 210 * easeIn(q), 1), feetY: GROUND };
  }
  if (pose) drawAlly(pose.sp, pose.cx, pose.feetY);

  /* ---- 小兵 ---- */
  let ewhite = false, eoff = 0, edead = false, eanim = 'stand';
  HITS.forEach((at, i) => { const ai = tb - at; if (ai >= 0 && ai < (i === 3 ? 90 : 60)) { ewhite = true; eoff = -2; } });
  { const ai = tb - T_FIN; if (ai >= 0 && ai < 120) { ewhite = true; eoff = -3; } }
  if (S.kill) {
    const kt = tb - 4000;
    if (kt >= 0 && kt < 300) ewhite = Math.floor(kt / 50) % 2 === 0;
    if (kt >= 4650) edead = true;
  } else {
    const rt = tb - 4000;
    if (rt >= 0) { eanim = 'lean'; eoff = -r(6 * Math.sin(Math.PI * prog(rt, 0, 500))); if (rt < 66 && Math.floor(rt / 33) % 2 === 0) ewhite = true; }
  }
  if (!edead && exs > -40 && exs < W + 40) {
    rect(exs - 11, GROUND + 1, 22, 2, '#2b3049');
    const bob = (Math.floor(tb / 380) % 2) && tb < 2600;
    if (eanim === 'lean') g.drawImage(SP.gruntLean, r(exs - 14 + eoff), r(GROUND - 42 + bob));
    else g.drawImage(ewhite ? SP.gruntWhite : SP.grunt, r(exs - 14 + eoff), r(GROUND - 42 + bob));
  }

  /* ---- 斩击光弧 + 火花 ---- */
  const hitY = GROUND - 26;
  HITS.forEach((at, i) => {
    const ai = tb - at; if (ai < 0) return;
    const q = step(ai, 33), fade = prog(ai, 0, 260);
    const [a0, a1, rad] = i === 0 ? [Math.PI - .95, Math.PI + .95, 15] : i === 1 ? [.55, 2.35, 16] : i === 2 ? [-2.35, -.55, 16] : [Math.PI - .8, Math.PI + .8, 14];
    const grow = ai < 99 ? .45 : ai < 165 ? .8 : 1;
    if (ai < 300) {
      slashArc(exs + 2, hitY, a0, a1, rad, grow * (1 - fade * .35), i === 1 ? '#e45ad0' : '#8f6adf', '#ccd8ee', '#ffffff');
      if (ai < 130) for (let k = 0; k < 7; k++) { const a = i * 1.1 + k * .9, d = 4 + q * .09; px(exs + 2 + Math.cos(a) * d, hitY + Math.sin(a) * d, k % 2 ? '#ffffff' : '#ffe066'); }
    }
  });
  { const ai = tb - T_FIN; if (ai >= 0 && ai < 420) {
      const grow = ai < 132 ? .5 : ai < 231 ? .85 : 1;
      slashArc(exs + 2, hitY, 1.05, 4.55, 30, grow, '#e45ad0', '#e8dcff', '#ffffff');
      if (ai < 260) { line(exs - 26, hitY + 22, exs + 30, hitY - 22, '#ffffff'); line(exs - 26, hitY + 24, exs + 30, hitY - 20, '#b9a6ff'); }
      if (ai < 200) for (let k = 0; k < 12; k++) { const a = k * .52 + ai * .01, d = 6 + step(ai, 33) * .12; px(exs + 2 + Math.cos(a) * d, hitY + Math.sin(a) * d, k % 3 ? '#ffffff' : '#e45ad0'); }
  } }

  /* ---- 击破序列 ---- */
  if (S.kill) {
    const kt = tb - 4000, ex = exs, ey = GROUND;
    const POPS = [[-8, -18, 250], [9, -10, 400], [-3, -34, 550]];
    for (const [dx, dy, at] of POPS) { const lt = kt - at; if (lt < 0 || lt > 330) continue; const e = lt / 330; const rr = r(2 + 8 * easeOut(e)); disc(ex + dx, ey + dy, rr, FIRE[e < .4 ? 1 : 3], e > .6); disc(ex + dx, ey + dy, Math.max(1, rr - 3), FIRE[0]); }
    const bt = kt - 650;                                        // 大爆炸
    if (bt >= 0 && bt < 900) {
      const e = bt / 900, rr = r(8 + 30 * easeOut(Math.min(1, bt / 300)));
      [4, 3, 2, 1, 0].forEach((b, k) => { if (e > .5 && b < 2) return; disc(ex, ey - 16, Math.max(1, rr - k * 6), FIRE[b], k === 0 && e > .4); });
      for (const sp of SPARK) { if (bt > sp.life) continue; const d = sp.sp * bt / 1000 * 2; px(ex + Math.cos(sp.a) * d, ey - 16 + Math.sin(sp.a) * d, '#ffe066'); }
      for (let k = 0; k < 2; k++) { const lt = bt - k * 99; if (lt < 0 || lt > 500) continue; const e2 = easeOut(lt / 500); ring(ex, GROUND + 1, 8 + 70 * e2, 2 + 9 * e2, k ? '#ffa23a' : '#fffbe0'); }
    }
    if (bt > 250) { const e = prog(bt, 250, 1400); for (let k = 0; k < 4; k++) disc(ex - 6 + k * 4, ey - 10 - e * 18 - k * 4, r(4 + e * 5), '#4a4658', true); }
    for (const d of DEBRIS) { if (bt < 0 || bt > d.life) continue; const s2 = bt / 1000; const x = ex + d.vx * s2, y = ey - 16 + d.vy * s2 + 0.5 * 260 * s2 * s2; if (y > GROUND + 10) continue; rect(x, y, d.s, d.s, d.hot ? FIRE[1 + (bt > d.life * .5 ? 2 : 0)] : '#a3a9bd'); }
  }

  /* ---- 伤害数字 ---- */
  HITS.forEach((at, i) => {
    const ai = tb - at; if (ai < 0 || ai > 620) return;
    const q = step(ai, 33), hop = q < 66 ? -3 : q < 132 ? -1 : 0;
    const vis = ai < 520 || (Math.floor(ai / 66) % 2 === 0);
    if (vis) drawText(String(HIT_DMG[i]), exs + 2, GROUND - 60 + hop, FONT_PX(10), '#ffffff', '#5a2a6e', 'center');
  });
  { const ai = tb - T_FIN; if (ai > 0 && ai < 1500) {
      const q = step(ai, 33), hop = q < 100 ? -5 : q < 200 ? -2 : 0;
      const vis = ai < 1200 || (Math.floor(ai / 66) % 2 === 0);
      if (vis) drawText(DMG.toLocaleString('en-US'), exs + 2, GROUND - 72 + hop, FONT_PX(16), '#ffffff', '#c2361e', 'center');
  } }
  /* ---- 击破印章 ---- */
  if (S.kill && tb > 4900) {
    const q = tb - 4900, big = q < 66;
    const vis = tb < 5350 || Math.floor(tb / 66) % 2;
    if (vis) drawText('击破', exs + 2, 24, FONT_CNB(big ? 26 : 20), '#ff5a3a', '#2a0805', 'center');
  }

  g.restore();   // end shake

  /* ---- 武器名牌 ---- */
  if (tb > 1750 && tb < (S.kill ? 5450 : 4700)) { frame9(60, 2, 120, 15); drawText(MOVE, 66, 3, FONT_CN(11), '#ffffff', null); drawText('2900', 176, 7, FONT_PX(8), '#f2c45a', null, 'right'); }

  /* ---- HUD ---- */
  const hp0 = hpStart();
  const drained = prog(tb, 3400, 3950), lagged = prog(tb, 3520, 4020);
  const hpNow = tb <= T_FIN ? hp0 : lerp(hp0, hp0 - DMG, Math.max(easeOut(drained), tb > T_FIN ? .12 : 0));
  const hpLag = tb < 3520 ? hp0 : lerp(hp0, hp0 - DMG, easeInOut(lagged));
  const lastB = BEATS[BEATS.length - 1];
  hud(Math.max(0, hpNow), Math.max(0, Math.max(hpNow, hpLag)), tb > 200 && !(tb > 400 && tb < 1750) && t < dispOf(lastB.a) + 250);

  /* ---- 切入 ---- */
  if (tb >= 400 && tb < 1750) cutin(prog(tb, 400, 1750), tb);

  /* ---- 闪白 ---- */
  if (fr && fr.at === T_FIN) { if (t - dispOf(T_FIN) < 34) rect(0, 0, W, H, '#ffffff'); else for (let y = 0; y < H; y++) for (let x = (y & 1); x < W; x += 2) px(x, y, '#ffffff'); }
  else if (fr) for (let y = 0; y < H; y += 2) rect(0, y, W, 1, '#ffe06644');
  if (S.kill && tb >= 4650 && tb < 4683) rect(0, 0, W, H, '#ffffff');

  /* ---- 转场 ---- */
  const en = prog(t, 0, 400);
  if (en < 1) { const hh = r((H / 2) * (1 - easeOut(en)) / 4) * 4; rect(0, 0, W, hh, '#000'); rect(0, H - hh, W, hh, '#000'); }
  const ex2 = prog(t, dispOf(lastB.a), dispOf(lastB.b));
  if (ex2 > 0) { const lvl = Math.floor(ex2 * 4); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { if (lvl >= 4 || ((x + y * 2) % 4) < lvl) px(x, y, '#000'); } }
}
function line(x0, y0, x1, y1, c) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
  g.fillStyle = c;
  for (let i = 0; i <= n; i++) g.fillRect(r(lerp(x0, x1, i / n)), r(lerp(y0, y1, i / n)), 1, 1);
}

/* ================= timeline UI ================= */
const track = document.getElementById('track'), head = document.getElementById('head');
const beatsEl = document.getElementById('beats'), nowEl = document.getElementById('now'), totEl = document.getElementById('total');
function buildTimeline() {
  STOPS = stops(); BEATS = beats();
  track.querySelectorAll('.seg').forEach(n => n.remove());
  for (const b of BEATS) { const d = document.createElement('div'); d.className = 'seg' + (b.key ? ' key' : ''); d.style.flex = `${Math.max(1, dispOf(b.b) - dispOf(b.a))} 0 0`; d.textContent = b.n; d.dataset.k = b.k; track.insertBefore(d, head); }
  beatsEl.innerHTML = BEATS.map(b => `<div><span class="t">${dispOf(b.b) - dispOf(b.a)}ms</span><span>${b.n}</span></div>`).join('');
  totEl.textContent = total();
}
function updateTimeline(t) {
  head.style.left = `calc(${(t / total()) * 100}% - 1px)`;
  nowEl.textContent = Math.round(t);
  for (const n of track.querySelectorAll('.seg')) { const b = BEATS.find(x => x.k === n.dataset.k); n.classList.toggle('on', t >= dispOf(b.a) && t < dispOf(b.b)); }
}

/* ================= playback ================= */
let t = 0, playing = false, last = 0;
function tick(now) {
  if (!playing) return;
  const dt = Math.min(50, now - last); last = now;
  const prev = t; t += dt * S.speed;
  for (const [at, kind] of soundEvents()) if (prev <= at && t > at) sfx(kind);
  if (t >= total()) { t = total(); playing = false; }
  render(t); updateTimeline(t);
  if (playing) requestAnimationFrame(tick);
}
function play(fromStart) { if (fromStart || t >= total()) t = 0; playing = true; last = performance.now(); requestAnimationFrame(tick); }
function seek(nt) { playing = false; t = clamp(nt, 0, total()); render(t); updateTimeline(t); }
document.getElementById('play').addEventListener('click', () => { const a = ac(); if (a && a.state === 'suspended') a.resume(); document.getElementById('pause').textContent = '暂停'; play(true); });
document.getElementById('pause').addEventListener('click', e => { if (playing) { playing = false; e.target.textContent = '继续'; } else { e.target.textContent = '暂停'; play(false); } });
const rKill = document.getElementById('rKill'), rLive = document.getElementById('rLive');
function setKill(v) { S.kill = v; rKill.setAttribute('aria-pressed', String(v)); rLive.setAttribute('aria-pressed', String(!v)); buildTimeline(); seek(Math.min(t, total())); }
rKill.addEventListener('click', () => setKill(true)); rLive.addEventListener('click', () => setKill(false));
document.querySelectorAll('[data-sp]').forEach(b => b.addEventListener('click', () => { S.speed = +b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));
const stopI = document.getElementById('stop'), stopV = document.getElementById('stopV');
stopI.addEventListener('input', () => { S.stop = +stopI.value; stopV.textContent = S.stop + 'ms'; buildTimeline(); if (!playing) seek(Math.min(t, total())); });
const shakeI = document.getElementById('shake'), shakeV = document.getElementById('shakeV');
shakeI.addEventListener('input', () => { S.shake = +shakeI.value / 100; shakeV.textContent = shakeI.value + '%'; if (!playing) render(t); });
const snd = document.getElementById('snd');
snd.addEventListener('click', () => { S.sound = !S.sound; snd.setAttribute('aria-pressed', String(S.sound)); snd.textContent = S.sound ? '开' : '关'; });
let dragging = false;
const trackSeek = e => { const b = track.getBoundingClientRect(); seek(((e.clientX - b.left) / b.width) * total()); };
track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); trackSeek(e); });
track.addEventListener('pointermove', e => { if (dragging) trackSeek(e); });
track.addEventListener('pointerup', () => { dragging = false; });

/* ================= boot ================= */
buildTimeline();
if (reduce) { S.shake = 0; shakeI.value = 0; shakeV.textContent = '0%'; }
const q = new URLSearchParams(location.search);
const t0 = q.has('t') ? clamp(+q.get('t') || 0, 0, total()) : -1;
const boot = () => { TXT.clear(); if (reduce) { seek(dispOf(T_FIN) + S.stop + 300); return; } if (t0 >= 0) { seek(t0); return; } render(0); updateTimeline(0); play(true); };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot, boot);
})();
