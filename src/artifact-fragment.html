 * 站位与阻挡关系都在 05-阵型.js 里配（`阻挡位 / 遮挡位 / 对位 / 相邻位 / 被挡吗 / 阻挡束`）。
 * ========================================================================== */

const KIND_MELEE = '近战', KIND_DIRECT = '直射', KIND_INDIRECT = '曲射', KIND_AREA = '范围', KIND_HEAL = '修理';
/* 支援类（加增益 / 再动）：方案 3.3 的表里 `support`（伤害类）算「范围」，
   但作者 2026-10-10 定了要做的两种支援（Feena 的月光祝福、再动）没有伤害，
   所以单独判成「支援」，不参与「进攻」的武器挑选。 */
const KIND_SUPPORT = '支援';

/* 排号 ROW_FRONT / ROW_BACK、格子编号、阻挡关系都在 05-阵型.js 里（阵型可扩充） */

const RANGE_KIND = {
  melee: KIND_MELEE,
  direct: KIND_DIRECT,
  indirect: KIND_INDIRECT,
  map: KIND_AREA,
  support: KIND_AREA,
  heal: KIND_HEAL,
};

/** 武器的射程类型；第一期不做的武器返回 null（调用方直接跳过这把武器）。 */
function rangeKindOf(w) {
  const fire = w && w.fire;
  if (fire === 'passive' || fire === 'device') return null;
  // 没有伤害的支援武器（带 buff / grant 字段）单算一类
  if (fire === 'support' && (w.buff || w.grant)) return KIND_SUPPORT;
  return RANGE_KIND[fire] || KIND_DIRECT;   // 没写 fire 的按直射处理（wp() 的默认值也是 direct）
}

const isAreaKind = kind => kind === KIND_AREA;
const isHealKind = kind => kind === KIND_HEAL;
const isSupportKind = kind => kind === KIND_SUPPORT;
/* 带支援字段的支援武器（方案 3.3 之外，作者 2026-10-10 定） */
const hasSupportField = w => !!(w && (w.buff || w.grant));

/** 这个类型能不能打到指定那一排。frontAlive = 敌方前排是否还有人。
 *  ★ 近战规则**现状不变**：只能打前排，前排全灭才能打后排。 */
function rowReachable(kind, targetRow, frontAlive) {
  if (kind === KIND_MELEE) return targetRow === ROW_FRONT || !frontAlive;
  return true;
}

/** 「被挡」的命中修正（作者 2026-10-10 拍板改成**按位**）：
 *  直射 打**后排位**、而这个位的阻挡位（`遮挡位()`）里还有活人 → −20；其他情况 0。
 *  ★ 是命中修正，**不是打不到** —— 打得到，只是难打（`tests/grid.js` 第 [2] 段盯着）。
 *  职业特色（方案 6.3）：我方的狙击打后排没有这个惩罚。
 *  参数：`目标位` = 被打的格子编号；`活着的位` = 被打那一方还活着的位（Set / 数组 / 单位数组都行）。 */
function rowBlockPenalty(kind, 目标位, 活着的位, attacker) {
  if (职业是(attacker, '狙击')) return 0;
  if (kind !== KIND_DIRECT) return 0;          // 近战够不够得着看 rowReachable；曲射 / 范围无视阻挡
  return 被挡吗(目标位, 活着的位) ? -20 : 0;
}
/* 方案 6.3 的职业特色都只对我方生效（敌人按梯队，没有「职业」）。 */
const 职业是 = (u, k) => !!u && u.side === 'ally' && !!(u.tags && u.tags.战斗分类 === k);

/** 范围武器的落点：area 决定打哪些格子（没写 area 默认 row）。返回**升序**的 slot 数组。
 *  新几何（作者 2026-10-10 拍板，配置在 05-阵型.js）：
 *   - row   = 那一整排（前 4 格 / 后 5 格）；
 *   - col   = **阻挡束**：一个前排位 + 它挡的 1–2 个后排位（`阻挡束(位)`）；
 *   - cross = 目标位 + 同排左右邻居 + 对位（有阻挡关系的那 1–2 格）；
 *   - all   = 全场 9 格。 */
function areaSlots(w, row, col) {
  const area = (w && w.area) || 'row';
  const 位 = slotOf(row, col);
  let out;
  if (area === 'all') {
    out = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < 行列数(r); c++) out.push(slotOf(r, c));
  } else if (area === 'col') {
    out = 阻挡束(位).slice();
  } else if (area === 'cross') {
    out = [位];
    const r = rowOfSlot(位), c = colOfSlot(位);
    if (有这一列(r, c - 1)) out.push(slotOf(r, c - 1));
    if (有这一列(r, c + 1)) out.push(slotOf(r, c + 1));
    for (const s of 对位(位)) if (!out.includes(s)) out.push(s);
  } else {                                   // 'row' 与没写的都按一整排
    out = [];
    for (let c = 0; c < 行列数(row); c++) out.push(slotOf(row, c));
  }
  return [...new Set(out)].sort((a, b) => a - b);
}
/* ============================================================================
 * 战斗计算（方案 6.1）· 照抄机甲战棋的数值部分
 * ----------------------------------------------------------------------------
 * 抄的是战棋 v0.37/v0.42 的公式，**去掉朝向、地形、区域、压制、援护、特技、藏品、肉鸽**。
 * 每段的出处都写在注释里，Claude 复审时（方案第 11 节）对着看：
 *
 *   命中 / 暴击          ← 15-战斗计算.js:11-31     （去掉 zone / 地形 / tfx / 烟雾 / 赌神）
 *   属性                  ← 15-战斗计算.js:46-49     （STAT_KEY / statNames / statVal / atkStat，原样）
 *   伤害系数             ← 15-战斗计算.js:91        coef = 1 +（攻击能力值 − 防御值）/ 100
 *                          方案里把这个系数叫 `statCoef`；**战棋源码里没有这个函数名**，
 *                          它是写死在 dmgCore 里的一行内联表达式。这里补了一个同名函数，
 *                          数值与战棋完全一致（见下面 statCoef）。
 *   伤害主体             ← 15-战斗计算.js:52-106    （去掉 g.pct / Hooks / 朝向 pierce / 地形）
 *   暴击倍率             ← 03-能力与减免管线.js:164  （×2；零式 ×2.5 是特技，第一期不做）
 *   弱点 / 抗性          ← 03-能力与减免管线.js:170-181（去掉「背面」这一项，新项目没有朝向）
 *   减免管线             ← 03-能力与减免管线.js:202-242（只留数值类：防御姿态 / 物理减免 /
 *                          防御增益 / 能量屏障 / λ 力场 / 护盾；其余条目是特技，第一期不做）
 *   修理回复量           ← 17-战斗执行.js:259
 *   武器可用性 / 开场冷却 ← 13-武器可用性.js:7-16    （unlock 等级门、次数、冷却、startCd）
 *   武器数值取升级后      ← 13-武器可用性.js:32      wv()
 *
 * 【方案与源码不一致的地方（已记在 协作/任务板.md 里，等作者确认）】
 *   1. 方案写的 `statCoef` / `ENEMY_SCALE` 在战棋源码里都不存在（`ENEMY_SCALE` 见 11-敌方梯队.js 的说明）；
 *   2. 方案写的减免顺序「屏障 → 百分比 → 装甲 → 力场 → 护盾」与源码不同，
 *      源码是：弱点/抗性并进威力 → 装甲 → 防御值（stage 2 只是给 D 加数）→ 公式 → 屏障 → λ 力场 → 护盾。
 *      这里按**源码**实现。
 * ========================================================================== */

/* ---------- 属性 ---------- */
const STAT_KEY = { 格斗: 'melee', 射击: 'shoot', 觉醒: 'awaken', 防御: 'defense' };
const statNames = w => String(w.stat || '射击').split('+');
const statVal = (u, k) => u[STAT_KEY[k]] ?? 100;
const atkStat = (u, w) => Math.round(statNames(w).reduce((a, k) => a + statVal(u, k), 0) * (w.statMul || 1));

/* ---------- 增益 / 装甲 / 破防 ---------- */
const buffSum = (u, k) => (u.buffs || []).reduce((a, b) => a + (b[k] || 0), 0);
const effArmor = u => Math.max(0, Math.round(u.armor * Math.max(0, 1 + buffSum(u, 'armorPct') / 100)) - (u.armorCut || 0));
const breakSum = u => (u.debuffs || []).reduce((a, b) => a + b.pct, 0);
const defMul = u => Math.max(0, 1 - breakSum(u) / 100);
const critMul = () => 2;   // 战棋：暴击威力 ×2（零式 ×2.5 走特技，第一期不做）

/* 地图炮必中（战棋原样）。注意：新项目的「范围」类就是从 map / support 换算来的，
   所以从 map 过来的范围武器保留战棋的必中；从 support 过来的走正常命中判定。 */
const isSure = w => w.fire === 'map' || w.fire === 'passive';

/* 能力开关。战棋里还有「Lv10 起才生效」的 ABIL 等级表（属于特技），第一期去掉。 */
const abilOn = (u, k) => !!u && Array.isArray(u.abilities) && u.abilities.includes(k);
const shieldOn = u => !!u && u.shield > 0 && u.shieldHp > 0;
const lsLeft = (u, turn) => u.lsTurn !== turn ? 2 : 2 - (u.lsCount || 0);   // λ 力场：每回合 2 次

/* ---------- 命中 / 暴击 ---------- */
/* 职业特色（方案 6.3）也在这里生效：
 *   尖兵：每回合第一次被攻击时闪避 +20（打完这一下就把这一回合的加成用掉）；
 *   狙击：打后排没有被挡惩罚（在 30-射程.js 的 rowBlockPenalty 里）、暴击率 +10。 */
function hitRate(att, w, def, opts = {}) {
  if (isSure(w)) return { hit: 100, raw: 100, eva: 0, sure: true };
  const 尖兵闪 = (职业是(def, '尖兵') && def.尖兵闪避Turn !== opts.turn) ? 20 : 0;
  const eva = Math.max(0, def.eva - (def.dodgePen || 0)) + buffSum(def, 'eva') + (def.moveEva || 0) + 尖兵闪;
  const h = (opts.baseHit ?? w.hit) - eva + Math.round(((att.aim ?? 160) - 160) / 2) + buffSum(att, 'hit') + (opts.blockPenalty || 0);
  return { hit: clamp(Math.round(h), 0, 100), raw: Math.round(h), eva, 尖兵闪 };
}
function critRate(w, att) {
  if (isSure(w)) return 0;
  return clamp(10 + ((att && att.critBase) || 0) + (w.critMod || 0) + buffSum(att, 'crit') + (职业是(att, '狙击') ? 10 : 0), 0, 100);
}

/* ---------- 弱点 / 抗性 ---------- */
/* 正数 = 弱点（生成阶段增伤），负数 = 抗性（百分比减免阶段，受破防削弱）。没有「背面」。 */
function weakList(def, w, o = {}) {
  if (!def.weak || !w) return [];
  const out = [];
  for (const [k, v] of Object.entries(def.weak)) {
    const ok = (k === '光束' || k === '物理') ? w.dmgType === k
      : k === '近战' ? w.fire === 'melee'
      : k === '直射' ? w.fire === 'direct'
      : k === '曲射' ? w.fire === 'indirect'
      : k === '范围' ? isSure(w)
      : k === '暴击' ? !!o.crit
      : k === '多段' ? (w.special === 'multi' || w.hits > 1)
      : false;
    if (ok) out.push([k, v]);
  }
  return out;
}

/* ---------- 减免管线 ----------
 * stage 1 / 3 / 4 = 公式算完之后的门槛与吸收；stage 2 = 给「防御值」加数。
 * 第一期只保留数值类，带特技的条目（地形 / 正面装甲 / GN 全盾 / 光束反射 /
 * SEED 防御 / λ 驱动器 / 减伤）**不做**，等 Claude 出换算方案（方案 6.2）。 */
const REDUCTIONS = [
  /* 「防御」指令 / 守护替人挨打：这一下按防御结算 → 防御值 +50（方案第 4 节） */
  { id: 'guard', name: '防御姿态', stage: 2, applies: c => !!c.defending, def: () => 50 },
  { id: 'physRed', name: '物理减免', stage: 2, applies: c => c.w.dmgType === '物理' && buffSum(c.def, 'physRed') > 0, def: c => buffSum(c.def, 'physRed') },
  { id: 'buffDef', name: '防御增益', stage: 2, applies: c => buffSum(c.def, 'def') !== 0, def: c => buffSum(c.def, 'def') },
  /* 「减伤」入口（藏品用；★ 这一版新加，出处见下面的说明）：
   * 战棋把「减伤 %」算在 softRed 里、stage 2 加到**防御值**上（03-能力与减免管线.js:230-232、259），
   * 那里写着 `Math.min(90, softRed(c))`。我们照抄这一条，只读 buffSum(def,'red')。
   * **没有藏品的战斗 buffSum 是 0 → applies 为假 → 一行都不进步骤**，公式与改动前逐字相同。 */
  { id: 'relicRed', name: '减伤', stage: 2, applies: c => buffSum(c.def, 'red') > 0, def: c => Math.min(90, buffSum(c.def, 'red')) },
  {
    id: 'barrier', name: '能量屏障', stage: 1,
    applies: c => abilOn(c.def, 'barrier') && c.def.barrierLeft > 0 && c.dmg <= 2500,
    apply: c => { c.dmg = 0; c.nullified = true; if (!c.preview) c.def.barrierLeft--; return `≤2500 无效化（剩 ${c.def.barrierLeft} 次）`; },
  },
  {
    id: 'lambdaShield', name: 'λ 力场', stage: 3,
    applies: c => c.dmg > 0 && abilOn(c.def, 'lambdaShield') && lsLeft(c.def, c.turn) > 0,
    apply: c => {
      const a = Math.round(3000 * c.defMul);
      c.dmg = Math.max(0, c.dmg - a);
      if (!c.preview) { if (c.def.lsTurn !== c.turn) { c.def.lsTurn = c.turn; c.def.lsCount = 0; } c.def.lsCount++; }
      return `−${a}（本回合剩 ${Math.max(0, lsLeft(c.def, c.turn) - (c.preview ? 1 : 0))} 次）`;
    },
  },
  {
    id: 'shield', name: '护盾', stage: 4,
    applies: c => c.dmg > 0 && shieldOn(c.def),
    apply: c => {
      const a = Math.min(c.dmg, c.def.shieldHp);
      c.dmg -= a;
      if (!c.preview) c.def.shieldHp -= a;
      return `吸收 ${a}（护盾剩 ${c.def.shieldHp - (c.preview ? a : 0)}）`;
    },
  },
];

/* ---------- 伤害系数 ---------- */
/* 方案里叫 `statCoef`：战棋源码 15-战斗计算.js:91 的 `const coef = 1 + (atk - D) / 100`。 */
const statCoef = (atk, D) => 1 + (atk - D) / 100;

/* ---------- 伤害主体 ----------
 * 伤害 =（威力 − 装甲）× statCoef（攻击能力值 − 防御值），命中后最少 10。
 * o = {power, crit, preview, turn, useStat}
 * 返回 c：{dmg, steps, nullified, defMul}；preview=true 时**不改任何状态**。 */
function dmgCore(att, w, def, o = {}) {
  const c = {
    att, def, w, preview: o.preview !== false, crit: !!o.crit, turn: o.turn || 0,
    defMul: defMul(def), steps: [], nullified: false,
    /* 这一下是不是按防御结算：单位的「防御」指令，或替队友挡下的那一下（方案第 4 节） */
    defending: !!o.defending || !!def.defending,
  };
  const special = w.dmgType === '特殊', ign = !!w.ignoreDef, useStat = o.useStat !== false;

  /* 1. 武器威力：弱点 / 抗性 → 暴击 */
  let W = o.power;
  const wn = [`威力 ${o.power}`];
  const wk = weakList(def, w, c);
  if (wk.length) {
    const pos = wk.filter(([, v]) => v > 0).reduce((a, [, v]) => a + v, 0);
    const neg = wk.filter(([, v]) => v < 0).reduce((a, [, v]) => a + v, 0) * (ign ? 0 : c.defMul);
    const v = Math.max(-95, pos + neg);
    if (v) { W *= 1 + v / 100; wn.push(wk.map(([k, x]) => `${x > 0 ? '弱点' : '抗性'}·${k} ${x > 0 ? '+' : ''}${x}%`).join('、')); }
  }
  if (c.crit) { const x = critMul(); W *= x; wn.push(`暴击 ×${x}`); }
  W = Math.round(W);

  /* 2. 装甲（特殊伤害 / 无视防御按 0） */
  let A = 0;
  if (!special && !ign) A = Math.round(effArmor(def) * c.defMul);

  /* 3. 攻击能力值（战棋里还有特技 / 藏品 / 肉鸽的加成，第一期都没有）
   * ★ 这一版新加「伤害加成」入口（藏品用，出处：战棋 03-能力与减免管线.js:185-188 的 genMods ——
   *   v0.37 起「伤害 +N%」改成「攻击能力值 +N」，所以这里加在 `atk` 上，不是最后乘伤害）。
   *   加数只来自 buffSum(att,'dmg')，也就是藏品的 `src:'藏品'` 那条常驻 buff；
   *   没有藏品时它是 0，`atk` 与改动前完全一样（tests/sim.js 的胜率表盯着这一条）。 */
  const 伤害加成 = (useStat && att) ? buffSum(att, 'dmg') : 0;
  const atk = ((useStat && att) ? atkStat(att, w) : 0) + 伤害加成;

  /* 4. 防御值：基础防御 + stage 2 的数值条目，整体 × 破防 */
  let D = 0; const dn = [];
  if (!special && !ign) {
    if (useStat && def.defense) { D += def.defense; dn.push(`防御 ${def.defense}`); }
    for (const r of REDUCTIONS) {
      if (r.stage !== 2 || !r.applies(c)) continue;
      const v = r.def(c); if (!v) continue;
      D += v; dn.push(`${r.name} ${v < 0 ? '−' + (-v) : '+' + v}`);
    }
    if (c.defMul < 1 && D) { D = Math.round(D * c.defMul); dn.push(`破防 ×${+c.defMul.toFixed(2)}`); }
  }

  const coef = statCoef(atk, D), base = Math.max(0, W - A);
  c.dmg = Math.max(10, Math.round(base * coef));
  c.steps.push(`威力 ${W}${A ? ` − 装甲 ${A}` : ''} = ${base}${wn.length > 1 ? `（${wn.join('，')}）` : ''}`);
  c.steps.push(`× statCoef（1 +（攻击 ${atk}${伤害加成 ? `（含伤害加成 +${伤害加成}）` : ''} − 防御 ${D}）/ 100）= ×${+coef.toFixed(2)}${dn.length ? `（防御：${dn.join('、')}）` : ''}`);
  c.steps.push(`= ${c.dmg}${base * coef < 10 ? '（命中后最少 10）' : ''}`);

  if (ign) { c.steps.push('无视防御：不经过屏障 / 力场 / 护盾'); return c; }

  /* 5. 能量屏障 → λ 力场 → 护盾（战棋 03:99-104） */
  for (const stg of [1, 3, 4]) for (const r of REDUCTIONS) {
    if (r.stage !== stg || !r.applies(c)) continue;
    const note = r.apply(c); c.dmg = Math.max(0, Math.round(c.dmg));
    c.steps.push(`${r.name} ${note} → ${c.dmg}`);
    if (c.nullified) return c;
  }
  return c;
}

/* ---------- 升级后的武器数值（13-武器可用性.js:32，原样） ----------
 * Lv30 之类的 upgrades 会覆盖 power / range；方案第 2 节说升级加点照搬。 */
function wv(u, w, key) { let v = w[key]; for (const up of w.upgrades || []) if (u.lv >= up.lv && up[key] != null) v = up[key]; return v; }

/* ---------- 期望伤害（方案 5.1.1：命中率 × 伤害，暴击按 1 + 暴击率 计） ---------- */
function expectedDamage(att, def, w, opts = {}) {
  const hits = Math.max(1, w.hits || 1);
  const hr = hitRate(att, w, def, { blockPenalty: opts.blockPenalty || 0 }).hit / 100;
  const crit = 1 + critRate(w, att) / 100;
  const dmg = dmgCore(att, w, def, { power: wv(att, w, 'power'), preview: true, turn: opts.turn || 0 }).dmg;
  return hr * dmg * crit * hits;
}

/* ---------- 武器可用性（13-武器可用性.js:7-16 / 18-31 的数值部分） ---------- */
const START_CD_ULT = 3;   // 大招（unlock ≥ 20）开场冷却 3 回合
const startCdOf = w => w.startCd != null ? w.startCd : (w.unlock >= 20 ? START_CD_ULT : 0);

/* 第一期不做的武器（方案 6.2）：带 special 的特殊武器全部不用，
   例外是方案明确要保留的「多段」（special === 'multi'）。
   另一个例外是作者 2026-10-10 定的两条支援：Feena 的「月光祝福」（buff）和「再动」（grant）——
   没有伤害的支援武器，用 buff / grant 字段标记。 */
function weaponPlayable(w) {
  if (w.fire === 'passive' || w.fire === 'device') return false;
  if (w.special && w.special !== 'multi') return false;
  if (w.fire === 'support' && !hasSupportField(w)) return false;   // 召唤 / 烟雾 / 回复% 之类的支援第一期不做
  return true;
}

/** 这台机体现在能用哪些武器（等级门 / 次数 / 冷却 / 开场冷却）。返回运行期条目。 */
function usableWeapons(u, ctx) {
  return (u.weapons || []).filter(e => {
    const w = e.t;
    if (!weaponPlayable(w)) return false;
    if (u.lv < w.unlock) return false;
    if (e.uses != null && e.uses <= 0) return false;
    if (e.cd > 0) return false;
    if (ctx && ctx.turn != null && ctx.turn < e.readyTurn) return false;
    if (!(w.power > 0) && !isHealKind(rangeKindOf(w)) && !isSupportKind(rangeKindOf(w))) return false;
    return true;
  });
}

/** 用掉一次：普通冷却 + 次数 −1（开场冷却由 readyTurn 管，不在这里） */
function spendWeapon(u, entry) {
  if (!entry) return;
  if (entry.t.cd) entry.cd = entry.t.cd;
  if (entry.uses != null) entry.uses--;
}

/* ---------- 修理 ---------- */
const healAmount = (u, w) => Math.round(w.power * u.shoot / 100);   // 17-战斗执行.js:259

/* 特种的降命中值（作者 2026-10-10：先按 20 做，和原来「防御 −20」同一个量级；要调就改这一个常量） */
const 特种降命中值 = 20;

/* ---------- 一次普通攻击的结算（第一期唯一的攻击路径） ----------
 * 随机数全部走 ctx.rng（带种子，方案 6.1）。返回一条战斗记录用的文本 + 字段。
 * 多段：w.hits 段，每段独立判定命中与暴击；武器写了 w.step 时命中后逐段递减命中（战棋 multi 的做法）。
 * opts：
 *   blockPenalty  直射打后排的 −20（方案 3.3）
 *   defending     这一下按防御结算（守护替队友挨打）
 *   伤害倍率       守护者本回合自己攻击时 ×0.7（方案第 4 节：伤害 −30%）
 * 职业特色（方案 6.3 + 作者 2026-10-10）：
 *   特种 = 武器命中后给对方挂「命中 −20」（持续到下回合结束，同一来源只留一份、不叠加）；
 *          作者原话：「推人其实还是可以设计，用来破坏对手的阵型，或者给对方上 DEBUFF，作为职业特色可以先设置降低命中率」；
 *   尖兵 = 每回合第一次被攻击闪避 +20。 */
function resolveAttack(att, def, w, ctx, opts = {}) {
  const rng = ctx.rng;
  const blockPenalty = opts.blockPenalty || 0;
  const 倍率 = opts.伤害倍率 == null ? 1 : opts.伤害倍率;
  const sure = isSure(w);
  const hits = Math.max(1, w.hits || 1);
  const rolls = [];
  let total = 0, landed = 0, crits = 0, p = w.hit;
  const 尖兵加成 = (职业是(def, '尖兵') && def.尖兵闪避Turn !== ctx.turn) ? 20 : 0;

  for (let i = 0; i < hits; i++) {
    const q = hitRate(att, w, def, { baseHit: p, blockPenalty, turn: ctx.turn }).hit;
    const hit = sure || rng() * 100 < q;
    if (hit) {
      const cr = !sure && rng() * 100 < critRate(w, att);
      const c = dmgCore(att, w, def, { power: wv(att, w, 'power'), crit: cr, preview: false, turn: ctx.turn, defending: opts.defending });
      const d = Math.round(c.dmg * 倍率);
      total += d; landed++; if (cr) crits++;
      rolls.push(`第 ${i + 1} 段（${sure ? '必中' : q + '%'}）${cr ? '暴击 ' : ''}${d}`);
      if (c.nullified) break;
      if (w.step) p -= w.step;
    } else {
      rolls.push(`第 ${i + 1} 段（${q}%）未中`);
      if (w.step) p += w.step;
    }
    if (def.hp - total <= 0) break;
  }

  def.hp = Math.max(0, def.hp - total);
  /* 尖兵：这一回合的「第一次被攻击闪避 +20」用掉了 */
  if (尖兵加成) def.尖兵闪避Turn = ctx.turn;
  /* 特种（作者 2026-10-10）：武器命中后给对方挂「命中 −20」——对方的攻击更难打中（到下回合结束，
     同一个来源只留一份，不叠加）。作者说推人 / 破坏阵型以后可以单独设计，职业特色先做降命中。 */
  let 特种减命中 = 0;
  if (landed && 职业是(att, '特种')) {
    特种减命中 = 特种降命中值;
    def.buffs = (def.buffs || []).filter(b => b.src !== '特种');
    def.buffs.push({ src: '特种', hit: -特种减命中, 剩余: 2 });
  }

  const 段 = hits > 1 ? `${landed}/${hits} 段 ` : '';
  return {
    文本: landed
      ? `${att.name}【${w.name}】→ ${def.name}：${段}伤害 ${total}${crits ? `（暴击 ${crits} 次）` : ''}${特种减命中 ? `（特种：对方命中 −${特种减命中}，到下回合结束）` : ''}`
      : `${att.name}【${w.name}】→ ${def.name}：未命中（${rolls.join('；')}）`,
    字段: { 命中: landed > 0, 伤害: total, 段数: hits, 命中段数: landed, 暴击: crits, 目标剩余HP: def.hp, 特种减命中, 详情: rolls.join('；') },
  };
}
/* ============================================================================
 * 单位：把模板变成战场上的 Lv N 单位（方案 3.1 / 3.2 的站位与速度）
 * ----------------------------------------------------------------------------
 * 抄的出处：
 *   makeUnit      ← 07-状态.js:14-17     （去掉格子坐标 x/y、朝向、变身、ZOC 等）
 *   levelUp       ← 07-状态.js:18-26     （每级 +2、我方 Lv20 / Lv30 晋升 +25、装甲 +25%、闪避 +8、命中 +10）
 *   速度公式      ← 方案 3.2：机动（mov）× 10 + 闪避 ÷ 2，取整
 *
 * 站位：双方各 9 格 = 2 排（前排 4 + 后排 5），格子编号 slot = 排首格 + 列
 * （0–3 前排、4–8 后排；排首格 / 列数 / 阻挡关系都在 05-阵型.js）。
 * ========================================================================== */

const otherSide = s => s === 'ally' ? 'enemy' : 'ally';
const unitRow = u => rowOfSlot(u.slot);
const unitCol = u => colOfSlot(u.slot);
const speedOf = u => Math.round(u.mov * 10 + u.eva / 2);      // 方案 3.2
/* 职业（方案 6.3）：职业特色只对我方生效，敌人按梯队。判定函数在 30-射程.js。 */
const 战斗分类 = u => (u && u.tags && u.tags.战斗分类) || null;

/* 取某一方的单位列表；livingOf = 还活着的 */
const sideUnits = (side, ctx) => side === 'ally' ? ctx.allies : ctx.enemies;
const livingOf = (side, ctx) => sideUnits(side, ctx).filter(u => u.hp > 0);
const livingUnits = ctx => ctx.allies.concat(ctx.enemies).filter(u => u.hp > 0);
/* 这一排里还有没有人（近战能不能够到后排看它；直射的「被挡」改成**按位**看 `被挡吗()`） */
const frontAlive = units => units.some(u => unitRow(u) === ROW_FRONT);
/* 还活着的位集合：直射被挡判定（30-射程.js 的 `rowBlockPenalty` / 05-阵型.js 的 `被挡吗`）要用 */
const 活位们 = units => new Set(units.map(u => u.slot));

/* ---------- 升级（07-状态.js:18-26） ---------- */
function levelUp(u, heal = false) {
  u.lv++; u.maxHp += 200; if (heal) u.hp += 200;
  u.melee += 2; u.shoot += 2; u.awaken = (u.awaken ?? 100) + 2;
  u.defense = (u.defense || 0) + (u.side === 'neutral' ? 0 : 2);
  /* 晋升档位：我方 Lv20 / Lv30 基础属性再提升一档（敌人没有这一档） */
  if (u.side === 'ally' && (u.lv === 20 || u.lv === 30)) {
    const add = Math.round(u.maxHp * .25); u.maxHp += add; if (heal) u.hp += add;
    u.armor = Math.round(u.armor * 1.25); u.melee += 25; u.shoot += 25; u.awaken += 25; u.defense += 25; u.eva += 8; u.aim += 10;
    if (u.lv === 30) u.mov += 1;
  }
}

/* ---------- 造一台机体 ---------- */
function makeUnit(键, side, slot, lv) {
  const tpl = side === 'ally' ? tplOf(键) : ENEMY_T[键];
  if (!tpl) throw new Error(`编成里出现了不认识的${side === 'ally' ? '角色键' : '敌人键'}：${键}`);
  const u = Object.assign({}, tpl, {
    key: 键, side, slot, lv: 1,
    maxHp: tpl.hp, hp: tpl.hp,
    /* 精准：我方按战斗分类查 AIM_BY_CLASS，敌人默认 160（07-状态.js:15） */
    aim: tpl.aim ?? (side === 'ally' ? (AIM_BY_CLASS[(tpl.tags || {}).战斗分类] ?? 160) : 160),
    shieldHp: tpl.shield || 0,
    buffs: [], debuffs: [], armorCut: 0,
    barrierLeft: 3,          // 能量屏障开场 3 次（07-状态.js:15）
    name: side === 'ally' ? tpl.pilot : tpl.mech,
    /* 武器运行期状态：cd = 普通冷却（开场都是 0）、uses = 剩余次数、readyTurn = 开场冷却到第几回合 */
    weapons: tpl.weapons.map(w => ({ t: w, cd: 0, uses: w.uses, readyTurn: 1 + startCdOf(w) })),
  });
  while (u.lv < lv) levelUp(u, true);
  u.hp = u.maxHp;
  return u;
}

/* ---------- 造一整队 ----------
 * 编成条目的写法：{键:'B1', 位:0, 等级:10}（键 / 位 / 等级 都可以省略，
 * 位默认按顺序摆，等级默认：我方 10，敌人按第 1 层普通作战的等级曲线）。 */
const 默认等级 = (键, side) => side === 'ally' ? 10 : (runEnemyLv('battle', 1, 0) + TIER_LV[tierOfEnemy(键)]);

function makeUnits(编成, side) {
  return 编成.map((s, i) => {
    const 键 = s.键 || s.key || s.mech;
    const 位 = s.位 != null ? s.位 : (s.slot != null ? s.slot : i);
    const 等级 = s.等级 || s.lv || 默认等级(键, side);
    if (位 < 0 || 位 >= SLOTS) throw new Error(`编成里的位置 ${位} 越界（只有 0–${SLOTS - 1}）`);
    return makeUnit(键, side, 位, 等级);
  });
}
/* ============================================================================
 * 自动行为（AI）· 方案第 5 节
 * ----------------------------------------------------------------------------
 * 这个片段只做「挑一个动作」，不改状态、不算随机数，所以它是纯函数：
 *   同一个局面 → 同一个选择（决定性的比较 + 明确的并列规则）。
 *
 * 依赖（在 20-战斗计算.js / 40-单位.js / 30-射程.js 里定义，函数声明会提升，
 * 所以谁先谁后无所谓）：
 *   usableWeapons(u, ctx) → [{t: 模板武器, cd, uses, ...}]  「这台机体现在能用哪些武器」
 *   expectedDamage(att, def, w, opts) → 期望伤害（只用来比大小）
 *   unitRow(u) / livingOf(side, ctx) / frontAlive(units) / 活位们(units)
 *   rangeKindOf / rowReachable / rowBlockPenalty / isAreaKind / isHealKind / areaSlots
 *
 * 方案里的对应关系：
 *   5.1 我方「进攻」怎么挑       → chooseAttack()
 *   5.2 敌方（普通 / 近战 / 狙击 / overwatch / Boss）→ enemyAction()
 *   第 4 节 大招开关（自动 / 保留）→ u.holdUlt
 *
 * Boss 脚本（`61-Boss.js`，方案 5.2 的「每 N 回合大技能 + 半血换阶段」）**不写在这里**：
 * 它只在 `weaponPool` 里挂了一个纯函数钩子（`Boss本回合禁用`），
 * 由 `60-战斗.js` 的 `单位动作` 把敌方单位交给 `bossTurn`。没配脚本的敌人行为不变。
 * ========================================================================== */

/* 大招 = 战棋里 unlock 为 20 或 30 的武器，有开场冷却 3 回合（方案第 4 节）。
 * 开关「自动」= 冷却好了就放；「保留」= 这一回合不放（u.holdUlt）。 */
const ULT_UNLOCKS = [20, 30];
const isUltimate = w => !!w && ULT_UNLOCKS.includes(w.unlock);
const ultAllowed = (u, w) => isUltimate(w) && !u.holdUlt;

/* ---------- 修理阈值（作者 2026-10-10 拍板） ----------
 * 有人 HP 比例**低于这个值**时才优先修理；否则这个单位正常输出 / 上 debuff。
 * 出处：作者 2026-10-10 拍板（原来 M1 写的是「有伤就修」，见任务板 M1 段第 5 条）。
 * 要调就改这一个常量。0.6 = 60%。 */
const 修理阈值 = 0.6;

/* ---------- 5.1.2 目标优先级 ---------- */
/* 「能击破的目标优先（多个时打 HP 最高的那个，不浪费）；没有能击破的，
 *   打「期望伤害 ÷ 目标当前 HP」最大的。」                                         */
function targetScore(exp, t) {
  const canKill = exp >= t.hp;
  return { canKill, value: canKill ? t.hp : exp / Math.max(1, t.hp) };
}
/* 返回 true 表示 a 比 b 更该打 */
function betterTarget(a, b) {
  if (!b) return true;
  if (a.canKill !== b.canKill) return a.canKill;
  return a.value > b.value;
}

/* ---------- 5.1.1 武器优先级 ---------- */
/* 「能用的武器里，按对目标的期望伤害最大的选；大招开关为自动且冷却好时，大招优先。」 */
function weaponPool(actor, ctx) {
  const pool = usableWeapons(actor, ctx).filter(e => {
    const kind = rangeKindOf(e.t);
    if (kind === null || isHealKind(kind) || isSupportKind(kind)) return false;   // 被动 / 修理 / 支援 不参与「进攻」
    if (isUltimate(e.t) && actor.holdUlt) return false;   // 大招开关「保留」= 这一回合不放（方案第 4 节）
    /* 站桩 Boss 脚本（61-Boss.js）：间隔外不许把「大技能武器」当普通武器用，
       否则「每 N 回合放一次」就变成「每回合都放」。没配脚本的单位不受影响。 */
    if (Boss本回合禁用(actor, ctx, e.t)) return false;
    return true;
  });
  const ults = pool.filter(e => ultAllowed(actor, e.t));
  return ults.length ? ults : pool;                  // 大招优先（方案 5.1.1）
}

/* 目标那一方的「局面」：前排还有没有人（近战够不够得着）+ 还活着的位集合。
 * ★ 作者 2026-10-10 拍板「按位阻挡」之后，直射有没有被挡**不能再只看「前排还有没有人」**——
 *   要看**这个后排位的阻挡位**（`遮挡位()`）里还有没有活人，所以把活位一次性算好传下去。 */
const 局面Of = foes => ({ 前排有人: frontAlive(foes), 活位: foes.map(u => u.slot) });

/* 一台机体对某个敌人最划算的（武器, 期望伤害）。
 * 局面 = 上面那个 `{前排有人, 活位}`：决定近战能不能够到后排、直射有没有被挡（−20）。 */
function bestWeaponOn(actor, target, pool, 局面, ctx) {
  let best = null;
  for (const e of pool) {
    const kind = rangeKindOf(e.t);
    const trow = unitRow(target);
    if (!rowReachable(kind, trow, 局面.前排有人)) continue;
    const 罚 = rowBlockPenalty(kind, target.slot, 局面.活位, actor);
    const exp = expectedDamage(actor, target, e.t, { blockPenalty: 罚, turn: ctx && ctx.turn });
    if (!best || exp > best.exp) best = { entry: e, exp, 被挡: 罚 < 0 };
  }
  return best;
}

/* ---------- 普通目标（近战 / 直射 / 曲射） ---------- */
function pickSingleTarget(actor, foes, pool, ctx) {
  const 局面 = 局面Of(foes);
  let best = null;
  for (const t of foes) {
    const w = bestWeaponOn(actor, t, pool, 局面, ctx);
    if (!w) continue;
    const score = targetScore(w.exp, t);
    if (betterTarget(score, best && best.score)) best = { target: t, entry: w.entry, exp: w.exp, score, 被挡: w.被挡 };
  }
  return best;
}

/* ---------- 5.1.3 范围武器：按命中的敌人总期望伤害挑落点 ---------- */
function pickAreaTarget(actor, foes, pool) {
  let best = null;
  for (const e of pool) {
    if (!isAreaKind(rangeKindOf(e.t))) continue;
    for (let slot = 0; slot < SLOTS; slot++) {
      const hit = areaSlots(e.t, rowOfSlot(slot), colOfSlot(slot));
      const inside = foes.filter(t => hit.includes(t.slot));
      if (!inside.length) continue;
      const total = inside.reduce((n, t) => n + expectedDamage(actor, t, e.t, { blockPenalty: 0 }), 0);
      // 并列时取格子编号小的（决定性；不要用 sort 的顺序去赌）
      if (!best || total > best.exp) best = { target: inside[0], entry: e, exp: total, slot, hit: inside };
    }
  }
  return best;
}

/* ---------- 5.1 我方「进攻」 ---------- */
function chooseAttack(actor, ctx) {
  const foes = livingOf(otherSide(actor.side), ctx);
  if (!foes.length) return null;
  const pool = weaponPool(actor, ctx);
  if (!pool.length) return null;

  /* 「集火 ▶ 目标」（方案第 4 节）：玩家点了谁就打谁；打不到（例如近战够不到后排）
     就按「进攻」处理，继续往下走。 */
  if (actor.指令 === '集火') {
    const 指定 = (actor.指定目标 && actor.指定目标.hp > 0) ? actor.指定目标
      : (actor.指定目标位 != null ? foes.find(t => t.slot === actor.指定目标位) : null);
    if (指定) {
      const w = bestWeaponOn(actor, 指定, pool, 局面Of(foes), ctx);
      if (w) return { kind: 'attack', weapon: w.entry.t, target: 指定, expected: w.exp, entry: w.entry, 集火: true, 被挡: w.被挡 };
    }
  }

  const areaPool = pool.filter(e => isAreaKind(rangeKindOf(e.t)));
  const singlePool = pool.filter(e => !isAreaKind(rangeKindOf(e.t)));

  const cands = [];
  if (singlePool.length) {
    const s = pickSingleTarget(actor, foes, singlePool, ctx);
    if (s) cands.push({ kind: 'attack', weapon: s.entry.t, target: s.target, expected: s.exp, score: s.score, entry: s.entry, 被挡: s.被挡 });
  }
  if (areaPool.length) {
    const a = pickAreaTarget(actor, foes, areaPool);
    if (a) cands.push({ kind: 'attack', weapon: a.entry.t, target: a.target, expected: a.exp, slot: a.slot, hit: a.hit, entry: a.entry });
  }
  if (!cands.length) return null;
  // 单体 / 范围之间：能击破的先打，其次比期望值；范围武器的 exp 是总伤害，直接比数值
  cands.sort((x, y) => {
    const kx = x.score ? x.score : targetScore(x.expected, x.target);
    const ky = y.score ? y.score : targetScore(y.expected, y.target);
    if (kx.canKill !== ky.canKill) return kx.canKill ? -1 : 1;
    return ky.value - kx.value;
  });
  return cands[0];
}

/* ---------- 修理：我方任意一台，优先 HP 比例最低的（方案 3.3） ----------
 * 什么时候该修理、而不是进攻：**有人 HP 比例低于 修理阈值（0.6 = 60%）时才修**，
 * 否则返回 null、让 `aiAction` 往下走去正常出手（作者 2026-10-10 拍板，阈值在上面）。
 * 注意：修理武器拿不拿得到由 `usableWeapons` / `weaponPlayable` 决定，这里**不额外卡条件**，
 * 所以修理工在该修的时候一定拿得到修理武器（tests/heal.js 第 [2] 段盯着这一条）。 */
function chooseHeal(actor, ctx) {
  const pool = usableWeapons(actor, ctx).filter(e => isHealKind(rangeKindOf(e.t)));
  if (!pool.length) return null;
  const mates = livingOf(actor.side, ctx);
  const hurt = mates.filter(u => u.hp / u.maxHp < 修理阈值);
  if (!hurt.length) return null;
  hurt.sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp) || a.slot - b.slot);
  const target = hurt[0];
  const e = pool[0];
  return { kind: 'heal', weapon: e.t, target, entry: e };
}

/* ---------- 支援类武器（加增益 / 再动）----------
 * 作者 2026-10-10 定：Feena 的「月光祝福」要做进去（全体队友不含自己、到本回合结束），
 * 她的大招「再动」= 让本回合已经行动过、期望伤害最高的队友立刻再行动一次。
 * 方案第 4 节明写「大招开关自动 = 冷却好了就放」，所以这里先挑能放的大招，再挑普通增援。 */
function grantTargetOf(actor, ctx) {
  const done = livingOf(actor.side, ctx).filter(u => u !== actor && u.actedTurn === ctx.turn && u.grantedTurn !== ctx.turn);
  if (!done.length) return null;
  let best = null;
  for (const u of done) {
    const a = chooseAttack(u, ctx);
    const v = a ? a.expected : 0;
    if (!best || v > best.v || (v === best.v && u.slot < best.u.slot)) best = { u, v };
  }
  return best.u;
}

function chooseSupport(actor, ctx) {
  const pool = usableWeapons(actor, ctx).filter(e => isSupportKind(rangeKindOf(e.t)));
  if (!pool.length) return null;
  const ults = pool.filter(e => ultAllowed(actor, e.t));
  const 有序 = (ults.length ? ults : []).concat(pool.filter(e => !ults.includes(e)));
  for (const e of 有序) {
    if (e.t.grant) {
      const t = grantTargetOf(actor, ctx);
      // 还没人行动过就没人能「再动」，这时退回去放增益
      if (t) return { kind: 'grant', weapon: e.t, target: t, entry: e };
      continue;
    }
    if (e.t.buff) {
      const mates = livingOf(actor.side, ctx).filter(u => u !== actor);
      if (mates.length) return { kind: 'buff', weapon: e.t, targets: mates, entry: e };
    }
  }
  return null;
}

/* ---------- 我方一台机体的动作 ----------
 * 顺序：修理 → 进攻 → 支援。修理只在**有人 HP 比例低于 修理阈值（60%）**时才抢在进攻前面
 * （作者 2026-10-10 拍板）；没人低于阈值就正常输出 / 上 debuff，一点血都不掉也不出手修。
 * 方案只写了「进攻」怎么挑；没有攻击手段的机体（例如第一期的 Feena）走到最后一步，
 * 用她唯一能做的事（月光祝福 / 再动），而不是直接跳过。 */
function aiAction(actor, ctx) {
  const heal = chooseHeal(actor, ctx);
  if (heal) return heal;
  const atk = chooseAttack(actor, ctx);
  if (atk) return atk;
  return chooseSupport(actor, ctx);
}

/* ---------- 5.2 敌方 ---------- */
/* 敌方的「战斗分类」：模板的 tags.战斗分类；没有就按武器推断。 */
function combatClassOf(u, ctx) {
  const t = u.tags && u.tags.战斗分类;
  if (t) return t;
  const kinds = usableWeapons(u, ctx || { turn: 1 }).map(e => rangeKindOf(e.t));
  if (kinds.every(k => k === KIND_MELEE)) return '近卫';
  if (kinds.some(k => k === KIND_INDIRECT)) return '狙击';
  return '重装';
}

/* 「近战敌人优先打我方前排血最少的」：只在候选目标里比当前 HP（小的优先）。 */
function pickLowestHp(actor, foes, pool, ctx) {
  const 局面 = 局面Of(foes);
  let best = null;
  for (const t of foes) {
    if (unitRow(t) !== ROW_FRONT) continue;
    const w = bestWeaponOn(actor, t, pool, 局面, ctx);
    if (!w) continue;
    if (!best || t.hp < best.target.hp) best = { target: t, entry: w.entry, exp: w.exp, score: targetScore(w.exp, t), 被挡: w.被挡 };
  }
  return best;
}

/* 「狙击类优先打后排」：后排打得到就打后排，打不到再按普通规则。 */
function pickBackRowFirst(actor, foes, pool, ctx) {
  const back = foes.filter(t => unitRow(t) === ROW_BACK);
  if (back.length) {
    const s = pickSingleTarget(actor, back, pool, ctx);
    if (s) return s;
  }
  return pickSingleTarget(actor, foes, pool, ctx);
}

function enemyAction(actor, ctx) {
  const foes = livingOf(otherSide(actor.side), ctx);
  if (!foes.length) return null;
  const pool = weaponPool(actor, ctx);
  if (!pool.length) return null;

  const cls = combatClassOf(actor, ctx);
  const allMelee = pool.every(e => rangeKindOf(e.t) === KIND_MELEE);

  let pick = null;
  if (cls === '狙击') pick = pickBackRowFirst(actor, foes, pool, ctx);
  else if (allMelee) pick = pickLowestHp(actor, foes, pool, ctx);
  if (!pick) pick = pickSingleTarget(actor, foes, pool, ctx);

  // 范围武器按总期望伤害比一比（5.1.3 对敌方同样适用）
  const areaPool = pool.filter(e => isAreaKind(rangeKindOf(e.t)));
  if (areaPool.length) {
    const a = pickAreaTarget(actor, foes, areaPool);
    if (a && (!pick || a.exp > pick.exp)) pick = { target: a.target, entry: a.entry, exp: a.exp, slot: a.slot, hit: a.hit };
  }
  if (!pick) return null;
  return { kind: 'attack', weapon: pick.entry.t, target: pick.target, expected: pick.exp, slot: pick.slot, hit: pick.hit, entry: pick.entry, 被挡: !!pick.被挡 };
}

/* ---------- overwatch（替代战棋的压制射击，方案 5.2） ----------
 * 「有 overwatch 的敌人改成：第一个行动的我方单位会被它先打一下」。
 * 名单沿用战棋的 ENEMY_OVERWATCH（04-武器与机体.js），第一期是狙击型。
 * 具体「什么时候打、每回合几次」在战斗引擎（60-战斗.js）里执行，
 * 这里只提供判断，以及给 M3 的意图显示复用。 */
const hasOverwatch = u => u.side === 'enemy' && ENEMY_OVERWATCH.includes(u.key);
/* ============================================================================
 * 战斗引擎：回合流程 + 指令 + 职业特色 + simulate()（方案 3.2 / 第 4 / 5 / 6.3 节）
 * ----------------------------------------------------------------------------
 * 对外接口（M3 起是「一回合一个回合地打」，因为玩家的指令会变，不能一次算完整场）：
 *
 *   开局(我方, 敌方, 种子, 指令表, 选项) → ctx   一次战斗的状态：双方单位、记录、带种子的随机数、
 *                                      **敌方增援波次**（`选项.波次`，编成表配；不传 = 没有增援）
 *                                     （里面会调 `藏品开战`，把这一局的藏品应用到双方；见 93-藏品.js）
 *   设指令(ctx, 指令表)               指令表 = { 位: {类型, 目标位, 保留大招} }
 *                                     类型 = 进攻（默认）/ 集火 / 守护 / 防御 / 换位（方案第 4 节）
 *   算意图(ctx)                        敌人这一回合打算打谁、用什么武器、期望多少伤害（方案 5.3，纯函数）
 *   打一回合(ctx)                      指令阶段 → 行动阶段 → 回合结束；返回**这一回合**的记录
 *   simulate(我方, 敌方, 指令, 种子)   一整场（M1 的接口，测试和以后的平衡工具用）
 *
 * 一个回合（方案 3.2）：全场单位按速度从高到低各行动一次（同速 → 我方先，再按列号），
 * 然后 buff / 冷却计时减 1。胜负：敌方全灭 = 胜；我方全灭或第 12 回合结束 = 败。
 *
 * 敌方单位的行动先过**站桩 Boss 脚本**（方案 5.2，`61-Boss.js`）：每 N 回合放一次大技能、
 * 半血换阶段。没配脚本的敌人原样走 `enemyAction`（50-AI.js），行为不变。
 * ========================================================================== */

const MAX_TURN = 12;          // 第 12 回合结束还没分出胜负 = 败（方案 3.2）
const ULT_START_CD = 3;       // 大招（unlock 20 / 30）开场冷却 3 回合（方案第 4 节）
const 指令们 = ['进攻', '集火', '守护', '防御', '换位'];

/* ---------- 记录 ---------- */
function pushLog(ctx, text, extra) {
  ctx.log.push(Object.assign({ 回合: ctx.turn, 文本: text }, extra || {}));
}
/* 记录里带上「谁 / 打谁」的阵营与格子：界面回放要靠它画血条、闪白、飘伤害数字。
   只用单位键不行——编成里常常有两台同名敌人（例如两个 grunt）。 */
const 谁 = u => ({ 单位方: u.side, 单位位: u.slot });
const 谁目标 = u => ({ 目标方: u.side, 目标位: u.slot });

/* ---------- 指令（方案第 4 节） ---------- */
const 默认指令 = () => ({ 类型: '进攻', 目标位: null, 保留大招: false });

function 设指令(ctx, 指令表) {
  for (const u of ctx.allies) {
    const c = Object.assign(默认指令(), (指令表 && 指令表[u.slot]) || {});
    u.指令 = 指令们.includes(c.类型) ? c.类型 : '进攻';
    u.指定目标位 = c.目标位 != null ? c.目标位 : null;
    u.holdUlt = !!c.保留大招;
  }
  return ctx;
}

/* ---------- 行动顺序 ---------- */
/* 速度从高到低；同速：我方先，再按列号（方案 3.2）。同速同列再按格子编号，保证决定性。 */
function actionOrder(ctx) {
  return livingUnits(ctx).sort((a, b) =>
    speedOf(b) - speedOf(a) ||
    (a.side === b.side ? 0 : a.side === 'ally' ? -1 : 1) ||
    colOfSlot(a.slot) - colOfSlot(b.slot) ||
    a.slot - b.slot
  );
}

/* ---------- 守护 / 嘲讽（方案第 4 节 / 6.3） ---------- */
/** 谁在守护谁：被守护者的格子 → 守护者。一名队友同时只能被一人守护（速度高的优先）。 */
function 守护关系(ctx) {
  const 表 = new Map();
  for (const u of actionOrder(ctx)) {
    const t = u.守护对象;
    if (!t || t.hp <= 0 || t === u) continue;
    if (!表.has(t.slot)) 表.set(t.slot, u);
  }
  return 表;
}
const 守护者 = (ctx, 被守护) => {
  const 表 = 守护关系(ctx);
  // 用单位引用比对：换位之后格子会变，只靠格子号会认错人
  for (const [位, g] of 表) if (g.守护对象 === 被守护 && g.hp > 0) return g;
  return null;
};
/** 重装（方案 6.3）：在前排时，敌方的单体攻击 50% 概率改打它。 */
function 嘲讽(ctx, 攻击者, 原目标) {
  if (攻击者.side !== 'enemy' || 原目标.side !== 'ally') return null;
  const 候选 = livingOf('ally', ctx).filter(u => 职业是(u, '重装') && unitRow(u) === ROW_FRONT && u !== 原目标 && u.hp > 0);
  if (!候选.length) return null;
  if (ctx.rng() >= 0.5) return null;                  // 50%（走带种子的随机数）
  候选.sort((a, b) => b.hp - a.hp || a.slot - b.slot);  // 并列时血多的（决定性）
  return 候选[0];
}

/* ---------- 回合开始（增援 + 指令解析 + 指挥 + 防御回报） ---------- */
function 回合开始(ctx) {
  /* 0. 增援（作者 2026-10-10 拍板）：波次表里写着「这一回合来一波」的，先补进空位。
     放在最前面 —— 补进来的敌人这一回合就按速度正常行动（和战棋 respawnFoes 一个时机）。 */
  增援(ctx);

  /* 1. 把「位」形式的指令解析成**单位引用**：换位之后引用不会错 */
  for (const u of livingOf('ally', ctx)) {
    u.守护对象 = null;
    u.指定目标 = null;
    if (u.指令 === '守护' && u.指定目标位 != null) {
      const t = livingOf('ally', ctx).find(x => x.slot === u.指定目标位);
      if (t && t !== u) u.守护对象 = t;
    }
    if (u.指令 === '集火' && u.指定目标位 != null) {
      u.指定目标 = livingOf('enemy', ctx).find(x => x.slot === u.指定目标位) || null;
    }
  }
  for (const u of livingOf('enemy', ctx)) { u.守护对象 = null; u.指令 = '进攻'; }

  /* 2. 指挥（方案 6.3）：回合开始时，同一排的队友命中 +10（本回合） */
  for (const c of livingOf('ally', ctx)) {
    if (!职业是(c, '指挥')) continue;
    const 同排 = livingOf('ally', ctx).filter(t => t !== c && unitRow(t) === unitRow(c));
    if (!同排.length) continue;
    for (const t of 同排) 换同源增益(t, '指挥', { hit: 10 });
    pushLog(ctx, `〔指挥〕${c.name} 让同一排的队友命中 +10（本回合）：${同排.map(t => t.name).join('、')}`,
      Object.assign({ 类型: '指挥', 单位: c.key, 目标: 同排.map(t => t.key), 目标位们: 同排.map(t => t.slot), 目标方们: 同排.map(t => t.side) }, 谁(c)));
  }

  /* 3. 防御的回报：上一回合选了「防御」的，这一回合开始回复 5% 最大 HP（方案第 4 节） */
  for (const u of livingUnits(ctx)) {
    if (!u.防御回复) continue;
    u.防御回复 = false;
    const amt = Math.min(Math.round(u.maxHp * 0.05), u.maxHp - u.hp);
    if (amt > 0) {
      u.hp += amt;
      pushLog(ctx, `${u.name} 防御调整完成，回复 ${amt}`, Object.assign({ 类型: '回复', 回复: amt, 目标剩余HP: u.hp }, 谁(u), 谁目标(u)));
    }
  }
}

/* ---------- 换位：算出该换到哪个格子（作者 2026-10-10 拍板：换到**相邻位**） ----------
 * 相邻位 = 同一排的左右邻居 + **有阻挡关系的对位**（05-阵型.js 的 `相邻位()`）：
 *   F0↔B0/B1、F1↔B1/B2、F2↔B2/B3、F3↔B3/B4（对位），同排还能左右挪一格。
 * 挑法（决定性的，不用随机）：① 先看**对位**里空着的那一格 → 移过去；② 再看同排左右空位；
 * ③ 全占着就和对位（先）或同排邻居（后）**互换**；④ 一个相邻位都没有 → null，这次换位作罢。 */
function 换位目标(ctx, actor) {
  const 占 = new Map(livingOf(actor.side, ctx).map(u => [u.slot, u]));
  const 候选 = [];
  for (const s of 对位(actor.slot)) if (!候选.includes(s)) 候选.push(s);
  for (const s of 相邻位(actor.slot)) if (!候选.includes(s)) 候选.push(s);
  const 空格 = 候选.filter(s => !占.has(s));
  if (空格.length) return 空格[0];
  const 有人 = 候选.filter(s => 占.has(s));
  return 有人.length ? 有人[0] : null;
}

/* ---------- 增援（作者 2026-10-10 拍板：敌方被击坠后按波次补人） ----------
 * 形状照战棋 `30b-关卡目标.js:96-105` 的持续刷新：
 *   `respawn: { every: N, lv, list: t => [键…] }`，触发在回合开始时
 *   （`if (rs && c.turn > 1 && (c.turn - 1) % rs.every === 0) { respawnFoes(rs.list(c.turn), rs.lv); log('敌方增援 N 台从右侧出现') }`）。
 * 本仓库把「间隔」在编成表里**展开成波次**（`70-编成.js` 的 `波次: [{回合, 来:[键…]}]`，
 * 回合号就是 `1 + 间隔×n`），所以这里只要「回合号对上了就补」。
 * 补进**空位**（前排先、再后排 —— 被击坠的格子空出来正好顶上）；一个空位都没有就作罢，照样写日志。
 * 日志统一写 `〔增援〕…`，记录里带 `数量 / 位们 / 单位们` 给界面用。 */
function 空位(ctx, side) {
  const 占 = new Set(livingOf(side, ctx).map(u => u.slot));
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < 行列数(r); c++) {
    const s = slotOf(r, c);
    if (!占.has(s)) return s;
  }
  return null;
}
function 增援(ctx) {
  for (const w of (ctx.波次 || [])) {
    if (!w || w.回合 !== ctx.turn) continue;
    const 来 = w.来 || [];
    const 位们 = [], 单位们 = [];
    let 没空位 = 0;
    for (const e of 来) {
      const s = 空位(ctx, 'enemy');
      if (s == null) { 没空位++; continue; }
      const u = makeUnit(e.键, 'enemy', s, e.等级);
      ctx.enemies.push(u);
      位们.push(s); 单位们.push(u.key);
    }
    if (位们.length) {
      pushLog(ctx, `〔增援〕第 ${ctx.turn} 回合：敌方 ${位们.length} 台赶到（${位们.map(位名).join('、')}：${单位们.join('、')}）`,
        { 类型: '增援', 数量: 位们.length, 位们, 目标方们: 位们.map(() => 'enemy'), 单位们 });
    }
    if (没空位) pushLog(ctx, `〔增援〕第 ${ctx.turn} 回合：还有 ${没空位} 台挤不进来（9 个位都占着）`, { 类型: '增援', 数量: 0, 结果: '没空位' });
  }
}

/* ---------- 一个单位这次行动做什么 ---------- */
function 单位动作(u, ctx) {
  /* 敌方走 Boss 脚本那一层（方案 5.2：每 N 回合大技能 + 半血换阶段，见 61-Boss.js）：
     没配脚本的敌人它原样转给 enemyAction，行为一个字节都不变。 */
  if (u.side === 'enemy') return bossTurn(u, ctx);
  switch (u.指令) {
    case '防御': return { kind: 'defend' };
    case '换位': return { kind: 'swap' };
    case '守护': return aiAction(u, ctx);      // 守护者照常攻击（伤害在结算时 −30%）
    default: return aiAction(u, ctx);          // 进攻 / 集火
  }
}

/* ---------- 一个单位行动一次 ---------- */
function actOnce(u, ctx) {
  if (u.hp <= 0) return;
  u.actedTurn = ctx.turn;              // 「再动」要知道谁这一回合已经行动过
  const action = 单位动作(u, ctx);
  let r = null;
  if (action) r = resolveAction(u, action, ctx);
  else pushLog(ctx, `${u.name} 没有能打到人的武器，跳过`, Object.assign({ 类型: '跳过', 单位: u.key }, 谁(u)));
  runAutoCast(u, ctx);                 // 残月的余响：行动结束后自动释放（被动）

  /* 近卫（方案 6.3）：击破目标后立刻再行动一次，每回合最多 1 次 */
  if (r && r.击破 > 0 && 职业是(u, '近卫') && u.近卫再动Turn !== ctx.turn) {
    u.近卫再动Turn = ctx.turn;
    ctx.again.push(u);
    pushLog(ctx, `〔连斩〕${u.name} 击破了目标，立刻再行动一次（近卫，每回合 1 次）`, Object.assign({ 类型: '连斩' }, 谁(u)));
  }
}

/* ---------- 增益：同一个来源只留一份（避免每回合叠成天文数字） ---------- */
function 换同源增益(u, src, buff) {
  u.buffs = (u.buffs || []).filter(b => b.src !== src);
  u.buffs.push(Object.assign({ src, 剩余: 1 }, buff));
}

/* ---------- 残月的余响（被动；范围由作者 2026-10-10 定为「敌方前排」） ---------- */
function runAutoCast(u, ctx) {
  if (u.echoTurn === ctx.turn) return;
  const pool = u.weapons.filter(e => e.t.special === 'echo' && u.lv >= e.t.unlock && e.cd <= 0);
  if (!pool.length) return;
  pool.sort((a, b) => a.t.unlock - b.t.unlock);
  const e = pool[pool.length - 1], w = e.t;
  const foes = livingOf(otherSide(u.side), ctx);
  const targets = 残月余响范围 === '敌方前排' ? foes.filter(t => unitRow(t) === ROW_FRONT) : foes;
  if (!targets.length) return;
  u.echoTurn = ctx.turn;
  if (w.cd) e.cd = w.cd;
  for (const t of targets) {
    if (t.hp <= 0) continue;
    const rec = resolveAttack(u, t, w, ctx, {});
    pushLog(ctx, `〔${w.name}〕${rec.文本}`, Object.assign({ 类型: '残月余响', 单位: u.key, 目标: t.key, 武器: w.name }, 谁(u), 谁目标(t), rec.字段));
  }
}

/* ---------- 结算一个动作（攻击 / 修理 / 增益 / 再动 / 防御 / 换位） ----------
   返回 { 击破: 这一下打死了几台 }，近卫的「连斩」要用。 */
function resolveAction(actor, action, ctx) {
  const w = action.weapon;
  const 空 = { 击破: 0 };

  /* Boss 蓄力（61-Boss.js）：这一回合不出手，记录已经在 bossTurn 里写好了 */
  if (action.kind === 'none') return 空;

  /* 支援①：加增益（月光祝福） */
  if (action.kind === 'buff') {
    const buff = wv(actor, w, 'buff') || w.buff || {};
    for (const t of action.targets) 换同源增益(t, w.name, buff);
    spendWeapon(actor, action.entry);
    pushLog(ctx, `${actor.name}【${w.name}】→ ${action.targets.map(t => t.name).join('、')}：${Object.entries(buff).map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join('、')}（到本回合结束）`,
      Object.assign({ 类型: '增益', 单位: actor.key, 武器: w.name, 目标: action.targets.map(t => t.key), 目标位们: action.targets.map(t => t.slot), 目标方们: action.targets.map(t => t.side) }, 谁(actor)));
    return 空;
  }

  /* 支援②：再动 */
  if (action.kind === 'grant') {
    const t = action.target;
    t.grantedTurn = ctx.turn;
    ctx.again.push(t);
    spendWeapon(actor, action.entry);
    pushLog(ctx, `${actor.name}【${w.name}】→ ${t.name}：再行动一次`, Object.assign({ 类型: '再动', 单位: actor.key, 目标: t.key }, 谁(actor), 谁目标(t)));
    return 空;
  }

  /* 防御（方案第 4 节）：不攻击；本回合受到的伤害按防御值 +50 结算；下回合开始回复 5% 最大 HP */
  if (action.kind === 'defend') {
    actor.defending = true;
    actor.防御回复 = true;
    pushLog(ctx, `${actor.name} 进入防御（本回合伤害按防御 +50 结算，下回合开始回复 5% HP）`, Object.assign({ 类型: '防御' }, 谁(actor)));
    return 空;
  }

  /* 换位（方案第 4 节 + 作者 2026-10-10：换到**相邻位**）：同排左右邻居 + 有阻挡关系的对位
     （F0↔B0/B1、F1↔B1/B2、F2↔B2/B3、F3↔B3/B4）。对面空着就移过去、有人就互换。本回合不攻击。 */
  if (action.kind === 'swap') {
    const 目标位 = 换位目标(ctx, actor);
    if (目标位 == null) {
      pushLog(ctx, `${actor.name} 没有可以换的位置（作罢）`, Object.assign({ 类型: '换位', 结果: '作罢' }, 谁(actor)));
      return 空;
    }
    const 对方 = livingOf(actor.side, ctx).find(x => x.slot === 目标位);
    const 原 = actor.slot;
    if (对方) { actor.slot = 对方.slot; 对方.slot = 原; }
    else actor.slot = 目标位;
    pushLog(ctx, `${actor.name} 换位到 ${位名(actor.slot)}${对方 ? `（和 ${对方.name} 互换）` : ''}`, Object.assign({ 类型: '换位', 位: actor.slot, 原: 原 }, 谁(actor)));
    return 空;
  }

  if (action.kind === 'heal') {
    const amount = healAmount(actor, w);
    const before = action.target.hp;
    action.target.hp = Math.min(action.target.maxHp, action.target.hp + amount);
    spendWeapon(actor, action.entry);
    pushLog(ctx, `${actor.name} 修理 ${action.target.name}，回复 ${action.target.hp - before}`, Object.assign({
      类型: '修理', 单位: actor.key, 目标: action.target.key, 武器: w.name, 回复: action.target.hp - before, 目标剩余HP: action.target.hp,
    }, 谁(actor), 谁目标(action.target)));
    return 空;
  }

  /* 攻击（含范围）：一次打落点上的所有敌人，或打单个目标 */
  const kind = rangeKindOf(w);
  const targets = isAreaKind(kind) ? (action.hit || []) : [action.target];
  const 守护方 = actor.指令 === '守护' && actor.守护对象 ? 0.7 : 1;   // 守护者自己攻击伤害 −30%
  /* 站桩 Boss 脚本（61-Boss.js）：这一阶段的伤害倍率（没配脚本 = 1，与守护的 ×0.7 相乘） */
  const 倍率 = 守护方 * Boss伤害倍率(actor);
  let 击破 = 0;

  for (const t of targets) {
    if (t.hp <= 0) continue;
    let 实际 = t, 按防御 = false;

    if (!isAreaKind(kind) && actor.side === 'enemy') {
      const g = 守护者(ctx, t);
      if (g) {
        实际 = g; 按防御 = true;
        pushLog(ctx, `〔守护〕${g.name} 替 ${t.name} 挡下这一击（按防御结算）`, Object.assign({ 类型: '守护', 目标: g.key, 原目标: t.key }, 谁(g), 谁目标(g)));
      } else {
        const 嘲 = 嘲讽(ctx, actor, t);
        if (嘲) {
          pushLog(ctx, `〔嘲讽〕${嘲.name} 把这一击勾了过去`, Object.assign({ 类型: '嘲讽', 目标: 嘲.key, 原目标: t.key }, 谁(嘲), 谁目标(嘲)));
          实际 = 嘲;
        }
      }
    }

    const 血 = 实际.hp;
    /* 被挡（作者 2026-10-10 拍板改成**按位**）：看**实际目标这一位**的阻挡位里还有没有活人。
       近战够不够得着由 AI 那边按 `rowReachable` 过滤，这里只管直射的 −20。 */
    const 活位 = livingOf(实际.side, ctx).map(x => x.slot);
    const blockPenalty = isAreaKind(kind) ? 0 : rowBlockPenalty(kind, 实际.slot, 活位, actor);
    const rec = resolveAttack(actor, 实际, w, ctx, { blockPenalty, defending: 按防御, 伤害倍率: 倍率 });
    if (血 > 0 && 实际.hp <= 0) 击破++;
    pushLog(ctx, rec.文本, Object.assign({ 类型: '攻击', 单位: actor.key, 目标: 实际.key, 武器: w.name, 集火: !!action.集火, 守护挡下: 按防御, 原目标: 按防御 ? t.key : null, 原目标位: 按防御 ? t.slot : null }, 谁(actor), 谁目标(实际), rec.字段));
  }
  spendWeapon(actor, action.entry);
  return { 击破 };
}

/* ---------- overwatch（方案 5.2）：第一个行动的我方单位会被它先打一下 ---------- */
function runOverwatch(ally, ctx) {
  for (const e of livingOf('enemy', ctx)) {
    if (!hasOverwatch(e) || e.overwatchFiredTurn === ctx.turn) continue;
    if (ally.hp <= 0) return;
    const action = enemyAction(e, ctx);
    if (!action) continue;
    e.overwatchFiredTurn = ctx.turn;
    pushLog(ctx, `〔压制射击〕${e.name} 抢先开火`, Object.assign({ 类型: '压制射击', 单位: e.key, 目标: ally.key }, 谁(e), 谁目标(ally)));
    resolveAction(e, action, ctx);
  }
}

/* ---------- 一个回合 ---------- */
function runTurn(ctx) {
  pushLog(ctx, `—— 第 ${ctx.turn} 回合 ——`, { 类型: '回合' });
  for (const u of actionOrder(ctx)) {
    if (ctx.result) return;
    if (u.hp <= 0) continue;
    if (u.side === 'ally') runOverwatch(u, ctx);     // 我方第一个行动的人会被压制射击
    if (u.hp <= 0) continue;
    actOnce(u, ctx);
    drainAgain(ctx);                                 // 「再动」「连斩」的队友立刻行动
    ctx.result = checkResult(ctx);
    if (ctx.result) return;
  }
}

/* ---------- 再动 / 连斩：被点名的队友立刻行动一次 ---------- */
function drainAgain(ctx) {
  while (ctx.again.length) {
    const g = ctx.again.shift();
    if (g.hp <= 0 || ctx.result) continue;
    actOnce(g, ctx);
    ctx.result = checkResult(ctx);
  }
}

/* ---------- 胜负（方案 3.2） ---------- */
function checkResult(ctx) {
  const alliesAlive = livingOf('ally', ctx).length;
  const enemiesAlive = livingOf('enemy', ctx).length;
  if (!enemiesAlive) return { 结果: '胜', 原因: '敌方全灭' };
  if (!alliesAlive) return { 结果: '败', 原因: '我方全灭' };
  return null;
}

/* ---------- 回合结束：buff / 冷却计时减 1（方案 3.2） ---------- */
function endTurn(ctx) {
  for (const u of livingUnits(ctx)) {
    for (const e of u.weapons) if (e.cd > 0) e.cd--;
    u.buffs = (u.buffs || []).filter(b => (b.剩余 = (b.剩余 == null ? 1 : b.剩余) - 1) > 0);
    u.defending = false;
  }
}

/* ---------- 开场 ----------
 * `选项`（可选）：`{ 波次: [{回合, 来:[{键, 等级}…]}…] }` —— 敌方增援的波次表
 * （编成表里配，`70-编成.js` 的 `编成波次到单位()` 把「第几回合来哪几台」换算好；
 * 不传 = 这一场没有增援，行为和以前一个字节都不变）。 */
function 开局(我方编成, 敌方编成, 种子, 指令表, 选项) {
  const rng = mulberry32((种子 >>> 0) || 1);
  const ctx = {
    turn: 1, 种子: (种子 >>> 0) || 1, rng,
    allies: makeUnits(我方编成, 'ally'), enemies: makeUnits(敌方编成, 'enemy'),
    log: [], result: null, again: [],
    波次: ((选项 && 选项.波次) || []).map(w => ({ 回合: w.回合, 来: (w.来 || []).map(e => ({ 键: e.键, 等级: e.等级 })) })),
  };
  /* 藏品（方案第 7 节 · 作者 2026-10-10 要做）：把 `肉鸽.RUN.藏品` 应用到**我方**出击机体
     （HP / 装甲 / 命中 / 暴击 / 闪避 / 伤害 / 减伤）和**敌方**（命中 / 装甲减益）。
     实现在 `93-藏品.js`；`肉鸽.RUN` 为空（菜单里的固定测试战斗、simulate 的单测）时它直接返回，
     所以那些战斗一个字节都不变。★ 这一版新加的接线，出处写在 93-藏品.js 的文件头。 */
  藏品开战(ctx.allies, ctx.enemies);
  for (const u of livingUnits(ctx)) {
    /* 开场冷却**只由 readyTurn 管**（= 1 + startCdOf(w)，规则见 13-武器可用性.js）：
       开场冷却 3 回合 = 第 4 回合才能用；普通冷却 cd 开场一律是 0。 */
    u.weapons = u.weapons.map(e => Object.assign({}, e, { cd: 0 }));
    u.指令 = '进攻'; u.指定目标位 = null; u.holdUlt = false;
  }
  设指令(ctx, 指令表);
  pushLog(ctx, `战斗开始：我方 ${ctx.allies.length} 台 vs 敌方 ${ctx.enemies.length} 台`, { 类型: '开始' });
  return ctx;
}

/* ---------- 敌人意图（方案 5.3）：纯函数，不改任何状态，给界面在指令阶段显示 ----------
 * 说明：这里算的是「如果现在开打，这个敌人会打谁」。目标中途倒下或被守护时就按规则改打
 * （守护挡下 / 重新挑目标），这一点在行动阶段由引擎自己处理。 */
function 算意图(ctx) {
  return livingOf('enemy', ctx).map(u => {
    /* Boss 脚本（61-Boss.js）也在这里生效：间隔 / 阶段会影响「这一回合它要做什么」。
       bossAction 是纯函数，所以指令阶段读它不会改动战斗状态。 */
    const a = bossAction(u, ctx);
    const bp = Boss参数(u);
    return {
      单位: u.key, 单位位: u.slot, 名称: u.name,
      武器: a && a.weapon ? a.weapon.name : null,
      目标: a && a.target ? a.target.key : null,
      目标位: a && a.target ? a.target.slot : null,
      目标名: a && a.target ? a.target.name : null,
      期望: a && a.expected ? Math.round(a.expected) : 0,
      压制射击: hasOverwatch(u),
       /* 直射打这个后排位**现在被挡着吗**（阻挡位里还有活人 → 命中 −20；打得到，只是难打）。
          界面上要跟这条规则一致：意图里写「被挡 −20」（作者 2026-10-10 拍板）。 */
      被挡: !!(a && a.被挡),
      命中修正: a && a.被挡 ? -20 : 0,
      /* Boss：这一发是不是大技能、现在第几阶段、还是这一回合在蓄力（界面上看得见节奏） */
      大技能: !!(a && a.大技能),
      Boss: !!bp,
      Boss阶段: bp ? bp.第几阶段 : null,
      蓄力: !a && !!bp,
    };
  });
}

/* ---------- 打一个回合 ---------- */
function 打一回合(ctx) {
  const 起 = ctx.log.length;
  回合开始(ctx);
  runTurn(ctx);
  if (!ctx.result) {
    if (ctx.turn >= MAX_TURN) ctx.result = { 结果: '败', 原因: `第 ${MAX_TURN} 回合结束还没分出胜负（按撤退处理）` };
    else { endTurn(ctx); ctx.turn++; }
  }
  return ctx.log.slice(起);
}

/* ---------- simulate（方案第 9 节 M1 的接口；一整场，指令固定不变） ---------- */
function simulate(我方, 敌方, 指令, 种子, 选项) {
  const ctx = 开局(我方, 敌方, 种子, 指令, 选项);
  let 护栏 = 0;
  while (!ctx.result && 护栏++ < MAX_TURN + 2) {
    设指令(ctx, 指令);
    打一回合(ctx);
  }
  if (!ctx.result) ctx.result = { 结果: '败', 原因: '超出回合上限' };
  pushLog(ctx, `战斗结束：${ctx.result.结果}（${ctx.result.原因}）`, { 类型: '结束' });
  return {
    结果: ctx.result.结果, 原因: ctx.result.原因, 回合数: ctx.turn,
    记录: ctx.log, 我方: ctx.allies, 敌方: ctx.enemies, 种子: ctx.种子, ctx,
  };
}
/* ============================================================================
 * 站桩大 Boss 的脚本框架（方案 5.2）
 * ----------------------------------------------------------------------------
 * 方案 5.2 原文：「Boss：各写一个简单脚本（每 N 回合放一次大技能、半血换阶段），
 *                第一期只做蓝色大肥鱼一个。」
 *
 * 新项目**没有格子地图**：战棋那套「逐格右移 / 碾压路线上的单位 / 到终点判负 /
 * 撞碎力场壁 / 永远朝右」全都搬不了（逐条见 `协作/战棋协作可搬清单.md` 第一节 A1–A12）。
 * 所以新项目里的 Boss 是**站着打的**：脚本只管两件事——「每 N 回合放一次大技能」和
 * 「半血换阶段」。作者 2026-10-10 拍板：「可以做站桩大boss」。
 *
 * 数据驱动：参数写在 `src/js/71-改动.js` 的 `Boss脚本` 里（新项目改数据只改那里），
 * 引擎这一侧只认下面这几个字段（**下面是初稿，作者试玩后再调**）：
 *
 *   Boss脚本[敌人键] = {
 *     大技能间隔: 3,             // 每 N 回合放一次：第 1、1+N、1+2N… 回合
 *     大技能武器: '周身冲击',     // 用数据里的武器名指定
 *     伤害倍率: 1,              // 第 1 阶段（基础参数）
 *     阶段: [ { 触发: '半血', 大技能间隔: 2, 伤害倍率: 1.25 } ],   // 半血换第 2 阶段
 *   }
 *
 * 规则（这一版自己定的地方，任务板里也写了）：
 *   1. **只对我方之外的单位生效**（`side === 'enemy'` 且键在 `Boss脚本` 里）；
 *      没配脚本的敌人一个字节的行为都不变（还是 50-AI.js 的 `enemyAction`）。
 *   2. 大技能回合：`（回合 − 1) % 大技能间隔 === 0`，也就是**第 1 回合起算**
 *      （第 1、4、7… 回合），这样开场第一回合就能在记录里看到它出手。
 *   3. 不是大技能回合时，大技能武器**不进普通 AI 的武器池**——否则它就变成「每回合都放」，
 *      「每 N 回合一次」就没有意义了。如果这名 Boss 除了大技能没有别的武器能打
 *      （蓝色大肥鱼只有一把「周身冲击」），这一回合就**蓄力**：不出手，记录里写
 *      `〔Boss〕… 蓄力中（第 N 回合释放【…】）`。玩家因此能看见「下一发什么时候来」。
 *   4. 阶段按**当前 HP 比例**判定（纯计算，不存状态）：`hp / maxHp <= 触发阈值` 就进那个阶段。
 *      `触发` 写 `'半血'`（= 0.5）或直接写数字（0.5 / 50 都认）；多个阶段按顺序判，
 *      **最后一个满足的生效**。基础参数 = 第 1 阶段，`阶段[0]` = 第 2 阶段，依此类推。
 *      换阶段只在战斗记录里报**一次**（`〔Boss〕蓝色大肥鱼 进入第 2 阶段`）。
 *   5. `伤害倍率` 是这一阶段下 Boss 造成的**全部**伤害的倍率（在 60-战斗.js 的
 *      `resolveAction` 里乘进去，和「守护者 ×0.7」相乘）；没配就是 1。
 *   6. 脚本自己**不含随机数**（阶段只看 HP、间隔只看回合号），所以同种子同结果照旧。
 *
 * 【不归我做的地方】大肥鱼的 240000 HP / 1800 装甲怎么按新公式换算成产品数值，
 * 由 Claude 定（`协作/战棋协作可搬清单.md` B1/B2 只列了事实）。这一版**照数据原样用**，
 * 所以 12 回合上限下打不死——任务板里写明了这一点，测试里只做「把 HP 临时改小」的验算。
 * ========================================================================== */

/* ---------- 取脚本：只认敌人 ---------- */
/** 这名单位有没有 Boss 脚本（`Boss脚本` 在 71-改动.js，新项目改数据只改那里）。 */
function 取Boss脚本(u) {
  if (!u || u.side !== 'enemy' || !u.key) return null;
  return (Boss脚本 && Boss脚本[u.key]) || null;
}
const 是Boss单位 = u => !!取Boss脚本(u);

/* ---------- 阶段（纯计算：只看当前 HP 比例） ---------- */
/** 触发条件 → HP 比例阈值：`'半血'` = 0.5；数字 0–1 直接用；数字 >1 当百分数（50 = 0.5）。 */
function Boss触发阈值(触发) {
  if (typeof 触发 === 'number') return 触发 > 1 ? 触发 / 100 : 触发;
  if (触发 === '半血') return 0.5;
  return null;   // 认不出来的触发条件：这一条阶段不生效（不抛异常）
}

/** 现在是第几阶段：0 = 基础（第 1 阶段），1 = `阶段[0]`（第 2 阶段）…；没脚本返回 0。 */
function Boss阶段序号(u) {
  const s = 取Boss脚本(u);
  if (!s || !Array.isArray(s.阶段) || !s.阶段.length || !(u.maxHp > 0)) return 0;
  const 血比 = u.hp / u.maxHp;
  let n = 0;
  for (let i = 0; i < s.阶段.length; i++) {
    const t = Boss触发阈值(s.阶段[i] && s.阶段[i].触发);
    if (t != null && 血比 <= t) n = i + 1;   // 后面的阶段覆盖前面的
  }
  return n;
}

/** 这一阶段实际生效的参数：基础字段 + 阶段覆盖（脚本没写的字段用默认值）。纯函数。 */
function Boss参数(u) {
  const s = 取Boss脚本(u);
  if (!s) return null;
  const 阶段 = Boss阶段序号(u);
  const o = (阶段 > 0 ? s.阶段[阶段 - 1] : null) || {};
  const 取 = (k, d) => (o[k] != null ? o[k] : (s[k] != null ? s[k] : d));
  return {
    脚本: s, 阶段, 第几阶段: 阶段 + 1,
    大技能间隔: 取('大技能间隔', 0),
    大技能武器: 取('大技能武器', null),
    伤害倍率: 取('伤害倍率', 1),
  };
}

/* ---------- 大技能的节奏 ---------- */
/** 这一回合是不是「大技能回合」：`（回合 − 1) % 间隔 === 0`（第 1、1+间隔、…回合）。 */
function Boss本回合放大技能(u, ctx) {
  const p = Boss参数(u);
  if (!p || !p.大技能武器 || !(p.大技能间隔 > 0)) return false;
  if (!ctx || ctx.turn == null) return false;
  return ((ctx.turn - 1) % p.大技能间隔) === 0;
}

/** 下一次大技能在第几回合（蓄力的记录里要写）。 */
function Boss下次技能回合(u, ctx) {
  const p = Boss参数(u);
  if (!p || !(p.大技能间隔 > 0) || !ctx || ctx.turn == null) return null;
  const 间隔 = p.大技能间隔;
  return ctx.turn + (间隔 - ((ctx.turn - 1) % 间隔));
}

/** 普通 AI 的武器池要不要**排除**这把武器（间隔外不许把大技能当普通武器用）。
 *  纯函数，被 50-AI.js 的 `weaponPool` 调用。 */
function Boss本回合禁用(u, ctx, w) {
  const p = Boss参数(u);
  if (!p || !p.大技能武器 || !(p.大技能间隔 > 0)) return false;
  if (!w || w.name !== p.大技能武器) return false;
  if (!ctx || ctx.turn == null) return false;
  return !Boss本回合放大技能(u, ctx);
}

/** 这一阶段下 Boss 伤害的倍率（没有脚本 / 没配 / 配错 → 1）。 */
function Boss伤害倍率(u) {
  const p = Boss参数(u);
  const v = p ? p.伤害倍率 : 1;
  return (typeof v === 'number' && v > 0) ? v : 1;
}

/* ---------- 大技能这一下打谁 ---------- */
/** 脚本点名的那把武器，现在能不能用（等级门 / 冷却 / 次数都照 `usableWeapons` 的规则）。 */
function Boss大技能条目(u, ctx) {
  const p = Boss参数(u);
  if (!p || !p.大技能武器) return null;
  return usableWeapons(u, ctx).find(e => e.t.name === p.大技能武器) || null;
}

/** 只用一把武器挑目标 / 落点：范围武器按「命中的敌人总期望伤害」挑，其余按单体挑。
 *  复用 50-AI.js 里的纯函数（`pickAreaTarget` / `pickSingleTarget`），不改那边。 */
function 单武器动作(u, 条目, ctx) {
  const foes = livingOf(otherSide(u.side), ctx);
  if (!条目 || !foes.length) return null;
  const w = 条目.t, pool = [条目];
  if (isAreaKind(rangeKindOf(w))) {
    const a = pickAreaTarget(u, foes, pool);
    if (a) return { kind: 'attack', weapon: w, target: a.target, expected: a.exp, slot: a.slot, hit: a.hit, entry: a.entry, 被挡: false };
  }
  const s = pickSingleTarget(u, foes, pool, ctx);
  if (s) return { kind: 'attack', weapon: w, target: s.target, expected: s.exp, entry: s.entry, 被挡: !!s.被挡 };
  return null;
}

/* ---------- 一台 Boss 这一回合想做什么 ---------- */
/** **纯函数**：不改状态、不写记录（`算意图()` 也用它，界面在指令阶段就能看见 Boss 的节奏）。
 *  返回 null = 这一回合没有出手的手段（大肥鱼在间隔外就是这样，由 bossTurn 记「蓄力」）。 */
function bossAction(u, ctx) {
  if (!取Boss脚本(u)) return enemyAction(u, ctx);          // 没配脚本 → 普通敌方 AI（行为不变）
  if (Boss本回合放大技能(u, ctx)) {
    const a = 单武器动作(u, Boss大技能条目(u, ctx), ctx);
    if (a) { a.大技能 = true; a.第几阶段 = Boss参数(u).第几阶段; return a; }
  }
  const a = enemyAction(u, ctx);
  if (a) return a;
  return null;
}

/* ---------- 真的行动：补记录 + 出手 ---------- */
/** 敌方单位的一次行动（60-战斗.js 的 `单位动作` 走这里）。
 *  - 先补「进入第 N 阶段」的记录（只报一次，所以这里是**会改状态**的那一半）；
 *  - 大技能回合：记录 `〔Boss〕…释放【…】`，再按大技能出手；
 *  - 间隔外又无别的武器：记录 `〔Boss〕…蓄力中`，这一回合不出手（kind: 'none'）。 */
function bossTurn(u, ctx) {
  const p = Boss参数(u);
  if (!p) return enemyAction(u, ctx);

  const 已报 = u.boss阶段已报 || 0;
  if (p.第几阶段 > 已报) {
    u.boss阶段已报 = p.第几阶段;
    /* 第 1 阶段 = 基础参数：报一次「登场」，让记录里一开场就能看见它的节奏；
       第 2 阶段起 = 换的那套参数，报「进入第 N 阶段」（方案 5.2 的「半血换阶段」）。 */
    const 文 = p.第几阶段 > 1
      ? `〔Boss〕${u.name} 进入第 ${p.第几阶段} 阶段（大技能间隔 ${p.大技能间隔} 回合、伤害倍率 ×${p.伤害倍率}）`
      : `〔Boss〕${u.name} 站桩 Boss：${p.大技能间隔 > 0 && p.大技能武器 ? `每 ${p.大技能间隔} 回合放一次【${p.大技能武器}】` : '（没配大技能）'}（伤害倍率 ×${p.伤害倍率}）`;
    pushLog(ctx, 文,
      Object.assign({ 类型: 'Boss', Boss事件: '阶段', Boss阶段: p.第几阶段, 大技能间隔: p.大技能间隔, 伤害倍率: p.伤害倍率 }, 谁(u)));
  }

  const a = bossAction(u, ctx);
  if (!a) {
    const 下次 = Boss下次技能回合(u, ctx);
    pushLog(ctx, `〔Boss〕${u.name} 蓄力中${下次 ? `（第 ${下次} 回合释放【${p.大技能武器}】）` : ''}`,
      Object.assign({ 类型: 'Boss', Boss事件: '蓄力', 大技能回合: 下次 }, 谁(u)));
    return { kind: 'none' };
  }
  if (a.大技能) {
    pushLog(ctx, `〔Boss〕${u.name} 释放【${a.weapon.name}】`,
      Object.assign({ 类型: 'Boss', Boss事件: '大技能', BOSS大技能: true, 武器: a.weapon.name,
        目标: a.target ? a.target.key : null, 目标位: a.target ? a.target.slot : null }, 谁(u)));
  }
  return a;
}

/** 按层 / 类型筛出候选编成。 */
function 选编成(层, 类型) {
  return 编成表.filter(e => (层 == null || e.层 === 层) && (类型 == null || e.类型 === 类型));
}

/** 从对应层 / 类型的候选里随机抽一条；**这一档没有编成就返回 null**（兜底见 `抽编成兜底`）。 */
function 抽编成(层, 类型, rng) {
  const 候选 = 选编成(层, 类型);
  if (!候选.length) return null;
  const r = rng || Math.random;
  return 候选[Math.min(候选.length - 1, Math.floor(r() * 候选.length))];
}

/* ---------------- 兜底：抽不到编成时**绝不静默退回大地图** ----------------
 * M4 出过一次这种 bug（打完终点 Boss 不通关那阵子）：某层某类型没编成 →
 * `抽当前编成()` 返回 null → 界面把提示写一行就退回大地图，玩家看着像「点了没反应」。
 * 现在 `抽编成兜底()` 按下面的顺序退，**每退一步都调 `记(一行中文)`**（界面传 `肉鸽.记`，
 * 于是这一行进 `RUN.日志`）。正常情况（表里 13 个组合都齐）第 ① 步就命中，一行日志都不会写。
 *   ① 本层 + 本类型
 *   ② 本层「普通」（作者点名的那个例子：退回同层的普通）
 *   ③ 本层别的类型（顺序 普通 → 精英 → 守军 → 侵蚀源 → Boss）
 *   ④ 别的层的同类型（层号离得近的先试）
 *   ⑤ 全表第一条（表非空就一定抽得到）
 * 返回 `{条目, 层, 类型, 兜底}`：`兜底` = null 表示没走兜底，否则是「为什么退」的一句原因。 */
const 兜底类型顺序 = ['普通', '精英', '守军', '侵蚀源', 'Boss'];
function 抽编成兜底(层, 类型, rng, 记) {
  const r = rng || Math.random;
  const 抽一条 = (l, t) => {
    const 候选 = 选编成(l, t);
    return 候选.length ? 候选[Math.min(候选.length - 1, Math.floor(r() * 候选.length))] : null;
  };
  const 第一步 = () => {
    const 条目 = 抽一条(层, 类型);
    return 条目 ? { 条目, 层, 类型, 兜底: null } : null;
  };
  let 结果 = 第一步();
  if (结果) return 结果;
  const 退到 = (条目, 实际层, 实际类型, 原因) => {
    if (记) 记(`编成兜底：第 ${层} 层没有「${类型}」编成 → 改用第 ${实际层} 层「${实际类型}」编成（${原因}）`);
    return { 条目, 层: 实际层, 类型: 实际类型, 兜底: 原因 };
  };
  /* ② 本层的「普通」 */
  if (类型 !== '普通') {
    const 条目 = 抽一条(层, '普通');
    if (条目) return 退到(条目, 层, '普通', '这一层没有这个类型的编成，退回同层普通');
  }
  /* ③ 本层别的类型 */
  for (const t of 兜底类型顺序) {
    if (t === 类型 || t === '普通') continue;              // 本类型试过、普通试过
    const 条目 = 抽一条(层, t);
    if (条目) return 退到(条目, 层, t, '这一层连普通都没有');
  }
  /* ④ 别的层的同类型（先近后远） */
  const 层们 = [...new Set(编成表.map(e => e.层))].filter(l => l !== 层)
    .sort((a, b) => Math.abs(a - 层) - Math.abs(b - 层) || a - b);
  for (const l of 层们) {
    const 条目 = 抽一条(l, 类型);
    if (条目) return 退到(条目, l, 类型, '这一层什么编成都没有');
  }
  /* ⑤ 全表第一条 */
  const 最后的 = 编成表[0];
  return 退到(最后的, 最后的.层, 最后的.类型, '全表都没有这个类型');
}

/** 把一条编成变成"敌方单位数组"。场次 = 本层打到第几场（影响等级）。 */
function 编成到单位(条目, 场次 = 0) {
  const kind = 类型到Kind[条目.类型] || 'battle';
  const 前排 = 条目.前 || [], 后排 = 条目.后 || [];
  const 列表 = [];
  前排.slice(0, 行列数(ROW_FRONT)).forEach((键, i) => 列表.push({ 键, 位: slotOf(ROW_FRONT, i), 等级: runEnemyLv(kind, 条目.层, 场次) + TIER_LV[tierOfEnemy(键)] }));
  后排.slice(0, 行列数(ROW_BACK)).forEach((键, i) => 列表.push({ 键, 位: slotOf(ROW_BACK, i), 等级: runEnemyLv(kind, 条目.层, 场次) + TIER_LV[tierOfEnemy(键)] }));
  return makeUnits(列表, 'enemy');
}

/* ---------- 增援波次（作者 2026-10-10 拍板）----------
 * 编成表里的 `波次: [{回合, 来:[键…]}]` → 喂给 `开局()` 的 `选项.波次`
 * （`{回合, 来:[{键, 等级}]}`）。等级和开场那几台**同一套算法**
 * （`runEnemyLv(kind, 层, 场次) + TIER_LV[梯队]`，11-敌方梯队.js），所以增援和编成里同级。 */
const 编成波次 = 条目 => ((条目 && 条目.波次) || []);
function 编成波次到单位(条目, 场次 = 0) {
  const kind = 类型到Kind[条目.类型] || 'battle';
  const 等级 = 键 => runEnemyLv(kind, 条目.层, 场次) + TIER_LV[tierOfEnemy(键)];
  return 编成波次(条目).map(w => ({ 回合: w.回合, 来: (w.来 || []).map(键 => ({ 键, 等级: 等级(键) })) }));
}

/* ---------- 默认的 Lv10 五人队（方案第 9 节 M1 验收用；肉鸽开局的样例队伍也用它） ----------
 * 方案没有指定是哪五个人，先按「五个不同职业 + 覆盖三个势力」挑一队**初稿**。
 * ★ 作者 2026-10-10：我方**一开始只有 3 台**能上（`05-阵型.js` 的 `出击上限()`），
 *   这一队 5 台是「名册」不是「出击名单」，出击名单由编队屏从名册里挑（最多 `出击上限()` 台）。 */
const 默认五人队 = [
  { 键: 'B1', 位: 0, 等级: 10 },    // 近卫 · 雷萨（影世界）
  { 键: 'B2', 位: 1, 等级: 10 },    // 尖兵 · 蕾卡（影世界）
  { 键: 'CB4', 位: 2, 等级: 10 },   // 重装 · 提耶利亚（天人）
  { 键: 'CB2', 位: 3, 等级: 10 },   // 狙击 · 洛克昂（天人）
  { 键: 'M1', 位: 4, 等级: 10 },    // 指挥 · Feena（月球王国）

/* ============================================================================
 * 机体图标层（M5，方案 8.2）
 * ----------------------------------------------------------------------------
 * 素材是**原创矢量图形** `art/mech-icons.js`（战棋带过来的，不进旧仓库改动），
 * 由 `tools/build-src.mjs` 原样内联进 HTML 的 ART 块，对外是全局 `MechIcons`（下面简称 MI）。
 *
 * 用法（照方案 8.2 的写法）：
 *   MI.build(id, {pal, plate, size, lod, role}) → 绘制指令数组
 *   MI.draw(ctx, prims, size, x, y)             → 画到 canvas 的 (x, y) 起、边长 size 的方框里
 * 这里把「机体键 → 图标 id → 调色板 → 小 canvas → dataURL」缓存一遍，界面用字符串拼 HTML 时直接塞 <img>。
 *
 * 图标怎么选（照战棋 `20-绘制.js:424-451` 的 iconIdOf / palKeyOf / STOCK_BY_ROLE）：
 *   - `MI.ICON_BY_MECH[机体名]` 有专属图标就用它；
 *   - 我方没有专属图标的，按 `tags.战斗分类` 借用**原型剪影**（势力配色仍按自己的势力）；
 *   - 敌人没有专属图标的，按体型 / 飞行退到 `flagship` / `fortress` / `fighter` / `grunt`；
 *   - 再挑不出来（或者没有 canvas、没有 MI、id 不在 `MI.ids` 里）→ **退回势力色方块 + 短名**，不报错。
 * 配色：我方查 `MI.FACTION_PAL[势力]`，敌方一律 `enemy`（和战棋一样）。
 * ========================================================================== */

const 图标 = {
  MI: null,                        // ART 块注入的 MechIcons；没注入就是 null（退方块）
  尺寸: { 卡: 34, 列表: 28, 格: 32 },   // 三种卡片上的图标边长（逻辑像素）
  倍: 2,                           // 画布按 2 倍渲染，高分屏上不糊
  缓存: {},                        // "图标id|调色板|尺寸" → dataURL（画一次就够了）
  原型: { 近卫: 'B1', 尖兵: 'B2', 指挥: 'M1', 重装: 'M2', 狙击: 'CB2', 特种: 'CB3' },

  /** 取素材接口：ART 块在游戏脚本之前执行，所以这里一定拿得到（除非素材没注入）。 */
  取MI() {
    if (!this.MI && typeof MechIcons !== 'undefined') this.MI = MechIcons;
    return this.MI || null;
  },
  就绪() { return !!this.取MI(); },

  /** 单位模板：我方查 ALLY_T，敌方查 ENEMY_T（和 80-界面.js 的 界面.单位模板 同一个口径）。 */
  单位模板(键, 方) { return 方 === 'ally' ? tplOf(键) : ENEMY_T[键]; },
  /** 机体名（数据里的 `mech` 字段）——图标按它查 ICON_BY_MECH。 */
  机体名(键, 方) { const t = this.单位模板(键, 方); return (t && t.mech) || 键; },
  短名(键, 方) { const t = this.单位模板(键, 方); return (t && (t.short || t.mech)) || 键; },
  转义(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); },

  /** 机体键 + 阵营 → 图标 id（挑不出来就 null = 退方块）。 */
  图标号(键, 方) {
    const MI = this.取MI();
    if (!MI || !MI.ICON_BY_MECH) return null;
    const 名 = this.机体名(键, 方);
    if (MI.ICON_BY_MECH[名]) return MI.ICON_BY_MECH[名];
    const t = this.单位模板(键, 方);
    if (方 === 'ally') return this.原型[(t && t.tags && t.tags.战斗分类) || ''] || null;
    if (!t) return null;                       // 连模板都没有（数据里没有这个敌人）→ 退方块 + 短名
    /* 敌人：3×3 以上当旗舰、2×2 当要塞、飞行当战斗机，其余当杂兵（战棋 20-绘制.js:437-443） */
    const w = Math.max((t && t.w) || 1, (t && t.h) || 1);
    return w >= 3 ? 'flagship' : w === 2 ? 'fortress' : (t && t.flying ? 'fighter' : 'grunt');
  },

  /** 势力 → 调色板键（敌方一律 enemy）。 */
  调色板(键, 方) {
    const MI = this.取MI();
    if (!MI || !MI.FACTION_PAL || 方 !== 'ally') return 'enemy';
    const t = this.单位模板(键, 'ally');
    return MI.FACTION_PAL[(t && t.tags && t.tags.势力) || ''] || 'cb';
  },

  /** 画一张小图 → dataURL（画不出来返回 null）。同一个 id + 调色板 + 尺寸只画一次。 */
  画布(键, 方) {
    const MI = this.取MI();
    const id = this.图标号(键, 方);
    const pal = this.调色板(键, 方);
    const 逻辑 = this.尺寸.卡;
    const 长 = Math.round(逻辑 * this.倍);
    const 缓键 = id + '|' + pal + '|' + 长;
    if (缓键 in this.缓存) return this.缓存[缓键];
    let url = null;
    try {
      if (MI && id && document && document.createElement && MI.ids && MI.ids.indexOf(id) >= 0) {
        const cv = document.createElement('canvas');
        cv.width = 长; cv.height = 长;
        const ctx = cv.getContext ? cv.getContext('2d') : null;
        if (ctx) {
          const t = this.单位模板(键, 方);
          const role = (t && t.tags && t.tags.战斗分类) || undefined;
          MI.draw(ctx, MI.build(id, { pal, plate: 'none', role, size: 长 }), 长, 0, 0);
          url = cv.toDataURL ? cv.toDataURL() : null;
        }
      }
    } catch (e) { url = null; }        // 没有 canvas / 画失败：静默退到方块 + 短名，不往上抛
    this.缓存[缓键] = url;
    return url;
  },

  /** 卡片上的一格图标：矢量图标（`<img>` 内联 dataURL）或势力色方块 + 短名。 */
  卡(键, 方, 尺寸 = 图标.尺寸.卡) {
    const 名 = this.转义(this.短名(键, 方));
    const 标 = this.转义(this.机体名(键, 方));
    const url = this.画布(键, 方);
    const 外 = `width:${尺寸}px;height:${尺寸}px`;
    if (url) return `<span class="mic" title="${标}" style="${外}"><img class="mi" src="${url}" alt="${标}" width="${尺寸}" height="${尺寸}"></span>`;
    const 色 = 方 === 'ally' ? 势力色(键) : 敌方色;
    return `<span class="mic fb" title="${标}" style="--fc:${色};${外}">${名}</span>`;
  },
};

 * ----------------------------------------------------------------------------
 * 数据来源：**机甲战棋**（只读复制，一个字节都没改）
 *   `Claude hand off/src/js/26-地图生成.js`  6×4 网格 / 78% 存在 / 连通 ≥15 / 最右 2 列 ≥2 / 最远 BFS ≥5

 *
 * ★ 与战棋的一处**换义**（写进任务板，等作者 / Claude 定）：
 *   战棋把「最远的那个最右格」放成 `guard`（出口守军），打赢它就直接进下一层；
 *   本仓库的任务书要求 **出口守军（1）与出口（1）各算一个节点**，所以这里改成
 *   **出口守军放在出口旁边（四邻接），必须先打赢守军，出口才放行**。
 *   `出口守军 → 出口 → 下一层 → 通关` 这条链是「打完终点 Boss 不通关」那个缺口的修法。
 *
 * 随机数一律 `mulberry32(种子 + 层×101)`（方案 6.1：同种子同结果，禁止 Math.random）。
 * ========================================================================== */

/* ---------- 网格几何（26-地图生成.js:2,20） ---------- */
const 地图列数 = 6, 地图行数 = 4;                 // GCOLS / GROWS
const 格号 = (列, 行) => 行 * 地图列数 + 列;      // cid(c, r)
const 格列 = k => k % 地图列数;
const 格行 = k => (k / 地图列数) | 0;

/** 每层地图的随机种子（28-层.js:5 `RUN.seedBase + n * 101`）。 */
const 地图种子 = (RUN种子, 层) => ((RUN种子 >>> 0) + 层 * 101) >>> 0;

/* ---------- 节点类型表（名字 / 图标 / 颜色逐字照抄 26-地图生成.js:3-19，只取本仓库有的格子语义） ---------- */
const 节点类型表 = {
  起点: { 名: '起点', 图标: '◎', 色: '#8a99ab' },            // 26:4
  空: { 名: '空节点', 图标: '·', 色: '#56606b' },              // 26:5
  作战: { 名: '作战', 图标: '⚔', 色: '#d9564b' },              // 26:6
  精英: { 名: '精英作战', 图标: '☠', 色: '#ff7a6b' },          // 26:7
  事件: { 名: '事件', 图标: '？', 色: '#c9a8ff' },             // 26:8
  黑市: { 名: '黑市', 图标: '¥', 色: '#e9a23b' },              // shop，26:9
  休整: { 名: '休整', 图标: '✚', 色: '#5cc08a' },              // rest，26:10
  招募站: { 名: '招募站', 图标: '☺', 色: '#8ec5ff' },          // recruit，26:11
  隧道: { 名: '废弃隧道', 图标: '◐', 色: '#b39ddb' },          // tunnel，26:13
  瞭望站: { 名: '瞭望站', 图标: '⌖', 色: '#ffd166' },          // supply，26:14
  遗迹: { 名: '遗迹', 图标: '◆', 色: '#ffd166' },              // treasure，26:15（颜色与瞭望站同，照抄）
  侵蚀源: { 名: '侵蚀源', 图标: '✹', 色: '#ff5ec4' },          // source，26:16
  出口守军: { 名: '出口守军', 图标: '⇛', 色: '#ff7a6b' },      // guard，26:18
  出口: { 名: '出口', 图标: '⇒', 色: '#5cc08a' },              // exit，26:17
};

/* ---------- 四邻接 / BFS（26-地图生成.js:67-68） ---------- */
function 邻居(k) {
  const c = 格列(k), r = 格行(k), o = [];
  if (c > 0) o.push(k - 1);
  if (c < 地图列数 - 1) o.push(k + 1);
  if (r > 0) o.push(k - 地图列数);
  if (r < 地图行数 - 1) o.push(k + 地图列数);
  return o;
}
/** 从 s 出发在 `格们`（Map 或 Set 或普通对象）里做四邻接 BFS：返回 Map(格号 → 步数)。 */
function BFS距离(s, 格们) {
  const 有 = k => (格们 instanceof Map || 格们 instanceof Set) ? 格们.has(k) : !!格们[k];
  const d = new Map([[s, 0]]), q = [s];
  while (q.length) {
    const k = q.shift();
    for (const n of 邻居(k)) if (有(n) && !d.has(n)) { d.set(n, d.get(k) + 1); q.push(n); }
  }
  return d;
}
/** 死胡同 = 连通份里只有一个邻居的格（26-地图生成.js:42）。 */
const 是死胡同 = (k, 有) => 邻居(k).filter(有).length === 1;

/* ---------- 推进剂（24-Feena_指挥官.js:18-19，无指挥官时 = 7） ----------
 * 原式：`propMax() = 7 + [0,2,3,4][skLv('领航')] + [0,1,2,2][skLv('后勤')]
 *                  + (有『河谷祭祈』零件 ? 1 : 0) + (RUN.layerPropBonus || 0)`
 * 本仓库：没有指挥官 / 领航 / 后勤（前两项恒 0），所以只剩 `层推进剂修正`（= layerPropBonus）
 * 和**河谷祭祈零件**那一项（`RUN.零件推进剂加成`，由 `94-零件.js` 的 `重算推进剂加成()` 维护）。 */
const 推进剂基础 = 7;                      // propMax() 在没有领航 / 后勤技能、没有零件时的值
function 推进剂上限(RUN) {
  return 推进剂基础 + ((RUN && RUN.层推进剂修正) || 0) + ((RUN && RUN.零件推进剂加成) || 0);
}

/* ---------- 关卡池（31-战斗.js:67,96-97 STAGE_POOL，编号格式 ISW-层-类型-序号） ----------
   本仓库没有战棋的关卡片段表，所以只保留**编号**（`stage`），
   真正打什么由编成表（70-编成.js）按「层 + 类型」抽一条决定 —— 见 90-肉鸽.js 的 当前战斗类型()。 */
const 关卡池 = { 作战: 8, 精英: 3, 守军: 3, 侵蚀源: 2, 追击: 2 };   // 31:67
const 阶段名 = { 作战: 'N', 精英: 'E', 守军: 'G', 侵蚀源: 'S', 追击: 'C', 终点: 'F' };
/** 这一层这类节点能用哪些关卡编号（逐字照抄战棋 31-战斗.js:96-97 的生成规则）。 */
function 关卡编号池(层, 类) {
  if (类 === '终点') return 层 === 4 ? ['ISW-4-F-1'] : [];            // 31:97 add(4,'F',1)
  if (类 === '侵蚀源') return 层 >= 2 ? [1, 2].map(i => `ISW-${层}-S-${i}`) : [];   // 31:96 S 类只在 L≥2
  const n = 关卡池[类] || 0;
  return Array.from({ length: n }, (_, i) => `ISW-${层}-${阶段名[类]}-${i + 1}`);
}

/* ---------- 生成一层（照 26-地图生成.js:21-66） ----------
 *  `严` = true 时要求这一张图**能把「固定个数」表里的节点一个不少地放下**，
 *  放不下就换下一个种子重试（见 `试放` 的注释：这是本仓库为了满足任务书
 *  「每层节点固定个数」加的一句，战棋的 `put()` 池子空了会静默少放）。
 *  `诊断` 省略时正常返回地图；给了数组就把每次尝试的原因推进去（测试 / 调参用）。 */
function 生成层(层, 种子, 严 = true, 诊断 = null) {
  for (let 试 = 0; 试 < 200; 试++) {                       // 26:22 最多重试 200 次
    const r = mulberry32((种子 + 试 * 7919) >>> 0);        // 26:23
    const 有 = new Set();
    const 起点 = 格号(0, 1 + Math.floor(r() * 2));         // 26:24 第 1 列、第 2 或 3 行
    for (let 行 = 0; 行 < 地图行数; 行++) {
      for (let 列 = 0; 列 < 地图列数; 列++) if (r() < 0.78) 有.add(格号(列, 行));   // 26:25 每格 78% 存在
    }
    有.add(起点);
    /* 连通性：从起点做 BFS，只留连通分量（26:28-30） */
    const 距离 = BFS距离(起点, 有);
    const 格们 = [...距离.keys()];
    const 最右 = 格们.filter(k => 格列(k) >= 地图列数 - 2);        // 26:31 第 5、6 列
    if (格们.length < 15 || 最右.length < 2) { 说(诊断, 试, '连通格数或最右 2 列不够'); continue; }   // 26:32
    if (Math.max(...最右.map(k => 距离.get(k))) < 5) { 说(诊断, 试, '最远 BFS < 5'); continue; }     // 26:34
    /* 出口守军 / 出口（26:37-38 的 far[0]/far[1]）—— 见文件头「换义」那一段 */
    最右.sort((a, b) => 距离.get(b) - 距离.get(a));
    const 出口 = 最右[0];
    const 守军 = 邻居(出口).find(k => 距离.has(k));
    if (守军 == null) continue;
    /* 候选池（26:39-43）：剩下的格先洗一遍，put = 池子里第一个还没被占用的格 */
    const 空白 = 格们.filter(k => k !== 起点 && k !== 出口 && k !== 守军);
    洗牌(空白, r);                                          // 26:40-41
    /* 真的放一遍（顺序照 26:45-54；「空」放到最后当填充，见 试放 的注释） */
    const T = 试放(层, 距离, 起点, 出口, 守军, 空白);
    if (!T) { 说(诊断, 试, '固定节点放不下'); if (严) continue; }
    const 用的T = T || new Map([[起点, '起点'], [出口, '出口'], [守军, '出口守军']]);
    for (const k of 格们) if (!用的T.has(k)) 用的T.set(k, '空');     // 26:54 其余全是空节点
    /* 组节点对象（26:55-57）：连通格一个不多一个不少 */
    const 格 = {};
    for (const k of 格们) 格[k] = { k, 列: 格列(k), 行: 格行(k), 类型: 用的T.get(k), 已过: k === 起点 };
    格[起点].类型 = '空';                                    // 26:57 起点建完后 type 改成 empty（cleared:true）
    /* 关卡编号（26:58-61）：按格号顺序轮转指派；出口守军在第 4 层用终点 Boss 关（26:59 的 bossReady 分支） */
    for (const 类 of ['作战', '精英', '出口守军', '侵蚀源']) {
      const 池 = (类 === '出口守军' && 层 === 4) ? 关卡编号池(4, '终点') : (类 === '出口守军' ? 关卡编号池(层, '守军') : 关卡编号池(层, 类));
      let i = 0;
      for (const k of 格们) if (格[k].类型 === 类 && 池.length) 格[k].关卡 = 池[i++ % 池.length];
    }
    const 隧道们 = 格们.filter(k => 用的T.get(k) === '隧道');
    return { 列数: 地图列数, 行数: 地图行数, 种子, 起点, 出口, 守军, 隧道: 隧道们, 格, 试 };
  }
  throw new Error('地图生成失败（200 次重试都没有找到合条件的 6×4 网格）');   // 26:65
}
function 说(诊断, 试, 原因) { if (诊断) 诊断.push({ 试, 原因 }); }

/** 洗牌（26:40 的 shuffle，逐字照搬：从后往前换）。 */
function 洗牌(a, r) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/** 固定节点的个数表（26-地图生成.js:45-53 的「固定个数」表，逐条对应）。
 *  ★ 本仓库加的两句（**不是战棋的**，写进任务板的差异清单）：
 *   ① 战棋的 `put()` 池子空了就**静默少放**（`nodes[k]` 那一格最后变成空节点）；
 *      任务书要求「每层节点**固定个数**」，所以这里改成**先试放一遍**（`试放`），
 *      放不下就换下一个种子重试 —— `生成层` 的 `严` 参数就是干这个的。
 *   ② 战棋把「空 2」放在遗迹 / 休整 / 招募站**之前**放（26:49），
 *      池子紧的时候会把后面三个挤掉；这里把「空」挪到最后（当填充），
 *      语义不变（剩下的都算空节点），但固定节点能落位。 */
function 计划要放(层) {
  return { 作战: 4, 精英: 1, 侵蚀源: 层 >= 2 ? 1 : 0, 黑市: 1, 事件: 2, 瞭望站: 2, 空: 2, 遗迹: 1, 休整: 1, 招募站: 1, 隧道: 2 };
}

/** 试放一遍（不改任何外部状态）：能按「固定个数」放满就返回 Map(格号 → 类型)，放不下返回 null。
 *  顺序照 26:45-53：作战（优先非死胡同）→ 精英（BFS ≥3）→ 侵蚀源（BFS ≥3）→ 黑市 / 事件 / 瞭望站 →
 *  遗迹（只在死胡同）→ 休整 → 招募站 → 隧道（成对：一格列 ≤1、一格最右 2 列）→ 空（填充）。 */
function 试放(层, 距离, 起点, 出口, 守军, 空白) {
  const T = new Map([[起点, '起点'], [出口, '出口'], [守军, '出口守军']]);
  const 死 = 空白.filter(k => 是死胡同(k, x => 距离.has(x)));        // 26:42
  const 放 = (类型, 个数, 池 = 空白) => {
    for (let i = 0; i < 个数; i++) { const k = 池.find(x => !T.has(x)); if (k == null) return false; T.set(k, 类型); }
    return true;
  };
  const 非死 = 空白.filter(k => !死.includes(k));
  if (!放('作战', 4, 非死.length >= 4 ? 非死 : 空白)) return null;   // 26:45（非死胡同不够时退回整池）
  if (!放('精英', 1, 空白.filter(k => 距离.get(k) >= 3))) return null;              // 26:46
  if (层 >= 2 && !放('侵蚀源', 1, 空白.filter(k => 距离.get(k) >= 3))) return null;  // 26:47
  if (!放('黑市', 1)) return null;                                                 // 26:48
  if (!放('事件', 2)) return null;
  if (!放('瞭望站', 2)) return null;
  if (!放('遗迹', 1, 死)) return null;                                             // 26:50 只在死胡同
  if (!放('休整', 1)) return null;                                                 // 26:51
  if (!放('招募站', 1)) return null;
  /* 隧道（26:52-53）：成对；一格列 ≤1、一格最右 2 列 */
  const 剩 = 空白.filter(k => !T.has(k));
  const 甲 = 剩.find(k => 格列(k) <= 1), 乙 = 剩.find(k => 格列(k) >= 地图列数 - 2);
  if (甲 == null || 乙 == null || 甲 === 乙) return null;
  T.set(甲, '隧道'); T.set(乙, '隧道');
  if (!放('空', 2)) { /* 「空」不够也没关系：剩下的格最后都会补成空节点（26:54） */ }
  return T;
}

/* ---------- 移动（28-层.js:23-31 + 30-移动与节点.js:18-22） ---------- */

/** 不算推进剂上限的距离表（界面用它算「走过去要几步」）。 */
function 全距离(RUN) {
  return BFS距离(RUN.当前, RUN.地图.格);      // 第二参给**普通对象**（BFS距离 的 `有(k)` 会读 格们[k]）
}
/** 推进剂够得着的距离表：BFS 深度上限 = 当前推进剂（28:25）。 */
function 移动距离(RUN) {
  const N = RUN.地图.格, 上限 = RUN.推进剂;
  const d = new Map([[RUN.当前, 0]]), q = [RUN.当前];
  while (q.length) {
    const k = q.shift();
    if (d.get(k) >= 上限) continue;                       // 28:25 超过推进剂就不往外扩
    for (const n of 邻居(k)) if (N[n] && !d.has(n)) { d.set(n, d.get(k) + 1); q.push(n); }
  }
  return d;
}
/** 能去的格（距离 ≥1）：推进剂为 0 时一个都去不了（28:29）。 */
function 能去的格(RUN) {
  if (!RUN || !RUN.地图 || RUN.推进剂 <= 0) return [];
  return [...移动距离(RUN)].filter(([, d]) => d >= 1).map(([k]) => k);
}
/* ============================================================================
 * 肉鸽外壳（方案第 7 节）· 从机甲战棋复制 + 简化
 * ----------------------------------------------------------------------------
 * 带过来的：分队、招募券、希望、源碳结晶、作战耐久、**6×4 网格 + 推进剂大地图**、藏品、存档。
 * 换掉的：节点里的「战斗 / 精英 / Boss」不再进战棋，而是进**自动战斗**（M3 的内核）。
 * 第一期不做的：**侵蚀场**（只把「侵蚀源」当一个强敌节点，见 结算侵蚀源）、战斗里的零件、
 * 涉及格子 / 移动 / 地形的藏品（都列在 docs/特技换算待办.md）。
 *
 * 地图与推进剂在 `91-地图.js`（照战棋 26-地图生成.js / 28-层.js / 30-移动与节点.js 逐字照抄）；
 * 本文件管：RUN 状态、移动与结算、奖励、失败 / 通关、存档。
 *
 * 数值出处：
 *   起始希望 8 / 源碳结晶 20 / 作战耐久 10        ← 战棋 27-开局.js:33
 *   推进剂每层重置 7（无指挥官）                  ← 战棋 24-Feena_指挥官.js:18
 *   走一格扣 1 推进剂（可以跳格，按最短路径）      ← 战棋 30-移动与节点.js:18-22
 *   推进剂 0 → 追击战；追击后下一层推进剂上限 −2   ← 战棋 30:34、31:300、28:9
 *   战斗失败按剩下的敌人数扣作战耐久              ← 战棋 31-战斗.js:267-270
 *   黑市价格（普通 8 / 稀有 12 / 传说 16 源碳）    ← 战棋 23b-藏品.js:10
 *   休整：作战耐久 +2                             ← 战棋 30-移动与节点.js:60
 *   瞭望站：推进剂 +1、揭开周围 4 格              ← 战棋 30:74-76
 *   遗迹：源碳 +2                                 ← 战棋 30:79
 *   隧道：跳格、不花推进剂                        ← 战棋 30:38-44
 *   出口守军：通道关口的一场硬仗                  ← 战棋 30:48-50（本仓库改成「打赢才放行出口」）
 *
 * 状态全在 `RUN` 里，能整个 JSON 存进 localStorage —— 这就是「关掉页面能继续」。
 * `Set` 不能进 JSON，所以「已走过」存成数组，读档时转回 Set（见 存档 / 读存档）。
 * ========================================================================== */

/* 存档版本（结构变了就升版本、换键；读到**旧版本**一律丢弃并提示，不崩）。
 *   v2：地图从「一列列节点」换成「6×4 网格」
 *   v3：阵型从「前 3 后 2」换成「前 4 后 5 = 9 格」（2026-10-10 作者拍板）——

 *       旧存档读回来会把阵型摆错，所以整个丢掉。
 *  ★ 2026-10-10 第二次拍板加的 `RUN.等级` / `RUN.经验` **不升版本**（只多一个字段）：
 *    旧 v3 存档缺这两个字段时 `读存档()` 会安全补默认值（Lv1 / 0 经验），不崩。 */
const 存档键 = 'mecha-autobattle-run-v3';
const 存档版本 = 3;
const 旧存档键们 = ['mecha-autobattle-run-v2', 'mecha-autobattle-run-v1'];

/* 数值初稿（出处：战棋 27-开局.js / 30-移动与节点.js / 23b-藏品.js 的同类数值；等作者确认） */
const 肉鸽数值 = {
  /* 初始值抄战棋 27-开局.js:33：希望 8、源碳结晶 20、作战耐久 10 */
  起始希望: 8,
  起始源碳: 20,
  起始耐久: 10,
  /* 网格大地图（逐字照抄战棋 26-地图生成.js:2,25,32,34） */
  网格列: 地图列数,           // 6
  网格行: 地图行数,           // 4
  存在概率: 0.78,             // 每格 78% 存在
  最少连通格: 15,             // 连通格数 ≥15
