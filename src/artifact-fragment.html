  const dbOf = n => +(tune.db[n] || 0);
  const gainOf = n => Math.min(1, Math.pow(10, (REF - TRACKS[n].lufs + dbOf(n)) / 20)) * MASTER;
  const urlOf = n => { const t = TRACKS[n]; if (FLAT && !t.id) return null; try { return new URL(BASE + (FLAT ? t.id + '.mp3' : t.file), document.baseURI).href; } catch(e){ return null; } };
  /* 读不到的曲子（试玩页上的本地版权曲）退到 alt */
  const bad = {};
  const usable = n => { for (let k = 0; n && k < 5; k++){ if (!bad[n] && (!FLAT || TRACKS[n].id)) return n; n = TRACKS[n].alt || null; } return null; };
  const nameOf = cue => usable(!cue ? null : cue.startsWith('theme:') ? cue.slice(6) : cue.startsWith('track:') ? (TRACKS[cue.slice(6)] ? cue.slice(6) : null) : (CUES[cue] || null));

  const els = {};
  let avail = null, muted = false, unlocked = false, cue = null, cur = null;
  const waiters = [];
  function setAvail(v){ if (avail !== null) return; avail = v; waiters.splice(0).forEach(f => { try { f(v); } catch(e){} }); if (v) resume(); }

  function el(n){
    if (els[n]) return els[n];
    const u = urlOf(n); if (!u || typeof Audio === 'undefined') return null;
    const a = new Audio(); a.preload = 'metadata'; a.loop = true; a.volume = 0; a.src = u;
    a._target = 0;
    a.addEventListener('error', () => { bad[n] = true; if (cur === n){ cur = null; play(cue); } });
    return (els[n] = a);
  }
  /* 淡入淡出：每 30ms 把每个元素的音量往目标挪一步，到 0 就暂停（保留播放位置） */
  let timer = null;
  function tick(){
    let busy = false;
    for (const n in els){
      const a = els[n], step = 30 / FADE;
      if (a.volume !== a._target){
        const v = a.volume < a._target ? Math.min(a._target, a.volume + step) : Math.max(a._target, a.volume - step);
        a.volume = v; busy = true;
      }
      if (a._target === 0 && a.volume === 0 && !a.paused) a.pause();
    }
    if (!busy){ clearInterval(timer); timer = null; }
  }
  function fadeTo(n, v){ const a = els[n]; if (!a) return; a._target = v; if (!timer) timer = setInterval(tick, 30); }
  function start(n){
    const a = el(n); if (!a) return;
    a.preload = 'auto';
    const p = a.play(); if (p && p.catch) p.catch(() => {});
    fadeTo(n, gainOf(n));
  }
  function resume(){ if (cur && avail && !muted && unlocked) start(cur); }

  function play(c){
    cue = c || null;
    const n = nameOf(cue);
    if (n === cur){ resume(); return; }
    if (cur) fadeTo(cur, 0);
    cur = n;
    resume();
  }
  function stop(){ cue = null; if (cur) fadeTo(cur, 0); cur = null; }
  function mute(on){ muted = !!on; if (muted){ for (const n in els) fadeTo(n, 0); } else resume(); }
  function unlock(){ if (unlocked) return; unlocked = true; resume(); }
  function themeOf(mech, tpl){
    const n = THEMES.unit[mech] || (tpl && tpl.tags && THEMES.faction[tpl.tags.势力]);   // 双势力按主势力（拉米亚 → ATX）
    return n && TRACKS[n] ? 'theme:' + n : null;
  }
  function onAvailable(fn){ if (avail !== null) fn(avail); else waiters.push(fn); }
  function state(){ const a = cur && els[cur]; return {ready: !!avail, cue, track: cur, muted, playing: !!(a && !a.paused), time: a ? a.currentTime : 0, dur: a && isFinite(a.duration) ? a.duration : 0}; }

  /* ---------- 给音乐鉴赏页用 ---------- */
  const tuning = {
    defaults: DEF,
    get(){ return JSON.parse(JSON.stringify(tune)); },
    setDb(n, db){ db = Math.round(db * 2) / 2; if (db) tune.db[n] = db; else delete tune.db[n]; saveTune(); if (cur === n && els[n] && els[n]._target > 0) fadeTo(n, gainOf(n)); },
    /* kind: 'cues' | 'unit' | 'faction'；name 为 null = 静音 / 没有主题曲；和默认一样就删掉覆盖 */
    assign(kind, key, name){
      const def = DEF[kind][key] === undefined ? (kind === 'cues' ? null : undefined) : DEF[kind][key];
      if ((name || null) === (def || null)) delete tune[kind][key]; else tune[kind][key] = name || null;
      saveTune(); applyTune();
      if (cue && !cue.startsWith('track:')) play(cue);   // 正在放的场景换了曲子就跟着换
    },
    reset(){ tune = {db:{}, cues:{}, unit:{}, faction:{}}; saveTune(); applyTune(); if (cur && els[cur] && els[cur]._target > 0) fadeTo(cur, gainOf(cur)); },
    changed(){ return Object.keys(tune.db).length + Object.keys(tune.cues).length + Object.keys(tune.unit).length + Object.keys(tune.faction).length; },
    /* 导出：发给音乐对话的一段文字 */
    exportText(){
      const L = ['【音乐鉴赏 · 调整】' + new Date().toLocaleString()];
      const nm = v => v === null ? '（静音 / 不切）' : v;
      for (const k in tune.cues) L.push(`场景 ${k}：${nm(DEF.cues[k] === undefined ? null : DEF.cues[k])} → ${nm(tune.cues[k])}`);
      for (const k in tune.unit) L.push(`机体 ${k} 主题曲：${nm(DEF.unit[k] || null)} → ${nm(tune.unit[k])}`);
      for (const k in tune.faction) L.push(`势力 ${k} 主题曲：${nm(DEF.faction[k] || null)} → ${nm(tune.faction[k])}`);
      for (const k in tune.db) L.push(`音量 ${k}：${tune.db[k] > 0 ? '+' : ''}${tune.db[k]} dB`);
      if (L.length === 1) L.push('（没有改动）');
      L.push('', JSON.stringify(tune));
      return L.join('\n');
    },
    dbOf, usable: n => usable(n) === n,
  };
  /* 试听一首：直接放这首（不管场景），seek 到 t 秒 */
  function preview(n){ if (TRACKS[n]) play('track:' + n); }
  function seek(t){ const a = cur && els[cur]; if (a && isFinite(t)) try { a.currentTime = Math.max(0, t); } catch(e){} }
  function meta(n){ const a = el(n); return a ? {dur: isFinite(a.duration) ? a.duration : 0, bad: !!bad[n] || usable(n) !== n} : {dur:0, bad:true}; }

  applyTune();

  /* 探测：先载第一首战斗曲的元数据，读得到就算可用 */
  (function probe(){
    const a = el('Suno 我方回合');
    if (!a){ setAvail(false); return; }
    a.addEventListener('loadedmetadata', () => setAvail(true), {once:true});
    a.addEventListener('error', () => setAvail(false), {once:true});
    a.load();
  })();
  /* 浏览器要用户手势才放声音：任何一次点击 / 按键都算 */
  if (typeof document !== 'undefined'){
    const u = () => { unlock(); document.removeEventListener('pointerdown', u, true); document.removeEventListener('keydown', u, true); };
    document.addEventListener('pointerdown', u, true); document.addEventListener('keydown', u, true);
  }

  globalThis.MechAudio = {local:true, play, stop, mute, unlock, sfx(){}, setVolume(){}, state, themeOf, hasCue: c => !!nameOf(c), onAvailable, TRACKS, CUES, THEMES, _bad: bad, preview, seek, meta, tuning};
})();
</script>
<script>
/* 音乐鉴赏页（开场菜单进入，作者试听、调整用） · 源文件 audio/music-room.js · 由 tools/build-src.mjs 注入 */
/* ============================================================================
 * 音乐鉴赏页（音乐对话维护，作者 2026-10-10：「方便我更新调整」）
 * ----------------------------------------------------------------------------
 * 开场菜单 →「音乐鉴赏」打开。能做的事：
 *   - 每首曲子试听、拖进度、调音量（dB 偏移，按实测响度拉平之后再加减）；
 *   - 改「哪个场景放哪首」「哪个势力 / 角色的主题曲是哪首」；
 *   - 改动存在这台浏览器里，回到游戏立刻生效；
 *   - 「复制设置」导出一段文字，发给音乐对话写进 audio/local-music.js，所有人才生效。
 * 依赖 audio/local-music.js 的 MechAudio（preview / seek / meta / tuning）。只读写自己的 DOM，不碰游戏状态。
 * 用法：MechAudio.openRoom({factions:[势力名...], units:{机体代号: 显示名}}) → Promise，关闭时 resolve。
 * ========================================================================== */
(function(){
  'use strict';
  const MA = globalThis.MechAudio;
  if (!MA || !MA.tuning || typeof document === 'undefined') return;

  const SCENES = [
    ['title', '开场菜单'], ['mapStrategy', '部署 / 肉鸽大地图'], ['allyPhase', '我方回合'], ['enemyPhase', '敌方回合'],
    ['boss', 'Boss 在场'], ['victory', '胜利'], ['defeat', '失败'],
  ];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
  const mmss = t => { t = Math.max(0, Math.floor(t || 0)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };

  const CSS = `
.mr .dlg{width:min(1040px,100%)}
.mr-now{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:10px 0 4px}
.mr-now b{font-size:15px}
.mr-now input[type=range]{width:100%}
.mr-now .t{font-family:var(--font-m);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mr-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:10px}
.mr-sec h3{margin:0 0 6px;font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--muted)}
.mr-row{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:8px;align-items:center;padding:3px 0;font-size:13px}
.mr-row select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:3px;font:inherit;font-size:13px;padding:2px 4px;min-width:0;width:100%}
.mr-row.chg span{color:var(--accent)}
.mr-row.chg select{border-color:var(--accent)}
.mr-tracks{margin-top:14px}
.mr-tr{display:grid;grid-template-columns:34px minmax(0,1.3fr) 3.2em minmax(0,1.6fr) minmax(150px,1fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line);font-size:13px}
.mr-tr:last-child{border-bottom:0}
.mr-tr .play{width:30px;height:28px;padding:0;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.mr-tr.on .play{border-color:var(--accent);color:var(--accent)}
.mr-tr.on .nm b{color:var(--accent)}
.mr-tr .nm small{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-tr .dur{font-family:var(--font-m);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mr-tr .use{display:flex;flex-wrap:wrap;gap:4px}
.mr-tr .use span{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.mr-tr .use em{font-style:normal;font-size:11px;color:var(--muted);opacity:.6}
.mr-tr .vol{display:grid;grid-template-columns:minmax(0,1fr) 4.2em;gap:6px;align-items:center}
.mr-tr .vol input{width:100%}
.mr-tr .vol output{font-family:var(--font-m);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.mr-tr .vol output.chg{color:var(--accent)}
.mr-tr.bad{opacity:.5}
.mr-tr .miss{font-size:11px;color:var(--enemy)}
.mr-out{width:100%;box-sizing:border-box;min-height:110px;margin-top:8px;background:#0b1016;color:var(--fg);border:1px solid var(--line);border-radius:4px;font-family:var(--font-m);font-size:12px;padding:8px}
@media (max-width:900px){.mr-cols{grid-template-columns:minmax(0,1fr)}.mr-tr{grid-template-columns:34px minmax(0,1fr) 3.2em;}.mr-tr .use,.mr-tr .vol{grid-column:2 / -1}}
`;

  function openRoom(opts){
    opts = opts || {};
    if (!document.getElementById('mrStyle')){ const st = document.createElement('style'); st.id = 'mrStyle'; st.textContent = CSS; document.head.appendChild(st); }
    const T = MA.TRACKS, names = Object.keys(T);
    const factions = (opts.factions || []).slice();
    for (const f in MA.tuning.defaults.faction) if (!factions.includes(f)) factions.push(f);
    const units = Object.assign({}, opts.units || {});
    for (const u in MA.tuning.defaults.unit) if (!(u in units)) units[u] = u;
    const prevCue = MA.state().cue;
    const wasMuted = MA.state().muted;
    if (wasMuted) MA.mute(false);
    MA.unlock();

    const root = document.createElement('div');
    root.className = 'modal mr'; root.id = 'musicRoom';
    document.body.appendChild(root);

    let showOut = false;
    function usage(){
      const u = {}; names.forEach(n => u[n] = []);
      SCENES.forEach(([k, lb]) => { const n = MA.CUES[k]; if (n && u[n]) u[n].push(lb); });
      for (const k in MA.THEMES.unit){ const n = MA.THEMES.unit[k]; if (n && u[n]) u[n].push((units[k] || k) + ' 主题'); }
      for (const k in MA.THEMES.faction){ const n = MA.THEMES.faction[k]; if (n && u[n]) u[n].push(k + ' 主题'); }
      return u;
    }
    const opt = (sel, none) => `<option value=""${sel ? '' : ' selected'}>${none}</option>` +
      names.map(n => `<option value="${esc(n)}"${n === sel ? ' selected' : ''}>${esc(n)}${MA.meta(n).bad ? '（缺文件）' : ''}</option>`).join('');

    function render(){
      const t = MA.tuning.get(), use = usage(), st = MA.state();
      const sceneRows = SCENES.map(([k, lb]) => `<label class="mr-row${k in t.cues ? ' chg' : ''}"><span>${lb}</span><select data-kind="cues" data-key="${k}">${opt(MA.CUES[k] || null, '（静音）')}</select></label>`).join('');
      const themeRows = Object.keys(units).map(k => `<label class="mr-row${k in t.unit ? ' chg' : ''}"><span>${esc(units[k])}（个人）</span><select data-kind="unit" data-key="${esc(k)}">${opt(MA.THEMES.unit[k] || null, '（不切，用势力的）')}</select></label>`).join('')
        + factions.map(f => `<label class="mr-row${f in t.faction ? ' chg' : ''}"><span>${esc(f)}</span><select data-kind="faction" data-key="${esc(f)}">${opt(MA.THEMES.faction[f] || null, '（没有主题曲）')}</select></label>`).join('');
      const rows = names.map(n => {
        const m = MA.meta(n), db = MA.tuning.dbOf(n), on = st.track === n && st.playing;
        return `<div class="mr-tr${on ? ' on' : ''}${m.bad ? ' bad' : ''}" data-n="${esc(n)}">
          <button class="play" data-play="${esc(n)}" title="${on ? '暂停' : '试听'}" ${m.bad ? 'disabled' : ''}>${on ? '❚❚' : '▶'}</button>
          <div class="nm"><b>${esc(n)}</b><small>${esc(T[n].file)}${T[n].id ? '' : ' · 本地版权曲'}</small>${m.bad ? '<span class="miss">这里读不到这首（退到 ' + esc(T[n].alt || '无') + '）</span>' : ''}</div>
          <span class="dur">${m.dur ? mmss(m.dur) : '—'}</span>
          <div class="use">${use[n].length ? use[n].map(x => `<span>${esc(x)}</span>`).join('') : '<em>没用上</em>'}</div>
          <div class="vol"><input type="range" min="-12" max="6" step="0.5" value="${db}" data-db="${esc(n)}" aria-label="${esc(n)} 音量"><output class="${db ? 'chg' : ''}">${db > 0 ? '+' : ''}${db} dB</output></div>
        </div>`;
      }).join('');
      const nChg = MA.tuning.changed();
      root.innerHTML = `<div class="dlg">
        <div class="eyebrow" style="color:var(--accent)">音乐鉴赏</div>
        <h2>试听、调音量、换曲子</h2>
        <p class="small">改动只存在这台浏览器里，回到游戏立刻生效。满意了点「复制设置」，把那段文字发给音乐对话，写进仓库后所有人都生效。音量是在按实测响度拉平之后再加减。</p>
        <div class="mr-now"><button class="btn" data-act="toggle">${st.playing ? '❚❚ 暂停' : '▶ 播放'}</button>
          <div><b>${st.track ? esc(st.track) : '（没有在放）'}</b><input type="range" min="0" max="${Math.max(1, Math.floor(st.dur))}" step="1" value="${Math.floor(st.time)}" data-act="seek" aria-label="进度"></div>
          <span class="t" id="mrTime">${mmss(st.time)} / ${mmss(st.dur)}</span></div>
        <div class="mr-cols">
          <section class="mr-sec"><h3>场景放哪首</h3>${sceneRows}</section>
          <section class="mr-sec"><h3>主题曲（放大招时切，放到本回合结束）</h3>${themeRows}</section>
        </div>
        <section class="mr-sec mr-tracks"><h3>全部曲目（${names.length} 首）</h3>${rows}</section>
        ${showOut ? `<textarea class="mr-out" readonly>${esc(MA.tuning.exportText())}</textarea><p class="small" id="mrCopied"></p>` : ''}
        <div class="acts">
          <button class="btn primary" data-act="copy">复制设置${nChg ? `（${nChg} 处改动）` : ''}</button>
          <button class="btn" data-act="reset"${nChg ? '' : ' disabled'}>恢复默认</button>
          <button class="btn" data-act="close">关闭</button>
        </div>
        <p class="small">新曲子：放进仓库的 <code>audio/SUNO/</code>，告诉音乐对话要放在哪，它会加进曲目表。</p>
      </div>`;
    }
    render();

    /* 进度条每 0.25 秒刷新（不整页重画，拖动时不打断） */
    let dragging = false;
    const iv = setInterval(() => {
      const st = MA.state(), sk = root.querySelector('[data-act=seek]'), tm = root.querySelector('#mrTime');
      if (sk && !dragging){ sk.max = Math.max(1, Math.floor(st.dur)); sk.value = Math.floor(st.time); }
      if (tm) tm.textContent = `${mmss(st.time)} / ${mmss(st.dur)}`;
      root.querySelectorAll('.mr-tr').forEach(r => { const d = r.querySelector('.dur'), n = r.dataset.n; if (d && d.textContent === '—'){ const m = MA.meta(n); if (m.dur) d.textContent = mmss(m.dur); } });
    }, 250);

    return new Promise(resolve => {
      function close(){
        clearInterval(iv); window.removeEventListener('keydown', onKey, true); root.remove();
        if (wasMuted) MA.mute(true);
        MA.play(prevCue);
        resolve();
      }
      function onKey(e){
        if (e.key === 'Escape'){ e.preventDefault(); close(); }
        e.stopPropagation();          // 鉴赏页开着时不触发游戏快捷键（空格结束回合、M 静音等）
      }
      window.addEventListener('keydown', onKey, true);
      root.addEventListener('click', async e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.play){
          const n = b.dataset.play, st = MA.state();
          if (st.track === n && st.playing) MA.stop(); else MA.preview(n);
          return setTimeout(render, 60);
        }
        const a = b.dataset.act;
        if (a === 'close') return close();
        if (a === 'toggle'){ const st = MA.state(); if (st.playing) MA.stop(); else if (st.track) MA.preview(st.track); else MA.preview(MA.CUES.title || names[0]); return setTimeout(render, 60); }
        if (a === 'reset'){ MA.tuning.reset(); return render(); }
        if (a === 'copy'){
          showOut = true; render();
          const txt = MA.tuning.exportText(), ta = root.querySelector('.mr-out'), msg = root.querySelector('#mrCopied');
          let ok = false;
          try { await navigator.clipboard.writeText(txt); ok = true; } catch(err){ try { ta.select(); ok = document.execCommand('copy'); } catch(e2){} }
          if (msg) msg.textContent = ok ? '已复制到剪贴板，直接粘贴给音乐对话就行。' : '没能自动复制：请选中上面的文字手动复制。';
        }
      });
      root.addEventListener('change', e => {
        const s = e.target;
        if (s.dataset.kind){ MA.tuning.assign(s.dataset.kind, s.dataset.key, s.value || null); render(); }
      });
      root.addEventListener('input', e => {
        const r = e.target;
        if (r.dataset.db){ MA.tuning.setDb(r.dataset.db, +r.value); const o = r.parentNode.querySelector('output'), v = MA.tuning.dbOf(r.dataset.db); o.textContent = `${v > 0 ? '+' : ''}${v} dB`; o.className = v ? 'chg' : ''; }
        if (r.dataset.act === 'seek'){ dragging = true; MA.seek(+r.value); }
      });
      root.addEventListener('pointerup', () => { dragging = false; });
      root.addEventListener('change', e => { if (e.target.dataset.act === 'seek'){ dragging = false; } });
    });
  }
  MA.openRoom = openRoom;
})();
</script>

<script>
/* ============================================================================
 * 机甲指挥 · 启动（head）
 * ----------------------------------------------------------------------------
 * 这份文件开始一个**贯穿所有 js 片段的 IIFE**，由 `src/js/99-boot.js` 收尾。
 * 约定（从战棋搬过来的）：所有片段共用同一个作用域，互相之间直接看见彼此的
 * 变量和函数，等价于把 js/ 按文件名顺序拼成一个大文件。
 * 所以：新片段直接写「局部的顶层代码」就行，不要自己再包一层 IIFE。
 *
 * M0 只有骨架：版本号、小工具、战场常量。
 * 战斗内核从 M1 开始（计划放 `10-*` 起的片段）。
 * ========================================================================== */
(() => {
'use strict';

/* ---------- 版本 / 里程碑（顶栏会显示，测试也会读） ---------- */
const VERSION = '0.6.2';
const MILESTONE = 'M6 平衡工具';

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* 带种子的随机数（方案 6.1：随机数一律带种子，同一种子同一结果，测试和复盘都要用）。
 * 这份 mulberry32 就是战棋 `src/js/00-head.js` 里的那一份，原样带过来。 */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 战场常量 ----------
   站位在 `src/js/05-阵型.js` 里配置：作者 2026-10-10 拍板改成**错开的 9 格 = 前排 4 + 后排 5**
   （阻挡关系 F0→B0,B1 / F1→B1,B2 / F2→B2,B3 / F3→B3,B4 也在那里）。
   出击上限（2026-10-10 **第二次拍板**）= 按**肉鸽等级**（`RUN.等级`）算：起始 3 台、每 3 级 +1、
   封顶 6 台 —— 函数在 `05-阵型.js`，肉鸽等级的涨法在 `90-肉鸽.js`（照战棋 `27-开局.js:102-111`）。
   这里不再写死 ROWS / COLS / SLOTS，需要的地方从 05-阵型.js 取。 */
/* ============================================================================
 * 阵型（作者 2026-10-10 拍板：错开的 9 格 = 前排 4 + 后排 5）
 * ----------------------------------------------------------------------------
 * 这里**只改这一个地方**就能换阵型：`阵型表` 里每行写「这一排有几格」。
 * 格子编号 slot 从 0 开始，按排顺序排下来：
 *   前 4 后 5 → 前排 = 0,1,2,3（前1 前2 前3 前4）· 后排 = 4..8（后1..后5），共 9 格
 *
 * ★ 作者拍板的阻挡关系（**就按这张图**，见任务板「阵型9格」段）：
 *
 *     前排： F0   F1   F2   F3          slot 0  1  2  3
 *     后排： B0   B1   B2   B3   B4     slot 4  5  6  7  8
 *
 *     阻挡： F0→B0,B1   F1→B1,B2   F2→B2,B3   F3→B3,B4
 *     （B1/B2/B3 各被 2 个前排位挡；B0/B4 各只被 1 个挡 —— 后排比前排多一格，所以错开）
 *
 * 为什么这么排：后排 5 格比前排 4 格多一格，整体错开半格，于是每个前排位刚好挡住
 * 「自己正对的那一格 + 右边那一格」，B0 与 B4 是两端、只有 1 个阻挡位。
 *
 * 参考：舰娘的阵型（陣形）里和前后排有关的是「かばう（替旗舰挡枪）」——
 * 靠前的替靠后的挡枪；舰娘没有严格的「一列对一列」规则，所以「换位」按作者的话做成
 * **和相邻位换**：同排左右邻居 + 有阻挡关系的对位（`相邻位()`）。
 * ========================================================================== */

const 阵型表 = [
  { 名: '前排', 短名: '前', 列数: 4 },
  { 名: '后排', 短名: '后', 列数: 5 },
];

const 阵型 = (() => {
  const 行 = [];
  let 起 = 0;
  for (let i = 0; i < 阵型表.length; i++) {
    行.push({ 名: 阵型表[i].名, 行: i, 列数: 阵型表[i].列数, 起 });
    起 += 阵型表[i].列数;
  }
  return { 行, 总格数: 起 };
})();

const ROWS = 阵型.行.length;          // 有几排
const SLOTS = 阵型.总格数;            // 一共几个位置（双方各这么多）= 9
const ROW_FRONT = 0, ROW_BACK = 1;    // 排版：0 = 前排（靠敌人）、1 = 后排

const 行列数 = i => 阵型.行[i].列数;
/* 最宽的那一排有几格：界面画格子时用它，保证每张卡片一样宽 */
const 最大列数 = Math.max(...阵型.行.map(r => r.列数));
const 行首格 = i => 阵型.行[i].起;
const 行名 = i => 阵型.行[i].名;
/** 短名（前/后）：位名用短的 —— 作者说的「前1..前4 / 后1..后5」就是这套名字 */
const 行短名 = i => 阵型表[i].短名 || 行名(i);
/** slot → 第几排 */
function rowOfSlot(slot) {
  let r = 0;
  while (r < ROWS - 1 && slot >= 行首格(r + 1)) r++;
  return r;
}
/** slot → 这一排的第几列（0 起） */
const colOfSlot = slot => slot - 行首格(rowOfSlot(slot));
/** （排, 列）→ slot */
const slotOf = (row, col) => 行首格(row) + col;
/** 这一排有没有这一列（前 4 后 5 时，前排没有第 5 列） */
const 有这一列 = (row, col) => col >= 0 && col < 行列数(row);
/** 格子的人话名字：前1 / 后2（作者 2026-10-10：前1..前4、后1..后5） */
const 位名 = slot => `${行短名(rowOfSlot(slot))}${colOfSlot(slot) + 1}`;

/** 某一列上所有真实的格子（前 4 后 5 时：前列0+后列0 … 前列3+后列3、后列4 只有自己）
 *  ★ 注意：**这不是阻挡关系**（阻挡是错开的，见下面的 `阻挡表` / `对位()`）；留着给界面画列用。 */
function 列上所有格(col) {
  const out = [];
  for (let r = 0; r < ROWS; r++) if (有这一列(r, col)) out.push(slotOf(r, col));
  return out;
}

/* ============================================================================
 * 阻挡关系（作者 2026-10-10 拍板的那张图）
 * ----------------------------------------------------------------------------
 * `阻挡表[前排列]` = 这个前排位挡着的**后排列**（1–2 个）。
 *   F0(列0)→B0,B1   F1(列1)→B1,B2   F2(列2)→B2,B3   F3(列3)→B3,B4
 * ========================================================================== */
const 阻挡表 = [
  [0, 1],   // 前1 → 后1、后2
  [1, 2],   // 前2 → 后2、后3
  [2, 3],   // 前3 → 后3、后4
  [3, 4],   // 前4 → 后4、后5
];

/** 归一化「活着的位」：接受 Set / 数组 / 单位数组（取 .slot）。 */
function 活位集(x) {
  if (x instanceof Set) return x;
  const s = new Set();
  for (const v of (x || [])) s.add(v && typeof v === 'object' ? v.slot : v);
  return s;
}

/** 这个**前排位**挡着的后排位们（后排位 / 越界 → 空数组）。 */
function 阻挡位(位) {
  if (位 == null || 位 < 0 || 位 >= SLOTS) return [];
  if (rowOfSlot(位) !== ROW_FRONT) return [];
  return (阻挡表[colOfSlot(位)] || []).map(c => slotOf(ROW_BACK, c));
}

/** 挡着这个**后排位**的前排位们（前排位 → 空数组）。B1/B2/B3 各有 2 个，B0/B4 各 1 个。 */
function 遮挡位(位) {
  if (位 == null || 位 < 0 || 位 >= SLOTS) return [];
  if (rowOfSlot(位) !== ROW_BACK) return [];
  const c = colOfSlot(位);
  const out = [];
  for (let i = 0; i < 阻挡表.length; i++) if (阻挡表[i].includes(c)) out.push(slotOf(ROW_FRONT, i));
  return out;
}

/** 有阻挡关系的**对位**（对称）：前排位 → 它挡的后排位们；后排位 → 挡着它的前排位们。
 *  这就是作者说的「F0↔B0/B1、F1↔B1/B2、F2↔B2/B3、F3↔B3/B4」。 */
const 对位 = 位 => (rowOfSlot(位) === ROW_FRONT ? 阻挡位(位) : 遮挡位(位));

/** 换位用的**相邻位** = 同排左右邻居 + 有阻挡关系的对位（作者 2026-10-10 拍板）。 */
function 相邻位(位) {
  const out = [];
  const r = rowOfSlot(位), c = colOfSlot(位);
  if (有这一列(r, c - 1)) out.push(slotOf(r, c - 1));
  if (有这一列(r, c + 1)) out.push(slotOf(r, c + 1));
  for (const s of 对位(位)) if (!out.includes(s)) out.push(s);
  return out;
}

/** 这个**后排位**现在被挡着吗：它的遮挡位里还有活人 → true。
 *  `活着的位` 传 Set / 数组 / 单位数组都行（界面与 AI 两边都从这里取，规则只有一份）。 */
function 被挡吗(位, 活着的位) {
  if (位 == null || rowOfSlot(位) !== ROW_BACK) return false;
  const 活 = 活位集(活着的位);
  return 遮挡位(位).some(s => 活.has(s));
}

/** 范围武器 `area:'col'` 用的**阻挡束**：一个前排位 + 它挡的 1–2 个后排位。
 *  后排位按**同列的前排位**归束；B4（后排第 5 列）没有同列前排 → 归它唯一的遮挡位 F3。 */
function 阻挡束(位) {
  if (位 == null || 位 < 0 || 位 >= SLOTS) return [];
  let 前;
  if (rowOfSlot(位) === ROW_FRONT) 前 = 位;
  else {
    const c = colOfSlot(位);
    前 = 有这一列(ROW_FRONT, c) ? slotOf(ROW_FRONT, c) : (遮挡位(位)[0] ?? null);
  }
  if (前 == null) return [位];
  return [前].concat(阻挡位(前));
}

/** 对照表（测试与文档直接读它，避免两处各写一份）：8 条阻挡关系，逐条是 `[前排位, 后排位]`。 */
const 阻挡关系 = [];
for (let c = 0; c < 阵型表[ROW_FRONT].列数; c++) {
  for (const b of (阻挡表[c] || [])) 阻挡关系.push([slotOf(ROW_FRONT, c), slotOf(ROW_BACK, b)]);
}

/* ============================================================================
 * 出击上限（作者 2026-10-10 第二次拍板：按**肉鸽里的等级**算，每 3 级 +1 个部署位）
 *              （作者 2026-10-11 **第三次拍板：改成两级封顶**）
 * ----------------------------------------------------------------------------
 * 作者 2026-10-10 原话：「这个等级是指**肉鸽里面的升级**，应该是**每 3 级增加一个部署位**」——
 * 所以上限由**战棋里的 `RUN.lvl`**（本仓库叫 `RUN.等级`，涨法见 `90-肉鸽.js`）驱动，
 * **起始 3 台、每 3 级 +1 台**（起始 3 是作者定的）。
 *
 * ★ 作者 2026-10-11 拍板三条（原话）：
 *   ① 「**可以允许上到 7-9 台**」→ `+出击上限` 的藏品是**永久加**，允许突破 6；
 *   ② 「**可以抬到 9，但是正常成长只到 6**」→ **等级那条线封顶 6**；**7–9 台只能靠藏品**；
 *      整条链路的**绝对封顶 = 9**（= 前排 4 + 后排 5 全满）；
 *   ③ 「**可以，可以带一个负面换正面**」→ `93-藏品.js` 里有一件「出击上限 −2、每进一层 +2 希望」。
 *
 * 形状照战棋 `24-Feena_指挥官.js:19` 的 `deployCap()`：
 *   `const deployCap = () => 4 + Math.floor((RUN.lvl - 1) / 3) + (skLv('编制') >= 2 ? 1 : 0) + (hasRelic('f4') ? 1 : 0);`
 * 我们抄的是**「起始值 + floor((肉鸽等级 − 1) / 3) + 加成 + 封顶」这个形状**
 * （战棋那两项加成 —— 指挥官技能 / 藏品 f4 —— 本仓库仍然没接；起始值战棋是 4，我们按作者的话用 3）：
 *   等级那条线：Lv1–3 → 3 台、Lv4–6 → 4、Lv7–9 → 5、**Lv10+ → 6（到顶）**；
 *   加藏品：最多再 +N，**绝对封顶 9 台**（9 格摆满）。
 * ★ 四个常量都是**初稿·待作者调**，改这里就够。
 * ========================================================================== */
const 出击上限初值 = 3;          // 【初稿·待作者调】一开始只上 3 台（作者 2026-10-10 定）
const 等级成长顶 = 6;            // 【初稿·待作者调】★ 等级那条线最多 6 台（作者 2026-10-11：「正常成长只到 6」）
const 绝对顶 = 9;                // 【初稿·待作者调】★ 含藏品加成的绝对封顶 9 台（= 前 4 + 后 5 全满，
                                 //   作者 2026-10-11：「可以允许上到 7-9 台」「可以抬到 9」）
const 每几级加一台 = 3;          // 【初稿·待作者调】肉鸽等级每涨 3 级 +1 个部署位（作者 2026-10-10）
const 肉鸽等级基准 = 1;          // 肉鸽等级从 1 起算（战棋 `27-开局.js:33` 的 `lvl:1`）

/** **肉鸽等级**（`RUN.等级`）+ **藏品加成** → 出击上限（作者 2026-10-11 拍板的**两级封顶**）：
 *   ① 等级那条线 = `min(等级成长顶, 3 + floor((等级 − 1) / 3))` —— 正常成长**只到 6 台**；
 *   ② 加上**藏品加成**（`+出击上限` 类藏品，拿到就永久加、允许突破 6）；
 *   ③ 再夹到 `绝对顶 = 9` —— **7–9 台只能靠藏品**。
 *  ④ 下限沿用上一版的 `出击上限初值`（= 3）：负数藏品（`战线收缩令 −2`）最多把上限压回 3 台。
 * ★ 只传等级、不传藏品加成 = 老口径（练习模式 / 没有 RUN 的调用点），结果与上一版逐字相同。 */
function 出击上限(肉鸽等级, 藏品加成 = 0) {
  const lv = Number(肉鸽等级);
  const 级 = Number.isFinite(lv) ? lv : 肉鸽等级基准;
  const 等级那条 = Math.min(等级成长顶, 出击上限初值 + Math.floor((级 - 肉鸽等级基准) / 每几级加一台));
  const 加 = Number(藏品加成);
  return Math.max(出击上限初值, Math.min(绝对顶, 等级那条 + (Number.isFinite(加) ? 加 : 0)));
}

/** **藏品部署位加成**：把 `RUN.藏品` 里所有 `数值.出击上限` 加起来（没有 RUN / 没有藏品 → 0）。
 *  出处：`协作/集成战略藏品调研.md` 第 3.1 节的「可同时部署人数 **+1 / +2**」（我们叫「出击上限」）+
 *  第 3.4 节的负面档（`酒神的印记` 的 **−2** 思路）。**加多少由 `93-藏品.js` 的藏品表写死，这里只求和。**
 *  ★ 只要在 `RUN.藏品` 里就生效（拿到即永久），不需要额外字段。 */
function 藏品部署位加成(RUN) {
  const 跑 = RUN || (typeof 肉鸽 !== 'undefined' && 肉鸽 && 肉鸽.RUN) || null;
  if (!跑 || typeof 藏品表 === 'undefined' || !藏品表) return 0;
  let n = 0;
  for (const id of (跑.藏品 || [])) {
    const 件 = 藏品表[id];
    const 加 = 件 && 件.数值 && 件.数值.出击上限;
    if (Number.isFinite(Number(加))) n += Number(加);
  }
  return n;
}

/** 现在的肉鸽等级 → **两级封顶**的界面提示（编队屏 / 大地图顶栏都读它）。
 *  返回 `{上限, 到顶, 解锁等级, 还差, 等级上限, 等级到顶, 等级成长顶, 绝对顶, 藏品加成}`：
 *   - `等级上限` / `等级到顶` —— **等级那条线**（最多 6 台）：Lv1 → 3、Lv4 → 4、Lv7 → 5、Lv10+ → 6；
 *   - `上限` —— 等级那条线 **+ 藏品加成**，夹在 `绝对顶 = 9` 内；
 *   - `到顶` —— 已经顶到 **9 台**（= 等级到顶 **且** 藏品也加满）；
 *   - `解锁等级` / `还差` —— 下一台要升到几级（等级那条线到 6 之后是 `null` / `0`，再往上只能靠藏品）。 */
function 出击上限提示(肉鸽等级, 藏品加成 = 0) {
  const lv = Number(肉鸽等级);
  const 等级 = Number.isFinite(lv) ? lv : 肉鸽等级基准;
  const 等级上限 = Math.min(等级成长顶, 出击上限初值 + Math.floor((等级 - 肉鸽等级基准) / 每几级加一台));
  const 加 = Number(藏品加成);
  const 藏品加成数 = Number.isFinite(加) ? 加 : 0;
  const 上限 = 出击上限(等级, 藏品加成数);
  const 等级到顶 = 等级上限 >= 等级成长顶;
  const 解锁等级 = 等级到顶 ? null : 肉鸽等级基准 + (等级上限 - 出击上限初值 + 1) * 每几级加一台;
  return {
    上限, 到顶: 上限 >= 绝对顶, 解锁等级, 还差: 解锁等级 == null ? 0 : 解锁等级 - 等级,
    等级上限, 等级到顶, 等级成长顶, 绝对顶, 藏品加成: 藏品加成数,
  };
}

/* ---- 练习模式（没有 RUN、没有肉鸽等级）走**旧口径**：按名册里最高的**机体等级**算 ----
 * 机体等级（Lv10 / 20 / 30）和肉鸽等级不是一回事，**不能**塞进上面那个公式
 * （否则 Lv10 的机体一上来就顶到 6 台）。2026-10-10 第一次交付的档位原样保留：
 *   Lv10 → 3 台、Lv15 → 4、Lv20 → 5、Lv25+ → 6（到顶）。 */
const 机体等级基准 = 10;         // 【初稿·待作者调】练习模式从 Lv10 起（旧口径）
const 机体每几级加一台 = 5;      // 【初稿·待作者调】机体等级每 5 级 +1 台（旧口径）

/** **机体等级**（练习模式）→ 出击上限：3 → 6，旧档位。
 *  ★ 练习模式**没有 RUN、也没有藏品加成**，所以封顶用 `等级成长顶`（= 6），不是 `绝对顶`。
 *    作者 2026-10-11 的两级封顶只加在**肉鸽**那条链路上（7–9 台只能靠藏品）。 */
function 出击上限按机体等级(机体等级) {
  const lv = Number(机体等级);
  const n = 出击上限初值 + Math.floor(((Number.isFinite(lv) ? lv : 机体等级基准) - 机体等级基准) / 机体每几级加一台);
  return Math.max(出击上限初值, Math.min(等级成长顶, n));
}

/** 名册（`RUN.队伍` = [{键, 等级}]）→ 出击上限：按**名册里最高的机体等级**算（上面那条旧口径）。
 *  ★ 肉鸽里**不用这个**：肉鸽按 `RUN.等级`（肉鸽等级）算，见 `90-肉鸽.js` 的 `肉鸽.出击上限()`。 */
function 出击上限由名册(名册) {
  const 等级们 = (名册 || []).map(m => (m && (m.等级 || m.lv)) || 机体等级基准);
  return 出击上限按机体等级(等级们.length ? Math.max(...等级们) : 机体等级基准);
}
/* ============================================================================
 * 数据：角色 / 机体 / 敌人 / 武器（从机甲战棋复制，方案第 2 节）
 * ----------------------------------------------------------------------------
 * 来源：mecha-tactics 的 `Claude hand off/src/js/04-武器与机体.js`（v0.41.11 时点），
 * **整份原样复制**，一个字都没改（除了本文件开头这段说明）。
 * 复制过来之后两边各走各的：战棋冻结不动，这里以后按新项目的需要改。
 *
 * 第一期（M1）只用到：`ALLY_T` / `ENEMY_T` / `wp()` / `ENEMY_POOL` /
