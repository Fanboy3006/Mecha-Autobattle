/** 队伍成员的等级：按层数涨（第 1 层 Lv10、第 2 层 Lv20、第 3 层 Lv30） */
const 招募等级 = 层 => Math.min(30, 10 * Math.max(1, Math.min(3, 层)));

/* ---------------------------------------------------------------------------
 * 肉鸽等级（`RUN.等级` / `RUN.经验`）—— 作者 2026-10-10 第二次拍板：出击上限按它解锁
 * ---------------------------------------------------------------------------
 * 逐字照抄战棋 `27-开局.js:102-111`：
 *   `const LV_NEED = [0, 0, 8, 18, 30, 44, 60, 78, 98, 120, 144, 170];`
 *   `const HOPE_PER_LV = 5;`
 *   `async function gainExp(x, src){ RUN.exp += x; runLog(`${src}：经验 +${x}`);
 *      while (RUN.lvl + 1 < LV_NEED.length && RUN.exp >= LV_NEED[RUN.lvl + 1]){
 *        RUN.lvl++; RUN.hope += HOPE_PER_LV; runLog(`部队升到 Lv${RUN.lvl}：希望 +${HOPE_PER_LV}`); … } }`
 * 经验来源（战棋 `31-战斗.js:281`，逐字）：作战 5 / 精英 8 / 出口守军 9 / 侵蚀源 9 / 追击 7。
 * ------------------------------------------------------------------------- */

/** 下一级要多少经验（照战棋 `27-开局.js:102` 的 `LV_NEED`；已经到表尾 → `null` = 升不动了）。 */
function 升级门槛(等级) {
  const i = Math.max(0, Math.floor(Number(等级) || 1)) + 1;
  return i < 肉鸽数值.等级门槛.length ? 肉鸽数值.等级门槛[i] : null;
}

/* ---------------------------------------------------------------------------
 * 希望来源账（作者 2026-10-11：「大地图上要能看出希望从哪来」）
 * ---------------------------------------------------------------------------
 * 光看 `RUN.希望` 一个数字，看不出「战斗给的 / 节点给的 / 升级给的 / 藏品省下的」各是多少，
 * 所以从这一版起**顺手记一笔**：`RUN.希望来源 = {初始, 战斗, 节点, 升级, 藏品省, 支出}`。
 *  · 只记账、**不改任何数值**（每一笔都在原来加 / 扣希望的那一行旁边记）；
 *  · 老存档没有这个字段 → `记希望来源` 会自己建；界面用 `希望来源说明()` 读，读不到就当 0；
 *  · 「藏品省」不是收入，是**藏品替我们省下的晋升希望**（t1–t6 教范免费晋升，见 `93-藏品.js`）；
 *  · 「藏品」是 2026-10-11 新造的 +希望 藏品的**真实收入**（w1 +1 / w2 +4 / w3 +8 / c1 +4 / c2 +2，
 *    以及 `d3 战线收缩令` 的「每进一层 +2 希望」）—— 拿到就进这一格。
 * ------------------------------------------------------------------------- */
const 希望来源空 = () => ({ 初始: 0, 战斗: 0, 节点: 0, 升级: 0, 藏品: 0, 藏品省: 0, 支出: 0 });

/** 记一笔希望账（来源：'初始' / '战斗' / '节点' / '升级' / '藏品' / '藏品省' / '支出'）。 */
function 记希望来源(R, 来源, 数) {
  if (!R || !数) return;
  R.希望来源 = R.希望来源 || 希望来源空();
  R.希望来源[来源] = (Number(R.希望来源[来源]) || 0) + 数;
}

/** 大地图上那一行「希望从哪来」的文字（界面和测试都读它）。 */
function 希望来源说明(R) {
  const s = Object.assign(希望来源空(), (R && R.希望来源) || {});
  const 每级 = 肉鸽数值.每级希望;
  return `希望从哪来：起始 ${s.初始} ＋ 战斗 ${s.战斗} ＋ 节点 ${s.节点} ＋ ` +
    `升级 ${s.升级}（每级 +${每级}${每级 ? '' : '，这一版升级不给希望'}）` +
    ` ＋ 藏品 ${s.藏品} ＋ 藏品省下 ${s.藏品省} － 花掉 ${s.支出} ＝ 手上 ${R ? R.希望 : 0}`;
}

/** 加经验 + 升级（**逐字照抄**战棋 `27-开局.js:104-111` 的 `gainExp(x, src)`）：
 *  `RUN.经验 += x` → 经验够了就 `RUN.等级++` 并且 `RUN.希望 += HOPE_PER_LV`（**可能连升好几级**）。
 *  `来源` 只进日志（战棋也是 `runLog(`${src}：经验 +${x}`)`）。返回 `{等级, 升了}` 或 `null`。 */
function 加经验(R, x, 来源) {
  if (!R) return null;
  /* 兜底：老存档 / 测试里手搭的 RUN 可能没有这两个字段（或值是坏值）—— 补成战棋的初值，
     不然下面的 while 会在 NaN 上打转。 */
  if (!Number.isFinite(Number(R.等级)) || Number(R.等级) < 1) R.等级 = 1;
  if (!Number.isFinite(Number(R.经验)) || Number(R.经验) < 0) R.经验 = 0;
  R.经验 = (R.经验 || 0) + x;
  肉鸽.记(`${来源 || '作战'}：经验 +${x}（部队 Lv${R.等级} ${R.经验} / ${升级门槛(R.等级) ?? '—'}）`);
  let 升了 = 0;
  while (升级门槛(R.等级) != null && R.经验 >= 升级门槛(R.等级)) {
    R.等级 += 1;
    R.希望 = (Number(R.希望) || 0) + 肉鸽数值.每级希望;
    记希望来源(R, '升级', 肉鸽数值.每级希望);        // 只记账，不加数值
    升了++;
    肉鸽.记(`部队升到 Lv${R.等级}：希望 +${肉鸽数值.每级希望}`);
  }
  return 升了 ? { 等级: R.等级, 升了 } : null;
}

/* ============================================================================
 * 晋升（作者点名要做的第 6 项 · 10 → 20 → 30）
 * ----------------------------------------------------------------------------
 * 出处（机甲战棋，只读，逐字照抄）：
 *   价格表        `22-输入.js:431`：`PRICE = {S:{rec:5,p20:3,p30:4}, A:{rec:3,p20:2,p30:3}, B:{rec:0,p20:1,p30:2}}`
 *   档位          `22-输入.js:425-429` 的 `TIER`、`:430` 的 `TIER_NAME`（S 精锐 / A 骨干 / B 普通）
 *   算钱          `22-输入.js:446`：`promoCost = (m, to) => Math.max(0, PRICE[tierOf(m)][to===20?'p20':'p30']
 *                   + (to===20 && CAP_CHARS.includes(m) ? 1 : 0)
 *                   - (RUN && RUN.promoDiscount ? 1 : 0) - (to===20 && RUN && skLv('编制')>=3 ? 1 : 0))`
 *   真的晋升      `31-战斗.js:324-332` 的 `runPromote(m)`：
 *                   `to = u.lv===10 ? 20 : u.lv===20 ? 30 : null`；`if (cost > RUN.hope) return;`
 *                   `RUN.hope -= cost; u.lv = to; if (RUN.promoDiscount) RUN.promoDiscount = false;`
 *                   `runLog(`${pilot} 晋升到 Lv${to}（−${cost} 希望）`)`
 *   界面          `29-渲染.js:62-70` 的 `teamCard()`：名册每行一个「→Lv20（N）」按钮，
 *                   `N > RUN.hope` 时 `disabled`；底部一行写「晋升价格：精锐 3 / 4，骨干 2 / 3，普通 1 / 2 希望」
 *   休整节点      `30-移动与节点.js:58-61`：`作战耐久 +2` 或 `下次晋升 −1 希望`（→ `RUN.promoDiscount = true`）
 *
 * ★ 本仓库的两处口径（都写进任务板）：
 *   ① **不花招募券**：战棋的晋升入口在招募券对话框里（`27-开局.js:78-86`），一次晋升要「希望 + 一张同类券」。
 *      本仓库的券系统还没做（`RUN.券` 是空数组、`90-肉鸽.js:98` 的注释），所以这一版**只花希望**——
 *      价格一分没动，缺的只是「券」这道额外的门槛。
 *   ② `CAP_CHARS = []`（`22-输入.js:432`，已取消）和 `skLv('编制')`（指挥官系统，`24-Feena_指挥官.js:5`
 *      的 `CMD_ENABLED = false`）在战棋里也恒不生效，所以那两项**照旧为 0**（不影响价格）。
 *
 * 晋升之后**等级与属性真的会变**：走现成的 `makeUnit()` → `levelUp()`（`40-单位.js:27-37`，
 * Lv20 / Lv30 的 +200HP / ×1.25 装甲 / +25 属性 / 闪避 +8 / 精准 +10 / 机动 +1 都在那里）。
 * ========================================================================== */

/** 晋升价格表（照抄 `22-输入.js:431` 的 `PRICE`，只取 p20 / p30 两项）。 */
const 晋升价格 = {
  S: { p20: 3, p30: 4 },      // 精锐（22-输入.js:431）
  A: { p20: 2, p30: 3 },      // 骨干
  B: { p20: 1, p30: 2 },      // 普通
};

/** 下一档等级：Lv10 → 20、Lv20 → 30、Lv30 → null（`31-战斗.js:326`）。 */
const 晋升目标 = lv => (lv === 10 ? 20 : lv === 20 ? 30 : null);

/** 晋升要花多少希望（`22-输入.js:446`；后两项在战棋里恒为 0，见文件头）。
 *  返回值最小 0（战棋的 `Math.max(0, …)` 也照抄）。 */
function 晋升要多少(键, 到, R) {
  const r = R || (肉鸽 && 肉鸽.RUN);
  const 档 = tierOf(键) || 'B';
  const 表 = 晋升价格[档] || 晋升价格.B;
  const 基 = 到 === 20 ? 表.p20 : 表.p30;
  return Math.max(0, 基 - ((r && r.下次晋升减价) ? 1 : 0));
}

/** 一台机体**晋升前后的关键数字**（界面显示 / 测试对账用）。
 *  ★ 数字全部来自 `makeUnit()`（= `levelUp()` 的真实结果），不是这里自己算的。 */
function 晋升预览(键, 等级) {
  const 前 = makeUnit(键, 'ally', 0, 等级);
  const 到 = 晋升目标(等级);
  const 后 = 到 ? makeUnit(键, 'ally', 0, 到) : 前;
  const 取 = u => ({
    lv: u.lv, maxHp: u.maxHp, armor: u.armor, defense: u.defense, eva: u.eva, aim: u.aim,
    melee: u.melee, shoot: u.shoot, awaken: u.awaken, mov: u.mov, 速度: speedOf(u),
  });
  return { 键, 前: 取(前), 后: 取(后), 到 };
}

const 肉鸽 = {

    const 已过 = 格.已过 || 格.类型 === '空';

  黑市货() {

  /** 黑市价格（战棋 30:96 / 23b:122：`f1 黑市会员卡` −30%）。 */
  黑市价(id) {

  /** 买东西。返回 {ok, why} 或 {ok:true, id}。 */
  黑市买(id) {

    if (R.藏品.includes(id)) return { ok: false, why: '这件藏品已经在手上了' };
    const 价 = this.黑市价(id);
    if (R.源碳 < 价) return { ok: false, why: `源碳不够（要 ${价}，只有 ${R.源碳}）` };

    const 件 = 拿藏品(id, '黑市');
    if (R.黑市货) R.黑市货.列表 = R.黑市货.列表.filter(x => x !== id);
    this.记(`黑市：花 ${价} 源碳买下【${件 ? 件.名 : id}】`);
    this.存档();
    return { ok: true, id, 价, 名: 件 ? 件.名 : id };
  },
  /** 离开黑市 = 这一格结算完。 */
  黑市离开() { this.节点完成(); return true; },

  /** 瞭望站：推进剂 +1（上限 推进剂上限+1）、揭开周围 4 格、希望 +3（初稿）—— 战棋 30:74-76。 */
  结算瞭望站() {
    const R = this.RUN;
    if (!R) return null;
    const 上限 = 推进剂上限(R) + 1;
    R.推进剂 = Math.min(上限, R.推进剂 + 1);
    let 揭开 = 0;
    for (const kk of Object.keys(R.地图.格).map(Number)) {
      const dx = Math.abs(格列(kk) - 格列(R.当前)), dy = Math.abs(格行(kk) - 格行(R.当前));
      if (dx + dy <= 4) { if (!R.已揭开.includes(kk)) { R.已揭开.push(kk); 揭开++; } }
    }
    R.希望 += 肉鸽数值.瞭望站希望;
    记希望来源(R, '节点', 肉鸽数值.瞭望站希望);
    this.记(`瞭望站：推进剂 +1（${R.推进剂}/${上限}）、揭开周围 ${揭开} 格、希望 +${肉鸽数值.瞭望站希望}`);
    this.节点完成();
    return { 推进剂: R.推进剂, 揭开, 希望: 肉鸽数值.瞭望站希望 };
  },

  /** 废弃隧道：另一头在 `地图.隧道` 里；传送**不花推进剂**（战棋 30:38-44）。 */
  隧道另一头() {
    const R = this.RUN;
    if (!R || !R.地图 || !R.地图.隧道) return null;
    return R.地图.隧道.find(t => t !== R.当前);
  },
  结算隧道() {
    const R = this.RUN;
    if (!R) return null;
    const 那头 = this.隧道另一头();
    if (那头 == null) { this.记('废弃隧道：另一头已经塌了（这一格没有配对隧道）'); this.节点完成(); return { 传送: false }; }
    R.已揭开.push(那头);
    R.当前 = 那头;
    if (!R.已走过.includes(那头)) R.已走过.push(那头);
    this.记(`废弃隧道：传送到 (${格列(那头) + 1}, ${格行(那头) + 1})，不花推进剂`);
    this.存档();
    return { 传送: true, 到: 那头, 类型: R.地图.格[那头].类型 };
  },

  /** 遗迹：源碳 +2 + **给一个零件**（战棋 `30:79`：`RUN.he += 2; givePart(pick(Object.keys(PARTS)), '遗迹')`）。
   *  ★ 这一版把原来那句「换成一半概率给藏品（初稿）」**改回照抄战棋**：遗迹给零件。
   *    新增的「一半概率给藏品」当**附加**留着（作者 M4 起就在跑这条，去掉会少一份奖励），
   *    但两边的签都走种子，同一局同一格抽到的两样都可复现。 */
  结算遗迹(用随机 = true) {
    const R = this.RUN;
    if (!R) return null;
    R.源碳 += 肉鸽数值.遗迹源碳;
    /* ① 照抄战棋 30:79：给一个零件 */
    const k = 抽零件(R, R.当前);
    const 零件 = k ? 拿零件(k, '遗迹') : null;
    /* ② 本仓库的附加（M4 起）：一半概率再给一件藏品（初稿） */
    let 得 = null;
    const rng = mulberry32((R.种子 + R.层 * 977 + R.当前 * 13) >>> 0);
    if (用随机 && rng() < 肉鸽数值.遗迹藏品率) {
      const id = 抽藏品(R, rng, R.当前);
      if (id) 得 = 拿藏品(id, '遗迹');
    }
    this.记(`遗迹：源碳 +${肉鸽数值.遗迹源碳}${零件 ? `、零件【${零件.名}】` : '（零件箱满了）'}${得 ? `、藏品【${得.名}】` : ''}`);
    this.节点完成();
    return { 源碳: 肉鸽数值.遗迹源碳, 藏品: 得, 零件 };
  },

  /** 休整（战棋 30:58-61）：**作战耐久 +2** 或 **下次晋升 −1 希望**（`RUN.promoDiscount = true`）。
   *  ★ 这一版把第二项从「花 2 希望买耐久（初稿）」**改回照抄战棋**（晋升做出来了，减价这条才成立）；
   *    「花希望买耐久」当第三项留着（作者 M4 起在跑，去掉会少一条路），第三项才是跳过。
   *    战棋只有两项（选 `dur` 之外的一律走 `promo`），所以「跳过」是本仓库多出来的那个。 */
  结算休整(选) {
    const R = this.RUN;
    if (!R) return null;
    if (选 === '耐久') {
      R.耐久 += 肉鸽数值.休整耐久;
      this.记(`休整：作战耐久 +${肉鸽数值.休整耐久}（现在 ${R.耐久}）`);
    } else if (选 === '晋升') {
      /* 照抄 30:60：`RUN.promoDiscount = true`（只减一次价，下次晋升时清掉，见 31:328） */
      return this.休整减价();
    } else if (选 === '希望') {
      if (R.希望 < 肉鸽数值.休整希望) return { ok: false, why: `希望不够（要 ${肉鸽数值.休整希望}，只有 ${R.希望}）` };
      R.希望 -= 肉鸽数值.休整希望;
      记希望来源(R, '支出', 肉鸽数值.休整希望);
      R.耐久 += 1;
      this.记(`休整：花 ${肉鸽数值.休整希望} 希望 → 作战耐久 +1（现在 ${R.耐久}，希望 ${R.希望}）`);
    } else {
      this.记('休整：这一格直接跳过（没有休息）');
    }
    this.节点完成();
    return { ok: true, 选: 选 || '跳过', 耐久: R.耐久, 希望: R.希望, 减价: R.下次晋升减价 };
  },

  /** 侵蚀源（第 2 层起）：**一场硬仗 + 额外奖励**。
   *  ★ 方案第一期不做「侵蚀场」本身（战棋 25-侵蚀场.js 的 4 种效果都是改地形的），
   *    所以这一格在**本仓库里只是一个强敌节点**：编成照「精英」（Lv 曲线是 source，比精英更高），
   *    打赢了按精英档发藏品 + 额外源碳。 */
  结算侵蚀源胜利() {
    const R = this.RUN;
    if (!R) return null;
    R.源碳 += 肉鸽数值.侵蚀源源碳;
    const id = 抽藏品(R, null, R.当前);
    const 得 = id ? 拿藏品(id, '侵蚀源') : null;
    this.记(`侵蚀源：额外奖励 源碳 +${肉鸽数值.侵蚀源源碳}${得 ? `、藏品【${得.名}】` : '（藏品已拿全）'}`);
    this.存档();
    return { 源碳: 肉鸽数值.侵蚀源源碳, 藏品: 得 };
  },
  /* ---------------- 战斗节点的结果 ---------------- */
  /** 战斗结束（从界面回调）。
   *  `格类型` = 这一场的节点类型（作战 / 精英 / 侵蚀源 / 出口守军 / 追击）。
   *  ★ 经验（作者 2026-10-10 第二次拍板带出来的）：**打完一场就给**，数照战棋 `31-战斗.js:281`
   *    （作战 5 / 精英 8 / 出口守军 9 / 侵蚀源 9 / 追击 7）；战棋是**胜败都给**（`31:291` 在胜负分支之后），
   *    只有「作战耐久耗尽、本局结束」那一下不给（`31:272-276` 直接 return）—— 这里照抄。 */
  战斗结束(结果, 格类型, 战报) {
    const R = this.RUN;
    if (!R) return null;
    const 是胜 = 结果 === '胜';
    const 发经验 = () => {
      const x = 肉鸽数值.战斗经验[格类型] || 0;
      if (x) this.经验(x, (节点类型表[格类型] ? 节点类型表[格类型].名 : 格类型) + '结算');
    };
    if (是胜) {
      发经验();
      const 奖 = 节点奖励类型[格类型] || '战斗';
      const 希望 = 奖 === 'Boss' ? 肉鸽数值.Boss希望 : (奖 === '精英' ? 肉鸽数值.精英希望 : 肉鸽数值.胜利希望);
      const 源碳 = 肉鸽数值.胜利源碳;
      R.希望 += 希望;
      R.源碳 += 源碳;
      记希望来源(R, '战斗', 希望);            // 希望来源账：战斗给的那一份
      R.场次++;
      this.记(`${节点类型表[格类型] ? 节点类型表[格类型].名 : 格类型}胜利：希望 +${希望}、源碳 +${源碳}`);
      /* 藏品（方案第 7 节 · 作者 2026-10-10 要做）：精英 / Boss 战斗胜利发 1 件。
         抽签走 `抽藏品(RUN, rng, 格号)` —— rng 由「这一局的种子 + 层 + 场次 + 格号」算出来，
         所以**同一局同一格抽到的藏品可复现**（方案 6.1 的硬规矩，不使用 Math.random）。 */
      const 得 = 战斗胜利发藏品(奖, this.当前格());
      /* 零件（战棋 31-战斗.js:293「精英必给、其他 35%」→ 本仓库落在奖励档上：精英 / Boss 必给） */
      const 零件 = 战斗发零件(奖, 奖 === 'Boss' ? 'Boss 战战利品' : (奖 === '精英' ? '精英战战利品' : '战利品'));
      /* 侵蚀源：硬仗 + **额外奖励** */
      const 额外 = 格类型 === '侵蚀源' ? this.结算侵蚀源胜利() : null;
      if (格类型 === '出口守军') {
        /* 出口守军：打通关口，出口才放行（**不换层**，换层由走到「出口」那一格决定） */
        this.清空格(this.当前格());
        this.记('出口守军已被击溃：出口放行');
        this.存档();
        return { 胜: true, 希望, 源碳, 藏品: 得, 零件, 额外, 守军已清: true };
      }
      if (格类型 === '追击') {
        this.记('追击战打赢了：继续前进');
        this.追击之后();
        return { 胜: true, 希望, 源碳, 藏品: 得, 零件, 额外, 追击结束: true };
      }
      this.节点完成();
      return { 胜: true, 希望, 源碳, 藏品: 得, 零件, 额外 };
    }
    const 扣 = this.失败耐久(战报);
    R.耐久 -= 扣;
    this.记(`战斗失败：作战耐久 −${扣}（按剩下的敌人数算，剩 ${R.耐久}）`);
    if (R.耐久 <= 0) { this.失败('作战耐久耗尽'); return { 胜: false, 结束: true, 扣 }; }
    发经验();                       // 战棋 31:291：耐久没耗尽时**打输也给经验**
    if (格类型 === '追击') { this.记('追击战没打赢，但甩掉了追兵'); this.追击之后(); return { 胜: false, 扣, 追击结束: true }; }
    /* 失败不通过节点：留在原地（可以再挑别的路，或者再打一次） */
    this.存档();
    return { 胜: false, 扣 };
  },

  /* ---------------- 晋升（10 → 20 → 30） ---------------- */
  /** 名册上每台机体的晋升情况（界面直接照着画；测试也读它）。
   *  返回 `[{键, 等级, 到, 价, 能升, 理由, 属性}]`，顺序 = 名册顺序。 */
  晋升清单() {
    const R = this.RUN;
    if (!R) return [];
    return (R.队伍 || []).map(m => {
      const 到 = 晋升目标(m.等级);
      const 价 = 到 ? 晋升要多少(m.键, 到, R) : 0;
      const 能升 = !!到 && R.希望 >= 价;
      return {
        键: m.键, 名: allyName(m.键), 等级: m.等级, 到, 价, 能升,
        档: tierOf(m.键), 档名: TIER_NAME[tierOf(m.键)] || '普通',
        理由: !到 ? '已经 Lv30（到顶了）' : (能升 ? '' : `希望不够（要 ${价}，只有 ${R.希望}）`),
        属性: 到 ? 晋升预览(m.键, m.等级) : null,
      };
    });
  },
  /** 晋升一台（照 `31-战斗.js:324-332` 的 `runPromote`）：
   *  ① 等级不是 10 / 20 就拒绝（**不能跳级**：Lv10 不能直接升 30）；② 希望不够就拒绝；
   *  ③ 扣希望、等级 +10、用掉「下次晋升减价」、写一行日志；
   *  ④ **属性真的重算**（走 `makeUnit` → `levelUp`，和招募 / 战斗里的同一套规则）、进存档。
   *  返回 `{ok:true, 键, 从, 到, 价, 前, 后}` 或 `{ok:false, why}`。 */
  晋升(键) {
    const R = this.RUN;
    if (!R) return { ok: false, why: '没有进行中的局' };
    const m = (R.队伍 || []).find(x => x.键 === 键);
    if (!m) return { ok: false, why: '名册里没有这台机体' };
    const 到 = 晋升目标(m.等级);
    if (!到) return { ok: false, why: `${m.键} 已经 Lv${m.等级}，到顶了` };
    const 价 = 晋升要多少(m.键, 到, R);
    if (R.希望 < 价) return { ok: false, why: `希望不够（要 ${价}，只有 ${R.希望}）` };
    const 从 = m.等级;
    const 前 = 晋升预览(m.键, 从).前;
    R.希望 -= 价;
    记希望来源(R, '支出', 价);
    m.等级 = 到;
    if (R.下次晋升减价) R.下次晋升减价 = false;      // 31-战斗.js:328：用掉一次就清
    const 后 = 重算名册属性(键).后;
    this.记(`${m.键} 晋升到 Lv${到}（−${价} 希望，剩 ${R.希望}）：HP ${前.maxHp} → ${后.maxHp}、` +
      `装甲 ${前.armor} → ${后.armor}、防御 ${前.defense} → ${后.defense}、机动 ${前.mov} → ${后.mov}`);
    this.存档();
    return { ok: true, 键, 名: allyName(键), 从, 到, 价, 前, 后, 希望: R.希望 };
  },
  /** 休整节点的第二项（照战棋 `30:58-61`）：`下次晋升 −1 希望`。 */
  休整减价() {
    const R = this.RUN;
    if (!R) return null;
    R.下次晋升减价 = true;
    this.记('休整：下次晋升 −1 希望');
    this.节点完成();
    return { ok: true, 减价: true };
  },

  /* ---------------- 招募 / 事件 ---------------- */
  /** 招募（战棋：花希望——精锐 5 / 骨干 3 / 普通 0；招到 Lv10；队伍上限 12；不能重复） */
  招募(键) {
    const R = this.RUN;
    if (!R) return { ok: false, why: '没有进行中的局' };
    if (R.队伍.length >= 肉鸽数值.队伍上限) return { ok: false, why: `队伍已经满了（${肉鸽数值.队伍上限} 台）` };
    if (R.队伍.some(m => m.键 === 键)) return { ok: false, why: '这位机师已经在队里了' };
    const 费 = 肉鸽数值.招募费[tierOf(键)] || 0;
    if (R.希望 < 费) return { ok: false, why: `希望不够（要 ${费}，只有 ${R.希望}）` };
    R.希望 -= 费;
    记希望来源(R, '支出', 费);
    R.队伍.push({ 键, 等级: 肉鸽数值.招募等级 });
    if (R.出击.length < this.出击上限()) R.出击.push(键);
    this.记(`招募 ${键}（Lv${肉鸽数值.招募等级}，花希望 ${费}）`);
    /* 招募之后：把还没用掉的教范藏品用掉（照战棋 23b:130-134 的 relicPendingPromo） */
    if (typeof 用掉待晋升 === 'function') 用掉待晋升(R);
    this.节点完成();
    return { ok: true, 费 };
  },
  /** 出击名单（最多 `出击上限()` 台，摆进 9 格阵型里）：加/减一台 */
  切换出击(键) {
    const R = this.RUN;
    if (!R) return false;
    if (R.出击.includes(键)) R.出击 = R.出击.filter(k => k !== 键);
    else {
      if (R.出击.length >= this.出击上限()) return false;
      if (!R.队伍.some(m => m.键 === 键)) return false;
      R.出击.push(键);
    }
    this.存档();
    return true;
  },
  /** 事件（战棋 30:123-135 的简化：本仓库只有「希望 / 源碳」两条路） */
  奇遇(选) {
    const R = this.RUN;
    if (!R) return null;
    if (选 === '源碳') R.源碳 += 肉鸽数值.奇遇源碳; else { R.希望 += 肉鸽数值.奇遇希望; 记希望来源(R, '节点', 肉鸽数值.奇遇希望); }
    this.记(`事件：${选 === '源碳' ? `源碳 +${肉鸽数值.奇遇源碳}` : `希望 +${肉鸽数值.奇遇希望}`}`);
    this.节点完成();
    return true;
  },
  /** 补给（兼容 M4 的老调用点）：源碳 +8；`tests/relic.js` 的老代码还在用它走格子。 */
  补给() {
    const R = this.RUN;
    if (!R) return null;
    R.源碳 += 肉鸽数值.补给源碳;
    this.记(`补给：源碳 +${肉鸽数值.补给源碳}`);
    this.节点完成();
    return 肉鸽数值.补给源碳;
  },

  /* ---------------- 失败 / 通关 ---------------- */
  失败耐久(战报) { const 剩 = 战报 && 战报.敌方 ? 战报.敌方.filter(u => u.hp > 0).length : 1; return Math.max(1, 剩); },
  /** 清空一格（战棋 30:83 的 emptyNode：cleared = true、type = 'empty'）。 */
  清空格(n) { if (!n) return; n.已过 = true; n.类型 = '空'; n.关卡 = null; },
  失败(原因) {
    const R = this.RUN;
    this.进行中 = false;
    if (R) { R.结局 = '失败'; R.结局原因 = 原因; }
    this.记(`本局结束：${原因}`);
    this.清存档();
    return 原因;
  },
  /** 通关（第 4 层出口守军打完 → 走到出口）。**修掉「打完终点 Boss 不通关」的那个缺口。** */
  通关() {
    const R = this.RUN;
    this.进行中 = false;
    if (R) {
      R.结局 = '通关';
      R.结局原因 = '击败终点守军，走出混沌迷宫';
      this.记(`通关！走了 ${R.层} 层、打了 ${R.场次} 场，队伍 ${R.队伍.length} 台、藏品 ${R.藏品.length} 件`);
    }
    this.清存档();
    return R ? R.结局 : '通关';
  },

  /* ---------------- 日志 ---------------- */
  记(文字) { if (this.RUN) this.RUN.日志.push({ 层: this.RUN.层, 文本: 文字, 时间: Date.now() }); },

  /* ---------------- 存档（关掉页面能继续） ---------------- */
  /* 版本 v3（阵型 9 格）：结构变了，所以**换键**。读到旧版本的存档一律**丢弃并提示**，
     不崩、也不把旧阵型硬读成新阵型（`位 3` 的语义从「后1」变成了「前4」）。 */
  存档() {
    if (!this.RUN) return false;
    try {
      const 存 = { RUN: this.RUN, 进行中: this.进行中 };
      if (typeof localStorage !== 'undefined' && localStorage.setItem) localStorage.setItem(存档键, JSON.stringify(存));
      return true;
    } catch (e) { return false; }
  },
  /** 旧版本（v1 / v2）的存档还在不在：界面用它决定要不要提示「旧存档已作废」。 */
  有旧存档() {
    try {
      if (typeof localStorage === 'undefined' || !localStorage.getItem) return false;
      return 旧存档键们.some(k => !!localStorage.getItem(k));
    } catch (e) { return false; }
  },
  /** 把旧版本的存档清掉（读档时顺手丢，避免菜单上一直提示）。 */
  清旧存档() {
    let n = 0;
    try {
      if (typeof localStorage !== 'undefined' && localStorage.removeItem) {
        for (const k of 旧存档键们) if (localStorage.getItem(k)) { localStorage.removeItem(k); n++; }
      }
    } catch (e) { /* 读不到 localStorage 就算了 */ }
    return n;
  },
  读存档() {
    try {
      if (typeof localStorage === 'undefined' || !localStorage.getItem) return null;
      const s = localStorage.getItem(存档键);
      if (!s) { this.清旧存档(); return null; }              // 只有旧版本的存档 → 丢掉，别读错阵型
      const 存 = JSON.parse(s);
      if (!存 || !存.RUN || !存.RUN.地图 || !存.RUN.地图.格) return null;
      /* 版本不对（未来版本 / 旧版本混进来）：丢弃并记一句提示，不让它把界面弄崩 */
      if (存.RUN.版本 != null && 存.RUN.版本 !== 存档版本) { this.清存档(); return null; }
      this.RUN = 存.RUN;
      this.进行中 = !!存.进行中;
      /* 旧存档（v3 键里、加 `等级` / `经验` 之前存的那一版）**缺这两个字段** ——
         安全补默认值（战棋 `27-开局.js:33` 的 `lvl:1, exp:0`），不崩、也不把上限算成 NaN。 */
      const 旧等级 = Number(this.RUN.等级);
      if (!Number.isFinite(旧等级) || 旧等级 < 1) this.RUN.等级 = 1;
      const 旧经验 = Number(this.RUN.经验);
      if (!Number.isFinite(旧经验) || 旧经验 < 0) this.RUN.经验 = 0;
      /* Set 不能进 JSON：读回来补上（界面用） */
      this.RUN.已走过集 = new Set(this.RUN.已走过 || []);
      this.RUN.已揭开集 = new Set(this.RUN.已揭开 || []);
      return this.RUN;
    } catch (e) { return null; }
  },
  有存档() { return !!this.读存档(); },
  清存档() {
    try { if (typeof localStorage !== 'undefined' && localStorage.removeItem) localStorage.removeItem(存档键); } catch (e) {}
  },
};

/** 这一格走过了吗（战棋 moveTargets 会滤掉走过的格；新项目里「已过」还要看 node.cleared）。 */
function 格没走过(RUN, k) {
  if (k === RUN.当前) return false;
  const n = RUN.地图.格[k];
  if (!n) return false;
  if (n.已过 || n.类型 === '空') return false;      // 空节点 / 结算完的节点不再作为目标
  if (n.类型 === '出口') return true;               // 出口永远可以再点（层没换掉的话）
  return !RUN.已走过.includes(k);
}

/* ---------------------------------------------------------------------------
 * 名册属性重算（晋升之后要**真的**变强）
 * ---------------------------------------------------------------------------
 * 为什么要重算：名册（`RUN.队伍`）里只存 `{键, 等级}`（照战棋 `27-开局.js:41,87` 的 `{mech, lv}`），
 * 属性是每次开战时由 `makeUnit(键, 'ally', 位, 等级)` **现算**的（`40-单位.js:43-57` → `levelUp`）。
 * 所以晋升完只要改了 `等级`，下一次开战就自动是新数值 —— 这个函数额外现算一份**给界面和测试看**，
 * 保证「名册上写的数字」和「战斗里真的会用的数字」是同一个来源（不是这里自己算的公式）。
 * ------------------------------------------------------------------------- */

/** 重算名册里某一台的属性（`键` 省略 = 全名册）。返回 `{键, 等级, 前, 后}`；
 *  `前` 用 `键@Lv10` 那一档当基准（战棋的招募等级），`后` = 这名队员现在的真实数值。 */
function 重算名册属性(键) {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R || !R.队伍) return null;
  const 台 = 键 ? R.队伍.filter(m => m.键 === 键) : R.队伍;
  const 取 = u => ({
    lv: u.lv, maxHp: u.maxHp, armor: u.armor, defense: u.defense, eva: u.eva, aim: u.aim,
    melee: u.melee, shoot: u.shoot, awaken: u.awaken, mov: u.mov, 速度: speedOf(u),
  });
  const 们 = 台.map(m => {
    const u = makeUnit(m.键, 'ally', 0, m.等级);
    return { 键: m.键, 等级: m.等级, 前: 取(makeUnit(m.键, 'ally', 0, 肉鸽数值.招募等级)), 后: 取(u) };
  });
  return 键 ? (们[0] || null) : 们;
}

/** 能在地图上真的用出来 / 真的生效的零件（进随机池、能掉落、能买；`用:false` 的不进）。
 *  ★ 理财类（bloodcap / wave）不在池子里：本仓库没有「卖零件」的口子。 */
const 零件池 = () => Object.keys(零件表).filter(k => 零件表[k].用);

/** 零件箱上限（战棋 `RUN.partCap` 默认 8，`30:85,100`；黑市「空间租赁」+1 是 `30:113`，
 *  本仓库黑市不卖零件 → `RUN.空间租赁` 也没有来源，这里保留初值 8）。 */
const 零件箱初值 = 8;

/* ---------------------------------------------------------------------------
 * 拿到 / 用掉 / 手上的零件（照战棋 30-移动与节点.js:84-95 的 givePart / newPart）
 * ------------------------------------------------------------------------- */

/** 战棋 `newPart(k)`（`23-零件.js:20`）：`{k, uses, value}` —— 次数 / 估价没有就是 null。 */
function 新零件(k) {
  const P = 零件表[k];
  if (!P) return null;
  return { k, uses: P.次数 != null ? P.次数 : null, value: P.估价 != null ? P.估价 : null };
}

/** 拿到一个零件（战棋 givePart，`30:84-95`）。
 *  战棋会弹「零件箱满了，换掉哪一件 / 放弃」；本仓库这一步的界面还没做，所以
 *  **满了就直接不收**（战棋里点「放弃」也是这个结果），并在 `RUN.日志` 里写一行。 */
function 拿零件(k, 来源) {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R || !零件表[k]) return null;
  R.零件 = R.零件 || [];
  const 上限 = R.零件箱 || 零件箱初值;
  if (R.零件.length >= 上限) {
    肉鸽.记(`零件箱已经满了（${上限}）：【${零件表[k].名}】没地方放，丢下了（${来源 || '战利品'}）`);
    return { k, 名: 零件表[k].名, 满了: true };
  }
  R.零件.push(新零件(k));
  肉鸽.记(`获得零件【${零件表[k].名}】：${零件表[k].说明}（${来源 || '战利品'}）`);
  if (k === 'rite') 重算推进剂加成();               // 河谷祭祈：拿在手上就生效
  肉鸽.存档();
  return { k, 名: 零件表[k].名, 说明: 零件表[k].说明, 来源: 来源 || '战利品' };
}

/** 丢掉某个下标（战棋 `RUN.parts.splice`，`30:10,120`）。 */
function 丢零件(i) {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R || !R.零件) return null;
  const p = R.零件[i];
  if (!p) return null;
  R.零件.splice(i, 1);
  if (p.k === 'rite') 重算推进剂加成();
  肉鸽.存档();
  return p;
}

/** 河谷祭祈（`24-Feena_指挥官.js:18` 里 propMax() 的最后一项）：手上的零件给的推进剂上限加成。 */
function 重算推进剂加成() {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R) return 0;
  R.零件推进剂加成 = (R.零件 || []).filter(p => p.k === 'rite').length;
  return R.零件推进剂加成;
}

/** 抽一个零件（走种子）：`种子 + 层×211 + 格号×23 + 场次×29`。
 *  照战棋 `30:79,84` 的 `pick(Object.keys(PARTS))`，但**只抽真的能用的**（理财类不进池）。 */
function 抽零件(R, 格号值) {
  const r = R || (肉鸽 && 肉鸽.RUN);
  if (!r) return null;
  const 池 = 零件池();
  if (!池.length) return null;
  const rng = mulberry32(((r.种子 || 0) + (r.层 || 1) * 211 + (格号值 || r.当前 || 0) * 23 + (r.场次 || 0) * 29) >>> 0);
  return 池[Math.min(池.length - 1, Math.floor(rng() * 池.length))];
}

/** 战利品（战后）：照战棋 `31-战斗.js:293`「精英必给，其他 35% 概率给」的**同一个公式**
 *  （原文：`if (kind === 'elite' || Math.random() < .35) await givePart(...)`）。
 *  本仓库把它落在「奖励档」上：精英 / Boss 必给（战棋的 `elite`；Boss 是终点那一场，战棋走 `final` 分支），
 *  普通 / 追击按 **35%**。界面 / `90-肉鸽.js` 在战斗胜利之后调一次，返回发出去的零件（没发就是 null）。 */
const 战利品概率 = 0.35;                  // 31-战斗.js:293
function 战斗发零件(奖励档, 来源) {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R) return null;
  const 必给 = 奖励档 === '精英' || 奖励档 === 'Boss';
  if (!必给 && !(mulberry32(((R.种子 || 0) + (R.层 || 1) * 409 + (R.场次 || 0) * 61 + 7) >>> 0)() < 战利品概率)) return null;
  const k = 抽零件(R, R.当前);
  if (!k) return null;
  return 拿零件(k, 来源 || (必给 ? '精英战战利品' : '战利品'));
}

/* ---------------------------------------------------------------------------
 * 零件的目标格（照战棋 30-移动与节点.js:6-16 的 partTargets）
 * ------------------------------------------------------------------------- */

/** 非战斗节点：飞过去不会开打（战棋 `30:6-16` 的 fly 目标就是这么挑的）。 */
const 非战斗节点 = new Set(['空', '黑市', '休整', '招募站', '事件', '瞭望站', '遗迹', '隧道']);

/** 这一格「已知」吗（已走过 / 被揭开）。飞过去只看已知格，`jet` / `bagua` 例外（任意格）。 */
function 格已知(R, k) {
  return (R.已走过 || []).includes(k) || (R.已揭开 || []).includes(k);
}

/** 本层的黑市格号（坎诺特的触须用；战棋 `30:13` 的 `move:'shop'` 直接前往本层黑市）。 */
function 黑市格(R) {
  const 格 = (R && R.地图 && R.地图.格) || {};
  const k = Object.keys(格).map(Number).find(x => 格[x].类型 === '黑市');
  return k == null ? null : k;
}

/** 用某一件零件**能点哪些格**（返回数组；界面靠它高亮，测试靠它验规则）。
 *  - `line2` / `line3` / `step`：按四邻接 BFS **最短路径的格数**算（我们确实有网格，所以按格数照抄）；
 *  - `ring`：四邻接 1 格；
 *  - `ringline`：四邻接 1 格 或 2 格（`limb` + `wheel` 两条一起给）；
 *  - `any`：这一层任意存在的格（含迷雾）；**排除当前格**（原地传送没有意义）；
 *  - `fly`：已知的非战斗格（见文件头「换义」：不抄「3 格内」，不抄「+3 经验」）；
 *  - `shop`：本层的黑市格。 */
function 零件目标(p) {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R || !R.地图 || !p) return [];
  const P = 零件表[p.k];
  if (!P || !P.用) return [];
  const 距离 = 全距离(R);
  const 格们 = Object.keys(R.地图.格).map(Number);
  switch (P.移动) {
    case 'ring':   return 格们.filter(k => k !== R.当前 && 格没走过(R, k) && 距离.get(k) === 1);
    case 'ringline': return 格们.filter(k => k !== R.当前 && 格没走过(R, k) && (距离.get(k) === 1 || 距离.get(k) === 2));
    case 'line2':  return 格们.filter(k => 格没走过(R, k) && 距离.get(k) === 2);
    case 'line3':  return 格们.filter(k => 格没走过(R, k) && (距离.get(k) === 2 || 距离.get(k) === 3));
    case 'step':   return 格们.filter(k => 格没走过(R, k) && (距离.get(k) === 1 || 距离.get(k) === 2));
    case 'any':    return 格们.filter(k => k !== R.当前 && 格没走过(R, k));
    case 'fly':    return 格们.filter(k => k !== R.当前 && 格没走过(R, k) && 非战斗节点.has(R.地图.格[k].类型) && 格已知(R, k));
    case 'shop': { const s = 黑市格(R); return s != null ? [s] : []; }
    default: return [];
  }
}

/** 用掉这一件零件的**一次**（战棋 `30:6-16`：扣 uses、用光就 splice、不花推进剂）。
 *  返回 `{ok, 到, 类型, 距离, 效果}`；用不了就 `{ok:false, why}`（界面写进提示）。 */
function 用零件(i, k) {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R) return { ok: false, why: '没有进行中的局' };
  const p = (R.零件 || [])[i];
  if (!p) return { ok: false, why: '没有这件零件' };
  const P = 零件表[p.k];
  if (!P || !P.用) return { ok: false, why: `【${P ? P.名 : p.k}】这一版用不了（${(P && P.用不了) || '没有实现' }）` };
  k = Number(k);
  const 距离 = 全距离(R);
  const 目标 = 零件目标(p);
  if (!目标.includes(k)) return { ok: false, why: `【${P.名}】到不了那一格（这一格不在它的目标里）` };
  const d = 距离.get(k);
  /* 扣次数（战棋 30:10：`p.uses--; if (p.uses <= 0) RUN.parts.splice(...)`） */
  if (p.uses != null) { p.uses--; if (p.uses <= 0) R.零件.splice(i, 1); }
  const 旧 = R.当前;
  R.当前 = k;
  if (!R.已走过.includes(k)) R.已走过.push(k);
  /* `shop` / `any` 会揭开落点（战棋 30:14：`if (P.move === 'shop' || P.move === 'any') RUN.revealed.add(k)`） */
  if (P.移动 === 'shop' || P.移动 === 'any') { R.已揭开 = R.已揭开 || []; if (!R.已揭开.includes(k)) R.已揭开.push(k); }
  const 格 = R.地图.格[k];
  肉鸽.记(`使用零件【${P.名}】：(${格列(旧) + 1}, ${格行(旧) + 1}) → (${格.列 + 1}, ${格.行 + 1})` +
    `（${(节点类型表[格.类型] || {}).名 || 格.类型}${d != null ? `，${d} 步` : ''}），不消耗推进剂`);
  肉鸽.存档();
  return { ok: true, 到: k, 类型: 格.类型, 距离: d, 零件: P.名, 从: 旧 };
}

/* ---------------------------------------------------------------------------
 * 黑市：零件那一段（战棋 30-移动与节点.js:96-113）
 * ------------------------------------------------------------------------- */

/** 黑市零件价格（战棋 `30:96`：`Math.round(PARTS[k].price * (hasRelic('f1') ? .7 : 1))`）。
 *  ★ 本仓库的黑市**现在只卖藏品**（要不要卖零件是待拍板项）——这个函数照抄好、接口留着，
 *    界面上一行都没接（写进任务板）。 */
function 零件价(k) {
  const P = 零件表[k];
  if (!P) return 0;
  const 打折 = ((肉鸽 && 肉鸽.RUN && 肉鸽.RUN.藏品) || []).includes('f1') ? 0.7 : 1;
  return Math.round(P.价 * 打折);
}

/** 卖零件（战棋 `30:117-120` 的 runSellPart）：自然物按估价、其他一律 2 源碳。
 *  ★ 同样**没有界面入口**（黑市不卖零件、也不收零件），留着给以后拍板用。 */
function 卖零件(i) {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R) return null;
  const p = (R.零件 || [])[i];
  if (!p) return null;
  const P = 零件表[p.k];
  const 价 = P.类 === '自然物' ? p.value : 2;      // 30:101,119
  R.源碳 += 价;
  R.零件.splice(i, 1);
  if (p.k === 'rite') 重算推进剂加成();
  肉鸽.记(`卖出零件【${P.名}】+${价} 源碳结晶`);
  肉鸽.存档();
  return { ok: true, 价, 名: P.名 };
}

/** 手上零件的一行字（名字 + 剩几次 / 估价 + 一句效果）。 */
function 零件行文字(p, i) {
  const P = 零件表[p.k] || { 名: p.k, 类: '—', 说明: '', 效果: '' };
  const 数 = p.uses != null ? ` · 剩 ${p.uses} 次` : (p.value != null ? ` · 估价 ${p.value}` : '');
  return `#${i} ${P.名}（${P.类}${数}）${P.用 ? '' : '【这一版用不了】'}`;

  /* ---------------- 晋升（10 → 20 → 30） ----------------

     每一行**把升完之后的属性变化列出来**（HP / 装甲 / 防御 / 机动 / 速度），点一下就升。 */

    const 清单 = 肉鸽.晋升清单();
    const 行 = 清单.map(x => {

          `　防御 ${x.属性.前.defense} → <b>${x.属性.后.defense}</b>　机动 ${x.属性.前.mov} → <b>${x.属性.后.mov}</b>` +

      const 动 = ` data-act="晋升:${x.键}"`;
      return `<div class="rv-row"><span class="rv-tier ${x.档}">${x.档名}</span>

    }).join('') || '<p class="small">名册是空的。</p>';
    const 次序 = 清单.filter(x => x.到).sort((a, b) => a.价 - b.价);

  零件屏() {

/** 大地图上的「队伍」卡片：每台机体的**当前等级与属性**（晋升之后这里会真的变）。

function 队伍卡片Html() {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R) return '';
  const 们 = 重算名册属性() || [];
  const 行 = 们.map(x => {
    const t = tplOf(x.键) || {};
    const 出击 = (R.出击 || []).includes(x.键);

    const 价 = 到 ? 晋升要多少(x.键, 到, R) : 0;

      <span class="nm"><b>${t.pilot || x.键}</b><small>${x.键} · ${(t.tags || {}).战斗分类 || '—'} · ${出击 ? '出击名单' : '待命'}</small>
        <br><small style="margin-left:0">Lv${x.等级}　HP ${x.后.maxHp}　装甲 ${x.后.armor}　防御 ${x.后.defense}　机动 ${x.后.mov}　速度 ${x.后.速度}</small></span>
      ${到 ? `<button class="rv-btn" data-act="晋升:${x.键}"${R.希望 >= 价 ? '' : ' disabled'}>→Lv${到}（${价}）</button>` : '<small>Lv30</small>'}</div>`;
  }).join('') || '<p class="small">名册是空的。</p>';
  return `<div class="rv-card"><h3>队伍（${R.队伍.length} / ${肉鸽数值.队伍上限}）<span class="small">点右边的按钮直接晋升（花希望）</span></h3>${行}

      精锐 3 / 4、骨干 2 / 3、普通 1 / 2 希望${R.下次晋升减价 ? '（休整过：下次晋升 −1 希望）' : ''}。</p></div>`;

/* 图例（只列这一层地图上真的会出现的类型） */
function 图例Html() {

    const x = 节点类型表[t] || { 名: t, 图标: '?', 色: '#8a99ab' };

/* 节点弹窗（隧道 / 瞭望站 / 遗迹 / 休整）。
   ★ **同步版**：给了 `回调` 就直接 `回调(答案)` 并返回它的结果（界面里那些动作都是同步的，
   测试「点一下 → 结算 → 回大地图」在同一个调用里就能看到结果）；没给 `回调` 就返回答案本身。
   为什么要走这个钩子：`90-肉鸽.js` 排在 `80-界面.js` 前面，那里拿不到 `界面.对话框`。 */
function 肉鸽弹窗(标题, 文本, 选项, 回调) {
  const 表 = 选项.map(o => ({ 值: o[0], 名: o[1] }));
  const 答案 = (typeof 界面 !== 'undefined' && 界面 && typeof 界面.对话框 === 'function')
    ? 界面.对话框(标题, 文本, 表)
    : (表.length ? 表[0].值 : null);
  if (typeof 回调 !== 'function') return 答案;
  if (答案 && typeof 答案.then === 'function') return 答案.then(回调);   // 真弹窗（异步）时的兜底
  return 回调(答案);
}

/* ---------------------------------------------------------------------------

 *   · f2 战地回收协议（补给箱）、f3 源碳反应炉（源碳进战斗）、f4 编制扩充令（出击上限 +1）

 *   免费晋升 = **把这笔希望省下来**。所以我们的「经济藏品」给的是**省希望**，
 *   不是「+希望」；调研结论与量级建议写在 `协作/任务板.md` 的「经济」段。

/** 名册里一台机体（`{键, 等级}`）的职业（战棋 `tplOf(x.mech).tags.战斗分类`）。 */
function 名册职业(键) { return 战斗分类(makeUnit(键, 'ally', 0, 10)); }

/** 找这个职业里**等级最高、还没到 Lv30** 的那一台（照战棋 `23b:124` 的 `relicPromo`）。 */
function 该职业可晋升(R, 职业) {
  return (R.队伍 || [])
    .filter(m => 名册职业(m.键) === 职业 && 晋升目标(m.等级))
    .sort((a, b) => b.等级 - a.等级)[0] || null;
}

/** 免费晋升一台（**不花希望**）：等级 +10、写日志、把「本该花的希望」记进希望来源账的「藏品省」。
 *  返回 `{键, 名, 从, 到, 省}`。 */
function 白升一台(R, m, 称号) {
  const 到 = 晋升目标(m.等级), 从 = m.等级;
  const 省 = 晋升要多少(m.键, 到, R);            // 22-输入.js:446 的价格（这一笔不用付）
  m.等级 = 到;
  if (typeof 记希望来源 === 'function') 记希望来源(R, '藏品省', 省);
  if (typeof 肉鸽 !== 'undefined' && 肉鸽.记) {
    肉鸽.记(`${称号}：${allyName(m.键)} 免费晋升到 Lv${到}（省下 ${省} 希望，照战棋 23b:139）`);
  }
  return { 键: m.键, 名: allyName(m.键), 从, 到, 省 };
}

/** 拿到一件教范藏品时立刻用掉（照战棋 `23b:123-134` 的 `relicPromo`）：
 *  队里没有这个职业（或者都 Lv30 了）→ 记进 `RUN.待晋升`，招募到人以后自动用（`用掉待晋升`）。
 *  返回 `{键, 名, 从, 到, 省}` 或 `null`。 */
function 藏品免费晋升(件, R) {
  const 跑 = R || (typeof 肉鸽 !== 'undefined' && 肉鸽 && 肉鸽.RUN);
  const 职业 = 件 && 件.数值 && 件.数值.晋升职业;
  if (!跑 || !职业) return null;
  const m = 该职业可晋升(跑, 职业);
  if (!m) {
    跑.待晋升 = 跑.待晋升 || [];
    if (!跑.待晋升.includes(职业)) 跑.待晋升.push(职业);      // 战棋 RUN.pendingPromo（23b:125）
    if (typeof 肉鸽 !== 'undefined' && 肉鸽.记) 肉鸽.记(`${件.名}：队里没有能晋升的${职业}，招到人后自动用（照战棋 23b:125）`);
    return null;
  }
  return 白升一台(跑, m, 件.名);
}

/** 招募之后把还没用掉的教范用掉（照战棋 `23b:130-134` 的 `relicPendingPromo`）。返回用掉的那几台。 */
function 用掉待晋升(R) {
  const 跑 = R || (typeof 肉鸽 !== 'undefined' && 肉鸽 && 肉鸽.RUN);
  if (!跑 || !(跑.待晋升 || []).length) return [];
  const 留着 = [], 成了 = [];
  for (const 职业 of 跑.待晋升) {
    const m = 该职业可晋升(跑, 职业);
    if (!m) { 留着.push(职业); continue; }
    成了.push(白升一台(跑, m, `${职业}教范`));
  }
  跑.待晋升 = 留着;
  return 成了;
}

/* ---------------------------------------------------------------------------
 * 开战应用（照战棋 23b-藏品.js:74-107 的三段：cls / mods+stat / stack，外加 foe / foeStack）
 * ------------------------------------------------------------------------- */

/** 叠层：按「出击队伍里这些职业有几台」算层数（战棋 23b:77,91） */
function 藏品层数(件, 出击职业) {
  const 层 = 件.数值 && (件.数值.stack || 件.数值.foeStack);
  const 按 = (层 && 层.by) || [];
  return 出击职业.filter(c => 按.includes(c)).length;
}
/** 这一件对某个职业的单体效果（mods / stat / stack） */
function 藏品单体效果(件, 职业, 出击职业) {
  const e = 件.数值 || {};
  const 我的 = !e.职业 || e.职业.includes(职业);
  const m = {};
  if (e.mods && 我的) for (const [k, v] of Object.entries(e.mods)) m[k] = (m[k] || 0) + v;
  if (e.stack && (!e.stack.to || e.stack.to.includes(职业))) {
    const 层 = Math.min(e.stack.max, 藏品层数(件, 出击职业));
    for (const [k, v] of Object.entries(e.stack.per)) m[k] = (m[k] || 0) + v * 层;
  }
  return { 我的, m, stat: 我的 ? (e.stat || null) : null };
}

/** 开战时给**我方**出击机体算藏品加成（战棋 relicApplyAllies，23b:74-95）
 *  分三层落下去：
 *    1. u.buffs 里追加两条 `src:'藏品'` 的常驻增益（mods）—— hit / eva / crit / armorPct / dmg / red
 *       都走 buffSum，公式里本来就读它，所以**没有藏品的战斗一个字节都不变**；
 *    2. stat.hpPct 直接改 maxHp / hp（照 23b:86）；
 *    3. 记录一份 `u.藏品加成` 给界面和测试看（不参与计算）。
 *  返回：受影响的单位数。 */
function 应用藏品我方(我方, 藏品们) {
  const 件们 = (藏品们 || []).map(id => 藏品表[id]).filter(Boolean);
  if (!件们.length || !我方 || !我方.length) return 0;
  const 出击职业 = 我方.map(u => 战斗分类(u));
  for (const u of 我方) {
    const 职 = 战斗分类(u);
    const 合计 = {};
    for (const 件 of 件们) {
      const { m, stat } = 藏品单体效果(件, 职, 出击职业);
      for (const [k, v] of Object.entries(m)) 合计[k] = (合计[k] || 0) + v;
      if (stat && stat.hpPct) {
        const k = 1 + stat.hpPct / 100;
        u.maxHp = Math.max(1, Math.round(u.maxHp * k));
        u.hp = Math.max(1, Math.round(u.hp * k));
      }
    }
    /* 整场加成（战棋 relicBattleStart，23b:171-181）：混编 / 孤狼。
       战棋把这两条也算进 relicMods，我们一样合进「藏品」这条 buff 里。 */
    const n = 我方.length, 职业数 = new Set(出击职业).size;
    if (件们.some(x => x.数值 && x.数值.特殊 === 'mixed')) 合计.dmg = (合计.dmg || 0) + 8 * 职业数;
    if (件们.some(x => x.数值 && x.数值.特殊 === 'lonewolf')) {
      if (n <= 2) { 合计.dmg = (合计.dmg || 0) + 50; 合计.armorPct = (合计.armorPct || 0) + 30; }
      else if (n >= 4) 合计.dmg = (合计.dmg || 0) - 15;
    }
    if (!Object.keys(合计).length) continue;
    u.buffs = (u.buffs || []).filter(b => b.src !== '藏品');
    u.buffs.push(Object.assign({ src: '藏品', 剩余: 999 }, 合计));
    u.藏品加成 = 合计;
  }
  return 我方.filter(u => u.藏品加成).length;
}

/** 开战时给**敌方**单位算藏品减益（战棋 relicApplyFoe，23b:97-107）
 *  foe 直接加；foeStack 按我方出击职业人数算层数。
 *  落在 e.buffs 的 `src:'藏品'` 上：hit 由命中公式读，armorPct 由 effArmor 读。
 *  返回：受影响的单位数。 */
function 应用藏品敌方(敌方, 我方, 藏品们) {
  const 件们 = (藏品们 || []).map(id => 藏品表[id]).filter(Boolean);
  if (!件们.length || !敌方 || !敌方.length) return 0;
  const 出击职业 = (我方 || []).map(u => 战斗分类(u));
  const 合计 = {};
  for (const 件 of 件们) {
    const e = 件.数值 || {};
    if (e.foe) for (const [k, v] of Object.entries(e.foe)) 合计[k] = (合计[k] || 0) + v;
    if (e.foeStack) {
      const 层 = Math.min(e.foeStack.max, 藏品层数(件, 出击职业));
      for (const [k, v] of Object.entries(e.foeStack.per)) 合计[k] = (合计[k] || 0) + v * 层;
    }
  }
  if (!Object.keys(合计).length) return 0;
  for (const e of 敌方) {
    e.buffs = (e.buffs || []).filter(b => b.src !== '藏品');
    e.buffs.push(Object.assign({ src: '藏品', 剩余: 999 }, 合计));
    e.藏品加成 = 合计;
  }
  return 敌方.length;
}

/** 开战时一次全做完（`60-战斗.js` 的 `开局()` 里调一次）。
 *  **藏品只从 `肉鸽.RUN.藏品` 来**：`RUN` 为空（菜单里的固定测试战斗、simulate 的单测）
 *  时这里直接返回，所以那些战斗的公式结果与加藏品之前逐字相同。 */
function 藏品开战(我方, 敌方) {
  const R = (typeof 肉鸽 !== 'undefined' && 肉鸽 && 肉鸽.RUN) || null;
  const 藏品们 = (R && R.藏品) || [];
  if (!藏品们.length) return { 我方: 0, 敌方: 0, 件数: 0 };
  return {
    我方: 应用藏品我方(我方, 藏品们),
    敌方: 应用藏品敌方(敌方, 我方, 藏品们),
    件数: 藏品们.length,
  };
}

/* ---------------------------------------------------------------------------
 * 获取：精英 / Boss 战斗胜利 → 发 1 件（作者 2026-10-10 的任务书写法）
 * ------------------------------------------------------------------------- */

/** 能进随机池的藏品：只抽「抽:true」的（真的会生效的那些）。
 *  ★ 抽不到 s2 / n2 这两件「只有一半能用」的：它们的射程那半边在战场上没法验证。
 *  ★ 2026-10-11 起 **t1–t6（免费晋升）与 f1（黑市 −30%）也进池**（它们真的生效了）→ **35 件**；
 *    2026-10-11 又加 **G 组 8 件新造**（希望 / 出击上限，作者拍板）→ **43 件**。 */
const 藏品可抽池 = () => Object.keys(藏品表).filter(id => 藏品表[id].抽);

/** 这一局还没拿到的藏品 id（去重规则：**不重复**——已有的直接从池子里去掉；见任务板）。 */
const 藏品候选 = 已有 => 藏品可抽池().filter(id => !(已有 || []).includes(id));

/** 抽一件：**必须**走 `ctx.rng` / 这一局的种子（同种子同结果，方案 6.1 的硬规矩）。
 *  rng 省略时按「种子 + 层 + 场次 + 节点序号」自己造一个（和 `抽当前编成` 同一个套路）。 */
function 抽藏品(run, rng, 节点序) {
  const R = run || (typeof 肉鸽 !== 'undefined' && 肉鸽 && 肉鸽.RUN);
  const 池 = 藏品候选(R && R.藏品);
  if (!池.length) return null;
  const r = rng || mulberry32(((R.种子 || 0) + (R.层 || 1) * 613 + (R.场次 || 0) * 37 + (节点序 || 0) * 11) >>> 0);
  return 池[Math.min(池.length - 1, Math.floor(r() * 池.length))];
}

/** 拿到一件藏品（战棋 gainRelicRun，23b:135 的简化版）。
 *  - 已经在手里的：**不重复发**（不叠加、也不转源碳，直接返回 null；日志由调用方决定写不写）；
 *  - 整池拿完了：转成源碳（避免「发了但什么都没有」）。
 *  成功时写一行 RUN 日志（界面上是大图屏的「日志」那一行）。 */
function 拿藏品(id, 来源) {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R) return null;
  const 件 = 藏品表[id];
  if (!件) return null;
  R.藏品 = R.藏品 || [];
  if (R.藏品.includes(id)) return null;                       // 去重：不重复发
  R.藏品.push(id);
  肉鸽.记(`获得藏品【${件.名}】：${件.说明}（${来源 || '战斗胜利'}）`);
  /* ★ 2026-10-11 新造的「希望 / 出击上限」类藏品：**拿到就永久生效**
   *   · 希望 +N     → 立刻进 `RUN.希望`，并记进希望来源账的「藏品」那一格（作者要求「希望从哪来」看得见）；
   *   · 出击上限 ±N → **不需要额外字段**：`肉鸽.出击上限()` 就是从 `RUN.藏品` 现算的
   *                   （`05-阵型.js` 的 `藏品部署位加成()`），所以「进 RUN.藏品」本身就已经生效，
   *                   这里只多写一行日志，让玩家看得出「里面有 N 件编制类、现在几台、封顶几台」。 */
  if (件.数值 && Number.isFinite(Number(件.数值.希望)) && Number(件.数值.希望)) {
    const 加 = Number(件.数值.希望);
    R.希望 = (Number(R.希望) || 0) + 加;
    记希望来源(R, '藏品', 加);
    肉鸽.记(`藏品【${件.名}】：希望 +${加}（立刻到账，现在 ${R.希望}）`);
  }
  if (件.数值 && Number.isFinite(Number(件.数值.出击上限)) && Number(件.数值.出击上限)) {
    const 加 = Number(件.数值.出击上限);
    肉鸽.记(`藏品【${件.名}】：出击上限 ${加 > 0 ? '+' : ''}${加} 台（现在 ${出击上限(R.等级, 藏品部署位加成(R))} 台，` +
      `编制类共 ${藏品编制件数(R)} 件，绝对封顶 ${绝对顶} 台）`);
  }
  /* 教范（免费晋升）：拿到就立刻用（照战棋 23b:139 的 `if (r.special === 'promo') relicPromo(r.promo)`） */
  if (件.数值 && 件.数值.特殊 === 'promo') {
    件.白升 = 藏品免费晋升(件, R);
    肉鸽.存档();
  }
  return 件;
}

/** 这一局手里**编制类**（带 `数值.出击上限`，含负面那件）的件数 ——
 *  界面 / 日志里的「里面有 N 件编制类」用它。 */
const 藏品编制件数 = run => (((run || (肉鸽 && 肉鸽.RUN)) || {}).藏品 || [])
  .map(id => 藏品表[id])
  .filter(件 => 件 && 件.数值 && Number.isFinite(Number(件.数值.出击上限)) && Number(件.数值.出击上限)).length;

/** 「每进一层 +N 希望」类藏品（负面换正面那一件：`d3 战线收缩令`，思路照研究文档 3.4 的《酒神的印记》）：
 *  **每进入新的一层结算一次**（`90-肉鸽.js` 的 `换层()` 里调），进希望来源账的「藏品」那一格，并写一行日志。
 *  返回这一次给了几点（没有这类藏品 → 0）。 */
function 藏品每层希望(R, 层) {
  const 跑 = R || (typeof 肉鸽 !== 'undefined' && 肉鸽 && 肉鸽.RUN) || null;
  if (!跑) return 0;
  const 件们 = (跑.藏品 || []).map(id => 藏品表[id])
    .filter(件 => 件 && 件.数值 && Number.isFinite(Number(件.数值.每层希望)) && Number(件.数值.每层希望));
  if (!件们.length) return 0;
  let n = 0;
  for (const 件 of 件们) n += Number(件.数值.每层希望);
  if (!n) return 0;
  跑.希望 = (Number(跑.希望) || 0) + n;
  记希望来源(跑, '藏品', n);
  if (typeof 肉鸽 !== 'undefined' && 肉鸽.记) {
    肉鸽.记(`藏品【${件们.map(x => x.名).join('、')}】：进入第 ${层} 层，希望 +${n}（现在 ${跑.希望}）`);
  }
  return n;
}

/** 一场战斗打赢之后调用（`90-肉鸽.js` 的 `战斗结束` 里）：精英 / Boss 才发。
 *  重复拿不到东西时给源碳兜底（`藏品转源碳`），并在日志里写出来。 */
const 藏品转源碳 = 5;
function 战斗胜利发藏品(类型, 节点) {
  const R = 肉鸽 && 肉鸽.RUN;
  if (!R) return null;
  if (类型 !== '精英' && 类型 !== 'Boss') return null;
  const 序 = 节点 && 节点.序 != null ? 节点.序 : 0;
  const id = 抽藏品(R, null, 序);
  if (id) {
    const 件 = 拿藏品(id, 类型 === 'Boss' ? 'Boss 战胜利' : '精英战胜利');
    if (件) return { id, 名: 件.名, 说明: 件.说明 };
  }
  /* 池子抽干了（或者算出来的那件正好已经在手上）：按「转成源碳」处理，日志里写清楚 */
  R.源碳 += 藏品转源碳;
  肉鸽.记(`${类型}战胜利：藏品已经拿全了，转成源碳结晶 +${藏品转源碳}`);
  return { id: null, 源碳: 藏品转源碳 };
}

/** 界面上显示用：这一局已经拿到的藏品（名字 + 一句效果 + 稀有度） */
const 藏品清单 = run => ((run || (肉鸽 && 肉鸽.RUN) || {}).藏品 || [])
  .map(id => Object.assign({ id }, 藏品表[id] || { 名: id, 说明: '', 稀有: '—' }));

/** 大地图上的藏品卡片（沿用现有样式，不引新框架）。
 *  ★ 2026-10-11：标题上多写一句「其中 N 件编制类（出击上限 ±N 台）」——
 *    作者要求「编队屏 / 大地图要能看出里面有 N 件编制类」。 */
function 藏品卡片Html() {
  const 们 = 藏品清单();
  const 编制 = 藏品编制件数();
  const 部署加 = 藏品部署位加成();
  const 编制句 = `其中 ${编制} 件编制类（出击上限 ${部署加 > 0 ? '+' : ''}${部署加} 台）`;
  if (!们.length) {
    return `<div class="rv-card"><h3>藏品（0）</h3><p class="small">还没有。精英战 / Boss 战胜利各发 1 件` +
      `（战棋照抄的 50 件 + 2026-10-11 新造的 8 件希望 / 编制类）。</p></div>`;
  }
  const 行 = 们.map(x => `<div class="rv-row" title="${x.说明}">
    <span class="nm"><b>${x.名}</b><small> · ${x.稀有}</small><br><small style="margin-left:0">${x.说明}</small></span></div>`).join('');
  return `<div class="rv-card"><h3>藏品（${们.length}）<span class="small">效果在开战时生效 · ${编制句}</span></h3>${行}</div>`;
}
/* ============================================================================
 * 播放引擎（方案 8.1：动画只影响播放，不影响结果）
 * ----------------------------------------------------------------------------
 * 做法：先用 `simulate()` 把整场**一次算完**（带种子、可复现），拿到的逐条记录
 * 再按时间"放"出来——攻击者前冲、受击闪白、飘伤害数字。
 * 二倍速 / 跳过动画只改播放速度，**不碰战斗结果**，所以同一种子无论怎么看结果一样。
 *
 * 记录里带的字段（60-战斗.js 写的）：
 *   类型：开始 / 回合 / 攻击 / 修理 / 增益 / 再动 / 压制射击 / 残月余响 / 跳过 / 结束
 *   单位 / 位、目标 / 目标位、伤害、目标剩余HP、回复、命中、暴击、段数
 * ========================================================================== */

const 每步毫秒 = 500;        // 方案 8.1：「每次行动 0.5 秒左右」
const 快进毫秒 = 120;        // 回合标记 / 开始 / 结束这类没有动作的记录

const 播放 = {
  战报: null,
  位置: 0,
  单位: {},          // "side:slot" → {hp, maxHp, shieldHp, 死}
  当前: null,
  倍速: 1,
  暂停中: false,
  快进: false,
  手动: false,       // 测试用：true 时不排计时器，由测试自己调 tick()
  计时: null,
  钩子: { 每步: null, 结束: null },

  载入(战报) {
    this.战报 = 战报;
    this.位置 = 0;
    this.倍速 = 1;
    this.暂停中 = false;
    this.快进 = false;
    this.当前 = null;
    this.单位 = {};
    /* 血条从**这一回合开始时**的状态开始走（打一回合之后传进来的快照就是这个状态） */
    for (const u of 战报.我方.concat(战报.敌方)) {
      const 满 = u.maxHp, 血 = u.hp != null ? u.hp : 满;
      this.单位[u.side + ':' + u.slot] = { hp: 血, maxHp: 满, shieldHp: u.shieldHp != null ? u.shieldHp : (u.shield || 0), 死: 血 <= 0 };
    }
    return this;
  },

  事件() { return this.战报 ? this.战报.记录 : []; },
  剩余() { return this.事件().length - this.位置; },
  在放() { return !!this.战报 && this.位置 < this.事件().length; },

  /** 开始播放。快进（跳过动画）时直接把剩下的记录全部应用掉。 */
  开始() {
    if (this.快进) return this.跳到结尾();
    this.暂停中 = false;
    this.排一次();
    return this;
  },
  排一次() {
    if (this.手动 || this.暂停中 || !this.在放()) return;
    if (this.计时) clearTimeout(this.计时);
    const ev = this.事件()[this.位置];
    this.计时 = setTimeout(() => this.tick(), this.时长(ev) / this.倍速);
  },
  时长(ev) {
    const t = ev && ev.类型;
    return (t === '回合' || t === '开始' || t === '结束') ? 快进毫秒 : 每步毫秒;
  },

  /** 应用**一条**记录（浏览器里由计时器调，测试里手动调）。 */
  tick() {
    if (this.计时) { clearTimeout(this.计时); this.计时 = null; }
    if (this.暂停中) return this;
    if (!this.在放()) { this.收尾(); return this; }
    const ev = this.事件()[this.位置];
    this.当前 = ev;
    this.应用(ev);
    this.位置++;
    if (this.钩子.每步) this.钩子.每步(ev, this);
    if (this.在放()) this.排一次(); else this.收尾();
    return this;
  },

  /** 把一条记录的效果落到 this.单位 上（只为了显示血条 / 闪白 / 飘字）。 */
  应用(ev) {
    if (!ev || ev.目标方 == null || ev.目标位 == null) return;
    const 受 = this.单位[ev.目标方 + ':' + ev.目标位];
    if (!受) return;
    if (ev.目标剩余HP != null) { 受.hp = ev.目标剩余HP; 受.死 = 受.hp <= 0; }
    else if (ev.回复 != null) 受.hp = Math.min(受.maxHp, 受.hp + ev.回复);
  },

  暂停() { this.暂停中 = true; if (this.计时) { clearTimeout(this.计时); this.计时 = null; } return this; },
  继续() { if (this.暂停中) { this.暂停中 = false; this.排一次(); } return this; },
  切倍速() { this.倍速 = this.倍速 === 1 ? 2 : 1; return this; },
  设倍速(n) { this.倍速 = n; return this; },

  /** 跳过动画：把剩下的记录全部应用完，直接到结算（结果不变）。 */
  跳到结尾() {
    if (!this.战报) return this;
    while (this.在放()) { const ev = this.事件()[this.位置]; this.当前 = ev; this.应用(ev); this.位置++; }
    this.当前 = null;
    if (this.钩子.每步) this.钩子.每步(null, this);
    this.收尾();
    return this;
  },

  收尾() {
    if (this.计时) { clearTimeout(this.计时); this.计时 = null; }
    this.暂停中 = false;
    if (this.钩子.结束) { const f = this.钩子.结束; this.钩子.结束 = null; f(this); }
    return this;
  },
};
/* ============================================================================
 * 界面（方案 8.1）：菜单 → 编队 → 战斗 → 结算
 * ----------------------------------------------------------------------------
 * M2：编队 + 战斗画面 + 播放控制。
 * M3：**指令阶段**（每台机体下指令、大招开关、看敌人意图）+ 一回合一个回合地打。
 *
 * 战斗屏的阶段：
 *   指令阶段：点我方卡片 → 在右边指令面板上下指令（进攻 / 集火 / 守护 / 防御 / 换位 + 大招开关）；
 *             敌人卡片上显示**意图**（它这一回合打算打谁、用什么、预计多少伤害，方案 5.3）。
 *   播放阶段：点「开打」跑这一回合，逐条放出来（攻击者冲一下、受击闪白、飘字）。
 *   回合播完：没分出胜负就回到指令阶段（指令会留着，方案 3.2）；分出胜负就去结算。
 *
 * 机体图标是 M5，现在用势力配色的方块 + 短名。
 * 事件都用 #screen / #ctrl 上的事件委托（data-act="动作:参数"），每个动作也都能被测试直接调用。
 * ========================================================================== */

/* 势力配色：战棋里那七套（原来在 art/mech-icons.js 的 FACTION_PAL 和规则面板的图例里） */
const FACTION_COL = {
  影世界: '#8a6bd8', 月球王国: '#9fb7d8', 天人: '#4fc3a1', 卫星国防军: '#e88fb4',
  流星小队: '#f2c14e', ATX: '#e8e6e1', 秘银: '#7d9a58',
};
const 势力色 = 键 => {
  const t = tplOf(键);
  return (t && FACTION_COL[t.tags.势力]) || '#8a99ab';
};
const 敌方色 = '#d9564b';

const 界面 = {
  屏: '菜单',                     // 菜单 / 编队 / 战斗 / 结算 / 分队 / 大地图 / 招募 / 奇遇 / 黑市 / 肉鸽结算
  阶段: '指令',                   // 战斗屏的阶段：指令 / 播放 / 结算
  编队: { 等级: 10, 出击: [], 选中: null, 编成序号: 0, 势力: '全部' },
  ctx: null,                      // 这一场战斗的引擎状态（开局() 给的）
  指令: {},                       // 位 → {类型, 目标位, 保留大招}（下过就一直留着）
  选中位: null,
  选目标: null,                   // '集火' / '守护'：正在等玩家点目标
  提示: '',
  显示单位: null,                 // 播放阶段用的「这一回合开始时」的快照
  战报: null,                     // 结算用的小结
  肉鸽战斗: null,                 // 正在打的这一场是哪个肉鸽节点 {格类型, 类型, 条目}
  肉鸽战斗类型: '作战',           // 这一场的节点类型（打这一场() 从它取，出口守军 / 追击战会改写）
  肉鸽编队模式: false,            // 编队屏是「肉鸽里出战前编队」还是沙盒练习
  种子: null,
  手动播放: false,                // 测试用：播放引擎不排计时器，自己 tick
  跳过动画总是: false,
  预览缓存: {},
  对话框: null,                   // 测试用：`对话框(标题, 文本, 选项)` 给一个返回值就顶替弹窗（见 肉鸽弹窗）

  /* ---------------- 小工具 ---------------- */
  位名,
  单位模板: (键, 方) => 方 === 'ally' ? tplOf(键) : ENEMY_T[键],
  单位名: (键, 方) => { const t = 界面.单位模板(键, 方); return t ? (方 === 'ally' ? t.pilot : t.mech) : 键; },
  单位短名: (键, 方) => { const t = 界面.单位模板(键, 方); return t ? (t.short || t.mech || 键) : 键; },

  /** 预览一台机体在某等级下的关键数字（速度、HP、大招）——编队界面要用。 */
  预览(键, 等级) {
    const k = 键 + '@' + 等级;
    if (!this.预览缓存[k]) {
      const u = makeUnit(键, 'ally', 0, 等级);
      const 大招 = u.weapons.filter(e => isUltimate(e.t) && rangeKindOf(e.t)).map(e => e.t.name);
      this.预览缓存[k] = {
        速度: speedOf(u), hp: u.maxHp, 大招,
        开场: 大招.length ? Math.max(...u.weapons.filter(e => isUltimate(e.t)).map(e => startCdOf(e.t))) + 1 : 0,
        t: tplOf(键),
      };
    }
    return this.预览缓存[k];
  },

  /* ---------------- 屏幕切换 ---------------- */
  开屏(名) {
    this.屏 = 名;
    this.刷();
    /* M5：切屏跟着换曲子（方案 8.2）。`96-音乐.js` 在最后，加载期/测试期取不到就跳过 —— 音乐是可选层，
       任何一种「读不到曲子」的情况都不该让界面切屏失败（M5 的降级规矩）。 */
    if (typeof 音乐 !== 'undefined' && 音乐 && typeof 音乐.场景切换 === 'function') 音乐.场景切换(名);
    return this;
  },

  刷() {
    const 屏 = $('#screen');
    if (屏) 屏.innerHTML = this[this.屏 + '屏'] ? this[this.屏 + '屏']() : '';
    this.刷顶栏(); this.刷控件();
    this.接线();
    return this;
  },
  刷顶栏() { const t = $('#hud'); if (t) t.innerHTML = this.顶栏(); },
  刷控件() { const t = $('#ctrl'); if (t) t.innerHTML = this.控件(); this.接线(); },

  接线() {
    const 挂 = (el, 事件, 选择器) => {
      if (!el || el['_接了' + 事件]) return;
      el['_接了' + 事件] = true;
      el.addEventListener(事件, e => {
        const t = e.target && e.target.closest ? e.target.closest(选择器) : null;
        if (!t) return;
        const [动, 参] = String(t.getAttribute('data-act')).split(':');
        this.动作(动, t.tagName === 'SELECT' ? t.value : 参);
      });
    };
    挂($('#screen'), 'click', '[data-act]');
    挂($('#screen'), 'change', 'select[data-act]');
    挂($('#ctrl'), 'click', '[data-act]');

    /* 拖动（作者 2026-10-10）：用 pointer 事件，鼠标和手指都能拖（HTML5 的 drag 在手机上不行）。
       编队界面用；M4 的招募 / 编队界面直接复用这一套。 */
    const 屏 = $('#screen');
    if (屏 && !屏._接了拖) {
      屏._接了拖 = true;
      屏.addEventListener('pointerdown', e => {
        const el = e.target && e.target.closest ? e.target.closest('[data-drag]') : null;
        if (!el) return;
        const [类型, 值] = String(el.getAttribute('data-drag')).split(':');
        this.拖动开始(类型, 值, e);
        if (e.preventDefault) e.preventDefault();
      });
      屏.addEventListener('pointermove', e => { if (this.拖动) this.拖动到(e.clientX, e.clientY); });
      屏.addEventListener('pointerup', e => {
        if (!this.拖动) return;
        const el = e.target && e.target.closest ? e.target.closest('[data-drop]') : null;
        this.拖动放下(el ? el.getAttribute('data-drop') : null);
      });
    }
  },

  /* ---------------- 拖动：候选 ⇄ 格子，格子 ⇄ 格子 ---------------- */
  拖动: null,                     // {类型:'候选'|'位', 值, 幽灵}
  拖动开始(类型, 值, 事件) {
    this.拖动 = { 类型, 值 };
    if (事件 && typeof document !== 'undefined' && document.createElement) {
      const 幽灵 = document.createElement('div');
      幽灵.className = 'dragghost';
      const 键 = 类型 === '候选' ? 值 : ((this.编队.出击.find(x => x.位 === Number(值)) || {}).键);
      幽灵.textContent = this.单位名(键, 'ally') || '拖动中';
      if (document.body && document.body.appendChild) document.body.appendChild(幽灵);
      this.拖动.幽灵 = 幽灵;
      this.拖动到(事件.clientX, 事件.clientY);
    }
    return this.拖动;
  },
  拖动到(x, y) {
    const g = this.拖动 && this.拖动.幽灵;
    if (g && g.style) { g.style.left = ((x || 0) + 10) + 'px'; g.style.top = ((y || 0) + 10) + 'px'; }
    return this.拖动;
  },
  /** 松手：落在格子上就放进去 / 挪过去；落在候选区（或空白处）就是取回 */
  拖动放下(位) {
    const d = this.拖动;
    if (!d) return false;
    this.拖动 = null;
    if (d.幽灵 && d.幽灵.remove) d.幽灵.remove();
    if (位 == null || 位 === '候选' || 位 === '') return d.类型 === '位' ? this.取回(Number(d.值)) : false;
    const 位号 = Number(位);
    if (d.类型 === '候选') return this.拖入(d.值, 位号);
    return this.挪位(Number(d.值), 位号);
  },
  /** 把一名机师拖进某个格子：格子里原来的人被挤回候选列表 */
  拖入(键, 位) {
    const B = this.编队;
    if (位 < 0 || 位 >= SLOTS) return false;
    if (B.出击.some(x => x.键 === 键)) this.挪位(B.出击.find(x => x.键 === 键).位, 位);
    else {
      if (B.出击.some(x => x.位 === 位)) B.出击 = B.出击.filter(x => x.位 !== 位);
      const 上限 = this.当前出击上限();
      if (B.出击.length >= 上限) { this.提示 = this.出击上限说明() + '。'; this.刷(); return false; }
      B.出击.push({ 键, 位 });
      this.刷();
    }
    this.提示 = '';
    return true;
  },
  /** 格子 → 格子：目标有人就互换，空着就移过去 */
  挪位(从位, 到位) {
    const B = this.编队;
    if (从位 === 到位) return false;
    const 甲 = B.出击.find(x => x.位 === 从位);
    if (!甲) return false;
    const 乙 = B.出击.find(x => x.位 === 到位);
    if (乙) 乙.位 = 从位;
    甲.位 = 到位;
    this.提示 = '';
    this.刷();
    return true;
  },

  /** 界面上的所有动作都走这里（浏览器里由按钮点，测试里直接调用）。
   *  动作名有两种写法（沿用 M4 起的老约定）：
   *    ① `动作` 或 `动作:参数`（例如 `选分队:近卫`、`去节点:12`、`休整:耐久`）—— 按 `:` 拆一次；
   *    ② 动作表里直接写了带冒号的键名（例如 `黑市买:g2` 不会这样写，但 `黑市离开` 是整键）—— 先查整键。 */
  动作(动, 参) {
    if (动 == null) return null;
    const 名 = String(动);
    /* 弹窗上的按钮：`弹窗:<值>` —— 先把答案填回去（`对话框()` 正同步等着它） */
    if (名.indexOf('弹窗:') === 0) return this.回答(名.slice(3));
    if (typeof this.动作表[名] === 'function') return this.动作表[名].call(this, 参);
    const i = 名.indexOf(':');
    if (i > 0) {
      const 头 = 名.slice(0, i), 尾 = 名.slice(i + 1);
      if (typeof this.动作表[头] === 'function') return this.动作表[头].call(this, 尾);
    }
    return null;
  },
  /* 动作表（M4）：键 = 界面上 `data-act` 的名字，值 = 处理函数（`this` = 界面）。
     原来是一个大 switch，换成表之后「出口被守军挡着」那条带参数的动作名
     （`去节点:<格号>`）可以在 动作() 里按前缀转一次。
     用 `键: function(参){…}` 的写法（不用简写方法），因为键名和 `界面` 上的方法同名，
     简写会让人以为 `this.xxx` 指的是表里的项 —— 写成函数属性最不容易看错。 */
  动作表: {
    去编队: function () { return this.开屏('编队'); },
    回菜单: function () { return this.开屏('菜单'); },
    选人: function (参) { return this.选人(参); },
    放位: function (参) { return this.放位(Number(参)); },
    取回: function (参) { return this.取回(Number(参)); },
    默认五人队: function () { return this.默认五人队(); },
    清空: function () { return this.清空(); },
    等级: function (参) { return this.设等级(Number(参)); },
    势力: function (参) { return this.设势力(参); },
    编成: function (参) { return this.设编成(Number(参)); },
    开战: function () { return this.肉鸽编队模式 ? this.从编队开战肉鸽() : this.开战(); },
    开打: function () { return this.开打(); },
    暂停: function () { return this.暂停(); },
    二倍速: function () { return this.二倍速(); },
    跳过: function () { return this.跳过(); },
    再来一场: function (参) { return this.来一场(参); },
    /* M3 的指令阶段 */
    选单位: function (参) { return this.选单位(Number(参)); },
    指令: function (参) { return this.下指令(参); },
    点敌人: function (参) { return this.点敌人(Number(参)); },
    点队友: function (参) { return this.点队友(Number(参)); },
    大招: function (参) { return this.切大招(Number(参)); },
    /* M4 肉鸽 */
    去分队: function () { return this.开屏('分队'); },
    选分队: function (参) { return this.选分队(参); },
    开新局: function () { return this.开新局(); },
    继续上一局: function () { return this.继续上一局(); },
    回大地图: function () { return this.开屏('大地图'); },
    去节点: function (参) { return this.去节点(参); },
    打这一场: function () { return this.打这一场(); },
    去招募: function () { return this.开屏('招募'); },
    招募: function (参) { return this.招募(参); },
    /* 晋升（10 → 20 → 30）+ 零件（大地图上用的那几个） */
    去晋升: function () { return this.去晋升(); },
    晋升: function (参) { return this.晋升(参); },
    去零件: function () { return this.去零件(); },
    使用零件: function (参) { return this.使用零件(Number(参)); },
    去黑市: function () { return this.开屏('黑市'); },
    黑市买: function (参) { return this.黑市买(参); },
    黑市离开: function () { return this.黑市离开(); },
    瞭望: function () { return this.去瞭望(); },
    穿隧道: function () { return this.穿隧道(); },
    探查遗迹: function () { return this.去遗迹(); },
    休整: function (参) { return this.休整(参); },
    前进: function () { return this.前进(); },
    跳过节点: function () { return this.跳过节点(); },
    补给: function () { return this.领补给(); },
    去奇遇: function () { return this.开屏('奇遇'); },
    奇遇: function (参) { return this.选奇遇(参); },
    存个档: function () { return this.存个档(); },
    放弃本局: function () { return this.放弃本局(); },
    /* M5 美术和音乐 */
    音乐鉴赏: function () { return this.去音乐鉴赏(); },
    声音: function () { return 音乐.切开关(); },

  /* ---------------- 通用弹窗（隧道 / 休整 / 出口都用它） ----------------
     ① 测试用：`界面.对话框钩子 = (标题, 文本, 选项) => 值` 直接顶替弹窗；
     ② 真的在浏览器里：记在 `this.弹窗` 上，画面右边出现一排按钮，

  对话框(标题, 文本, 选项) {

  },

  /* ---------------- 顶栏 ---------------- */
  顶栏() {
    if (this.屏 === '战斗' || this.屏 === '结算') {

  控件() {

    if (this.屏 === '编队') return `<button data-act="回菜单">回菜单</button>`;

  },

  /* ---------------- 菜单 ---------------- */
  菜单屏() {
    const 有存档 = !!肉鸽.读存档();
    return `<section class="card menu">
      <h3>机甲指挥 · 晋升 + 零件（大地图上用的那一批）</h3>
      <p>自动战斗回合制 RPG：把机体摆进<b>前排 4 格 / 后排 5 格</b>的 9 格阵型（一开始只上 3 台，最多 6 台），每回合给每台机体下一条<b>大方向指令</b>，这一回合按速度自动打完。</p>
      <ul>
        <li><b>肉鸽</b>（方案第 7 节）：选分队 → <b>6×4 网格大地图</b>（战棋那套：四邻接 BFS 走格子、
          <b>推进剂</b>每层 7、走一格扣 1、用光触发追击战）→ 作战 / 精英 / 侵蚀源 / 黑市 / 事件 / 瞭望站 /
          遗迹 / 休整 / 招募站 / 隧道 / 出口守军 → 第 4 层出口通关；
          希望 / 源碳结晶 / 作战耐久 / 藏品 / <b>零件</b>，<b>关掉页面能继续</b>（存档）。</li>
        <li><b>晋升</b>（大地图上随时点）：花<b>希望</b>把队里的机体从 Lv10 升到 20、再升到 30
         （价格照战棋：精锐 3/4、骨干 2/3、普通 1/2；休整节点能给「下次 −1 希望」）；
          <b>零件</b>也全在大地图上用：补推进剂上限（河谷祭祈）/ 跳格 / 传送（喷气背包、小八界…），不花推进剂。</li>
        <li><b>战斗</b>：指令阶段（进攻 / 集火 / 守护 / 防御 / 换位 + 大招开关）→ 看敌人意图 →「开打 ▶」自动打完。</li>
        <li><b>练习</b>：不进肉鸽，直接用编队界面挑一队打一场（试数值用）。</li>
      </ul>
      <div class="acts">
        <button class="primary" data-act="去分队">新的一局（肉鸽）→</button>
        ${有存档 ? `<button data-act="继续上一局">继续上一局（第 ${肉鸽.读存档().层} 层）</button>` : ''}
        <button data-act="去编队">练习：直接编队打一场</button>
        <button data-act="音乐鉴赏">音乐鉴赏</button>
      </div>
      <p class="small">网格大地图照战棋 <code>26-地图生成.js</code> / <code>28-层.js</code> / <code>30-移动与节点.js</code> 实现
        （数值逐字照抄，出处写在 <code>91-地图.js</code> 里）；机体图标是原创矢量素材（<code>art/mech-icons.js</code>）；
        音乐按场景切，<b>放大招</b>时切成那台机体的主题曲、保持到本回合结束。右上角是声音开关（按 <b>M</b> 也行）。</p>
    </section>`;
  },

  /* ---------------- 编队 ---------------- */
  /** 这一屏最多能上几台（作者 2026-10-10 **第二次拍板**：按**肉鸽等级**算，起始 3 台、每 3 级 +1、封顶 6）。
   *  肉鸽里走 `肉鸽.出击上限()`（= `RUN.等级` → `05-阵型.js` 的 `出击上限()`）；
   *  练习模式没有 RUN、也没有肉鸽等级，走**旧口径** `出击上限按机体等级(编队.等级)`
   *  （Lv10 → 3 台、Lv15 → 4、Lv20 → 5、Lv25+ → 6）。 */
  当前出击上限() {
    if (this.肉鸽编队模式 && 肉鸽.RUN) return 肉鸽.出击上限();
    return 出击上限按机体等级(this.编队.等级);
  },
  /** 出击上限那一句说明（编队屏的标题 + 拖不进去时的提示都用它，口径只有一份）：
   *  肉鸽里写「**两级封顶**：等级那条线几台 / 最多 6 台，藏品 +N 台、最多加到 9 台」；
   *  练习模式写旧口径（练习模式没有 RUN、也没有藏品加成，封顶仍是 6）。 */
  出击上限说明() {
    const 上限 = this.当前出击上限();
    if (this.肉鸽编队模式 && 肉鸽.RUN) {
      const t = 出击上限提示(肉鸽.RUN.等级, 藏品部署位加成(肉鸽.RUN));
      return `出击上限 ${上限} 台（肉鸽部队 Lv${肉鸽.RUN.等级}：**等级那条** ${t.等级上限} / ${t.等级成长顶} 台` +
        `${t.等级到顶 ? '，等级已到顶' : `，再升到 Lv${t.解锁等级} 加 1 台`}；` +
        `**藏品** +${t.藏品加成} 台，7–9 台只能靠藏品，绝对封顶 ${t.绝对顶} 台）`;
    }
    return `出击上限 ${上限} 台（练习模式按机体等级：每 ${机体每几级加一台} 级 +1，最多 ${等级成长顶} 台；练习模式没有藏品加成）`;
  },
  编队屏() {
    const B = this.编队;
    /* 肉鸽里进战斗前会先走这一步：候选项是**名册**（RUN.队伍），不是全部 34 名 */
    const 肉鸽模式 = !!this.肉鸽编队模式 && !!肉鸽.RUN;
    const 势力们 = ['全部'].concat(FACTIONS);
    const 候选 = 肉鸽模式
      ? 肉鸽.RUN.队伍.map(m => Object.assign({}, tplOf(m.键), { 等级: m.等级 }))
      : ALLY_T.filter(t => B.势力 === '全部' || inFaction(t, B.势力));
    const 列表 = 候选.filter(t => t && t.mech).map(t => {
      const p = this.预览(t.mech, t.等级 || B.等级);
      const 已上 = B.出击.some(x => x.键 === t.mech);
      return `<button class="pick${B.选中 === t.mech ? ' on' : ''}${已上 ? ' used' : ''}" data-act="选人:${t.mech}" data-drag="候选:${t.mech}" style="--fc:${势力色(t.mech)}">
        <span class="pk-top">${图标.卡(t.mech, 'ally', 图标.尺寸.列表)}<span class="pk-nm"><b>${t.pilot}</b><small>${t.mech} · ${t.tags.战斗分类} · ${t.tags.势力}${肉鸽模式 ? ` · Lv${t.等级}` : ''}</small></span></span>
        <span class="nums">速 ${p.速度} · HP ${p.hp}${p.大招.length ? ` · 大招 ${p.大招.length}` : ''}</span>
      </button>`;
    }).join('');
    const 格 = [];
    /* 前排在下面（靠近敌人那一侧），后排在上面；每一排一行，列数从阵型配置取 */
    const 格序 = [];
    for (let r = ROWS - 1; r >= 0; r--) for (let c = 0; c < 行列数(r); c++) 格序.push(slotOf(r, c));
    const 行格 = new Map();
    for (const 位 of 格序) {
      const r = rowOfSlot(位);
      if (!行格.has(r)) 行格.set(r, []);
      const 占 = B.出击.find(x => x.位 === 位);
      if (占) {
        const p = this.预览(占.键, B.等级);
        行格.get(r).push(`<button class="slot filled" data-act="取回:${位}" data-drag="位:${位}" data-drop="${位}" style="--fc:${势力色(占.键)}">
          <span class="pos">${位名(位)}</span>
          <span class="pk-top">${图标.卡(占.键, 'ally', 图标.尺寸.格)}<span class="pk-nm"><b>${this.单位名(占.键, 'ally')}</b><small>${占.键} · 速 ${p.速度}</small></span></span>
          <span class="nums">HP ${p.hp}</span></button>`);
      } else {
        行格.get(r).push(`<button class="slot" data-act="放位:${位}" data-drop="${位}"><span class="pos">${位名(位)}</span><b>空位</b><small>${行名(r)}</small></button>`);
      }
    }
    for (const [r, 列表] of 行格) 格.push(`<div class="row" style="--cols:${最大列数}">${列表.join('')}</div>`);
    const 上限 = this.当前出击上限();
    const 编成选项 = 编成表.map((e, i) => {
      /* 下拉里带上这一条的「考点」（作者 2026-10-10：每条编成必须考一个指令）——
         练习模式换编成的时候能直接看到这一场想让玩家练什么。 */
      const 名 = `第${e.层}层 ${e.类型}｜前 ${(e.前 || []).join('+') || '—'} / 后 ${(e.后 || []).join('+') || '—'}｜${e.考点 || '（没写考点）'}`;
      return `<option value="${i}"${i === B.编成序号 ? ' selected' : ''}>${名}</option>`;
    }).join('');
    const 选中 = B.选中 ? this.预览(B.选中, B.等级) : null;
    const 当前节点 = 肉鸽模式 ? 肉鸽.当前节点() : null;
    return `<section class="编队屏">
      <div class="col 候选" data-drop="候选">
        <h3>${肉鸽模式 ? `名册（${候选.length} 台）` : `机师（${候选.length} 名）`}<span class="small">拖到右边格子里，或者点一名再点格子；格子之间也能拖（互换）</span></h3>
        ${肉鸽模式 ? '' : `<div class="filters">
          ${[10, 20, 30].map(n => `<button class="mini${B.等级 === n ? ' on' : ''}" data-act="等级:${n}">Lv${n}</button>`).join('')}
          <span class="sep"></span>
          ${势力们.map(f => `<button class="mini${B.势力 === f ? ' on' : ''}" data-act="势力:${f}">${f}</button>`).join('')}
        </div>`}
        <div class="picks">${列表}</div>
      </div>
      <div class="col 站位">
        <h3>出击编队（${B.出击.length} / ${上限}）<span class="small">9 格阵型：上排 = 后排 5 格，下排 = 前排 4 格；${this.出击上限说明()}</span></h3>
        <div class="grid">${格.join('')}</div>
        <div class="acts">
          <button data-act="默认五人队">${肉鸽模式 ? `把名册前 ${上限} 台摆上` : `摆上前 ${上限} 台`}</button>
          <button data-act="清空">清空</button>
        </div>
        ${肉鸽模式 ? `<p class="small">这一场：第 ${肉鸽.RUN.层} 层 <b>${节点类型表[当前节点 && 当前节点.类型] ? 节点类型表[当前节点.类型].名 : '作战'}</b>（敌人由编成表随机抽；敌人等级按层数走）</p>
          <div class="acts"><button class="primary" data-act="开战">开战 →</button><button data-act="回大地图">回大地图</button></div>`
        : `<h3>敌方编成<span class="small">（方案第 10 节第 4 条：这 3 条是初稿，等作者配）</span></h3>
          <select id="编成选" data-act="编成" class="sel">${编成选项}</select>
          <div class="acts"><button class="primary" data-act="开战">开战 →</button></div>`}
        ${选中 ? `<p class="small">已选：${this.单位名(B.选中, 'ally')}（${B.选中}，速度 ${选中.速度}${选中.大招.length ? `，大招：${选中.大招.join('、')}，第 ${选中.开场} 回合起` : '，没有大招'}）</p>` : '<p class="small">还没选机师。</p>'}
      </div>
    </section>`;
  },

  /* ---------------- 战斗 ---------------- */
  战斗屏() {
    if (!this.ctx) return '<section class="card"><p>还没有战斗。回菜单重新开始。</p></section>';
    const 指令阶段 = this.阶段 === '指令';
    const 我方单位 = 指令阶段 ? this.ctx.allies : (this.显示单位 ? this.显示单位.我方 : this.ctx.allies);
    const 敌方单位 = 指令阶段 ? this.ctx.enemies : (this.显示单位 ? this.显示单位.敌方 : this.ctx.enemies);
    const 意图 = 指令阶段 ? 算意图(this.ctx) : [];
    const 排 = (列表, 方, 从后往前) => {
      const 行序 = 从后往前 ? [ROW_BACK, ROW_FRONT] : [ROW_FRONT, ROW_BACK];
      return 行序.map(r => `<div class="row" style="--cols:${行列数(r)}">${Array.from({ length: 行列数(r) }, (_, c) => {
        const 位 = slotOf(r, c);
        const u = 列表.find(x => x.slot === 位);
        return u ? this.单位卡(u, 方, 意图.find(i => i.单位位 === 位), 指令阶段) : `<div class="uc empty"><span class="pos">${位名(位)}</span></div>`;
      }).join('')}</div>`).join('');
    };
    return `<section class="战斗屏">
      <div class="side ally">
        <h3>我方 <span class="small">${指令阶段 ? '点一张卡片下指令' : '后排在上 · 前排贴住接触线'}</span></h3>
        ${排(我方单位, 'ally', true)}
      </div>
      <div class="side enemy">
        <h3>敌方 <span class="small">${指令阶段 ? '卡上的箭头 = 它这一回合的意图' : '前排在上'}</span></h3>
        ${排(敌方单位, 'enemy', false)}
      </div>
      <aside class="logcol">
        ${指令阶段 ? this.指令面板() : ''}
        <h3>战斗记录</h3>
        <ol id="log"></ol>
      </aside>
    </section>`;
  },

  /** 指令面板（方案第 4 节）：选中的我方机体能下的指令 + 大招开关 */
  指令面板() {
    const 位 = this.选中位;
    if (位 == null) return `<div class="cmdpanel"><h3>指令</h3><p class="small">先点一张我方卡片。指令会一直留着，不想改就直接「开打 ▶」。</p>${this.提示 ? `<p class="warn small">${this.提示}</p>` : ''}</div>`;
    const u = this.ctx.allies.find(x => x.slot === 位);
    if (!u) return '';
    const c = this.当前指令(位);
    const 目标 = c.目标位 != null ? (c.类型 === '集火' ? this.ctx.enemies : this.ctx.allies).find(x => x.slot === c.目标位) : null;
    const 按钮 = [['进攻', '进攻'], ['集火', '集火 ▶ 敌人'], ['守护', '守护 ▶ 队友'], ['防御', '防御'], ['换位', '换位']]
      .map(([k, 名]) => `<button class="mini${c.类型 === k ? ' on' : ''}" data-act="指令:${k}">${名}</button>`).join('');
    return `<div class="cmdpanel">
      <h3>指令 · ${u.name}<span class="small">${u.key} · ${u.tags.战斗分类} · ${位名(位)}</span></h3>
      <div class="cmds">${按钮}<button class="mini${c.保留大招 ? ' on' : ''}" data-act="大招:${位}">大招：${c.保留大招 ? '保留' : '自动'}</button></div>
      <p class="small">当前：<b>${c.类型}</b>${目标 ? ` → ${目标.name}（${位名(目标.slot)}）` : ''}${c.类型 === '集火' && !目标 ? '（还没点目标）' : ''}${c.类型 === '守护' && !目标 ? '（还没点队友）' : ''}</p>
      ${this.选目标 ? `<p class="warn small">正在选目标：点一个${this.选目标 === '集火' ? '敌方' : '我方'}单位。</p>` : ''}
      ${this.提示 ? `<p class="warn small">${this.提示}</p>` : ''}
    </div>`;
  },

  单位卡(u, 方, 意图, 可点) {
    const 色 = 方 === 'ally' ? 势力色(u.key) : 敌方色;
    const hp = Math.max(0, Math.round(u.hp / u.maxHp * 100));
    const 动 = 可点 ? (方 === 'ally' ? ` data-act="选单位:${u.slot}"` : ` data-act="点敌人:${u.slot}"`) : '';
    const c = 方 === 'ally' ? this.当前指令(u.slot) : null;
    const 指令行 = c ? `${c.类型}${c.目标位 != null ? '→' + 位名(c.目标位) : ''}${c.保留大招 ? ' · 大招保留' : ''}` : '';
    /* 站桩 Boss（61-Boss.js）：大技能那一下前面标 ★，蓄力时直接写「蓄力中」——
       玩家在指令阶段就能看见 Boss 的节奏（方案 5.3 的意图显示） */
    const 意图行 = 意图 && 意图.武器
      ? `${意图.大技能 ? '★大技能 ' : ''}→ ${意图.目标名}(${位名(意图.目标位)}) · ${意图.武器} · 约 ${意图.期望}${意图.被挡 ? '（被挡 −20 命中）' : ''}`
      : (意图 ? (意图.蓄力 ? '蓄力中（这一回合不出手）' : '不行动') : '');
    const 选中 = 方 === 'ally' && this.选中位 === u.slot ? ' sel' : '';
    return `<div class="uc${u.hp <= 0 ? ' down' : ''}${选中}" id="u-${方}-${u.slot}" data-side="${方}" data-slot="${u.slot}" style="--fc:${色}"${动}>
      <span class="pos">${位名(u.slot)}</span>
      <div class="head">${图标.卡(u.key, 方, 图标.尺寸.卡)}<div class="nm"><b>${u.name}</b><small>${u.key} · 速 ${speedOf(u)}</small></div></div>
      <div class="bar hp"><i style="width:${hp}%"></i></div>
      <div class="nums">HP ${Math.max(0, u.hp)} / ${u.maxHp}${u.shieldHp ? ` · 盾 ${u.shieldHp}` : ''}</div>
      <div class="tags">${(u.tags && u.tags.战斗分类) || ''}${u.weapons && u.weapons.filter(e => isUltimate(e.t)).length ? ' · 大招' : ''}</div>
      ${方 === 'ally' && 指令行 ? `<div class="cmd">${指令行}</div>` : ''}
      ${方 === 'enemy' && 意图行 ? `<div class="intent">${意图行}</div>` : ''}
    </div>`;
  },

  /** 播放每应用一条记录就刷一次这张卡：血条、闪白、飘伤害数字、当前行动的人加一圈光。 */
  刷卡(方, 位, 飘) {
    const el = $(`#u-${方}-${位}`);
    if (!el || !el.style) return;
    const s = 播放.单位[方 + ':' + 位];
    if (!s) return;
    const i = el.querySelector ? el.querySelector('.bar.hp i') : null;
    if (i && i.style) i.style.width = Math.max(0, Math.round(s.hp / s.maxHp * 100)) + '%';
    const n = el.querySelector ? el.querySelector('.nums') : null;
    if (n) n.textContent = `HP ${Math.max(0, s.hp)} / ${s.maxHp}${s.shieldHp ? ` · 盾 ${s.shieldHp}` : ''}`;
    el.classList && el.classList.toggle('down', s.死);
    if (飘) {
      el.classList && el.classList.add(飘.暴击 ? 'hit crit' : 'hit');
      if (飘.伤害) el.innerHTML += `<span class="float${飘.暴击 ? ' crit' : ''}">${飘.伤害}</span>`;
    }
  },

  /* ---------------- 战斗流程 ---------------- */
  /** 由编队进入战斗：建立引擎状态（不再一次算完整场——玩家的指令每回合都可能改）。 */
  开战(种子) {
    const B = this.编队;
    if (!B.出击.length) return false;
    const 我方 = B.出击.slice().sort((a, b) => a.位 - b.位).map(x => ({ 键: x.键, 位: x.位, 等级: B.等级 }));
    const 条目 = 编成表[B.编成序号];
    const 敌方 = 编成到单位(条目, 0).map(u => ({ 键: u.key, 位: u.slot, 等级: u.lv }));
    this.种子 = 种子 != null ? Number(种子) : Math.floor(Date.now() % 900000) + 100000;
    /* 敌方增援波次（作者 2026-10-10）：编成表里配的波次交给引擎，回合开始时按回合号补人 */
    this.ctx = 开局(我方, 敌方, this.种子, null, { 波次: 编成波次到单位(条目, 0) });
    this.指令 = {};
    this.选中位 = null;
    this.选目标 = null;
    this.提示 = '';
    this.显示单位 = null;
    this.战报 = null;
    this.阶段 = '指令';
    this.开屏('战斗');
    return this.ctx;
  },

  /** 「开打」：把这一回合的指令交给引擎 → 打一回合 → 把这一回合的记录交给播放引擎放出来。 */
  开打() {
    if (!this.ctx || this.阶段 !== '指令') return false;
    /* 记下这一回合**开始时**的状态：播放时血条从这里开始走 */
    const 快照 = 列表 => 列表.map(u => ({
      side: u.side, slot: u.slot, key: u.key, name: u.name, maxHp: u.maxHp, hp: u.hp,
      shieldHp: u.shieldHp, tags: u.tags, weapons: u.weapons,
    }));
    this.显示单位 = { 我方: 快照(this.ctx.allies), 敌方: 快照(this.ctx.enemies) };
    设指令(this.ctx, this.指令);
    const 记录 = 打一回合(this.ctx);
    播放.载入({ 记录, 我方: this.显示单位.我方, 敌方: this.显示单位.敌方 });
    播放.手动 = !!this.手动播放;
    播放.快进 = !!this.跳过动画总是;
    this.阶段 = '播放';
    this.刷();
    播放.钩子.每步 = (ev, p) => this.播一步(ev, p);
    播放.钩子.结束 = () => this.回合播完();
    播放.开始();
    this.刷控件(); this.刷顶栏();
    return true;
  },

  /** 这一回合播放完了：分出胜负就去结算，否则回到指令阶段（指令留着）。 */
  回合播完() {
    音乐.回合结束();                 // M5：主题曲只保持到本回合结束（方案 8.2）
    if (this.ctx.result) return this.到结算();
    this.阶段 = '指令';
    this.选中位 = null;
    this.选目标 = null;
    this.提示 = '';
    this.刷();
    return true;
  },

  暂停() { 播放.暂停中 ? 播放.继续() : 播放.暂停(); this.刷控件(); return 播放.暂停中; },
  二倍速() { 播放.切倍速(); this.刷控件(); return 播放.倍速; },
  /** 跳过动画：立刻跳到本回合结尾；记住这个偏好，后面每回合直接到结尾。再按一次取消。 */
  设跳过动画(开) {
    this.跳过动画总是 = !!开;
    if (this.跳过动画总是 && this.阶段 === '播放') { 播放.快进 = true; 播放.跳到结尾(); }
    this.刷控件();
    return this.跳过动画总是;
  },
  跳过() { return this.设跳过动画(!this.跳过动画总是); },

  /** 播放一条记录：攻击者冲一下（并加一圈光）、受击方闪白 + 飘伤害数字，再追一行战斗记录。 */
  播一步(ev, p) {
    音乐.看记录(ev);                 // M5：我方放大招就切这台机体的主题曲（保持到本回合结束）
    if (ev && ev.目标方 != null) this.刷卡(ev.目标方, ev.目标位, { 伤害: ev.伤害, 暴击: ev.暴击 > 0 });
    const 屏 = $('#screen');
    const 旧的 = 屏 && 屏.querySelectorAll ? 屏.querySelectorAll('.uc.act') : [];
    for (const el of 旧的) el.classList && el.classList.remove('act');
    if (ev && ev.单位方 != null) {
      const 攻击者 = $(`#u-${ev.单位方}-${ev.单位位}`);
      if (攻击者 && 攻击者.classList) 攻击者.classList.add('act');
    }
    const 日志 = $('#log');
    if (日志) {
      const 类 = ev ? (ev.类型 === '攻击' || ev.类型 === '残月余响' ? (ev.单位方 || '') : ev.类型 === '回合' ? 'sys' : 'sys2') : 'sys';
      日志.innerHTML += ev ? `<li class="${类}"><span class="t">${ev.回合}</span>${ev.文本}</li>` : '<li class="sys">（本回合播放结束）</li>';
      if (日志.scrollTop != null) 日志.scrollTop = 99999;
    }
    if (p) this.刷顶栏();
  },

  到结算() {
    const c = this.ctx;
    this.战报 = {
      结果: c.result ? c.result.结果 : '败', 原因: c.result ? c.result.原因 : '—',
      回合数: c.turn, 记录: c.log, 我方: c.allies, 敌方: c.enemies, 种子: c.种子,
    };
    /* 肉鸽里的战斗：把结果交回肉鸽（发奖励 / 扣作战耐久 / 出口守军放行 / 追击后换层），
       然后回大地图；本局结束（耐久耗尽 / 通关）就去肉鸽结算屏。 */
    if (this.肉鸽战斗) {
      const 这次 = this.肉鸽战斗;
      this.肉鸽战斗 = null;
      const r = 肉鸽.战斗结束(this.战报.结果, 这次.格类型, this.战报);
      this.阶段 = '结算';
      if (!肉鸽.进行中 || (肉鸽.RUN && 肉鸽.RUN.结局)) this.开屏('肉鸽结算');
      else this.开屏('大地图');
      return r;
    }
    this.阶段 = '结算';
    this.开屏('结算');
  },

  /* ---------------- 结算 ---------------- */
  结算屏() {
    const b = this.战报;
    if (!b) return '<section class="card"><p>这场还没打完。</p></section>';
    const 胜 = b.结果 === '胜';
    const 活 = b.我方.filter(u => u.hp > 0).length, 敌活 = b.敌方.filter(u => u.hp > 0).length;
    return `<section class="card end ${胜 ? 'win' : 'lose'}">
      <div class="eyebrow">${胜 ? '战斗胜利' : '战斗失败'}</div>
      <h2>${b.结果} · ${b.原因}</h2>
      <ul>
        <li>回合数：<b>${b.回合数}</b></li>
        <li>我方存活：<b>${活} / ${b.我方.length}</b>　敌方存活：<b>${敌活} / ${b.敌方.length}</b></li>
        <li>战斗记录：<b>${b.记录.length}</b> 条</li>
        <li>种子：<b>${b.种子}</b>（同种子同编队同指令重放，结果完全一样）</li>
      </ul>
      <div class="acts">
        <button class="primary" data-act="再来一场">再来一场（换种子）</button>

        <button data-act="回菜单">回菜单</button>

  /* ---------------- 指令阶段的动作（方案第 4 节） ---------------- */
  当前指令(位) { return Object.assign({ 类型: '进攻', 目标位: null, 保留大招: false }, this.指令[位] || {}); },
  设某指令(位, 补丁) { this.指令[位] = Object.assign(this.当前指令(位), 补丁); this.提示 = ''; this.刷(); return this.指令[位]; },
  选单位(位) {
    if (this.阶段 !== '指令') return false;

    this.选目标 = null; this.提示 = '';
    this.刷();
    return this.选中位;
  },
  下指令(类型) {
    if (this.阶段 !== '指令' || this.选中位 == null) return false;
    if (类型 === '集火' || 类型 === '守护') { this.选目标 = 类型; this.提示 = ''; this.刷(); return this.选目标; }
    this.选目标 = null;

  点敌人(位) {
    if (this.阶段 !== '指令' || this.选目标 !== '集火' || this.选中位 == null) return false;
    const 目标 = this.ctx.enemies.find(x => x.slot === 位);
    if (!目标 || 目标.hp <= 0) return false;
    this.选目标 = null;
    return this.设某指令(this.选中位, { 类型: '集火', 目标位: 位 });
  },
  点队友(位) {
    if (this.阶段 !== '指令' || this.选目标 !== '守护' || this.选中位 == null) return false;
    if (位 === this.选中位) { this.提示 = '不能守护自己。'; this.刷(); return false; }
    const 冲突 = Object.keys(this.指令).some(k => Number(k) !== this.选中位 && this.指令[k].类型 === '守护' && this.指令[k].目标位 === 位);
    if (冲突) { this.提示 = `${位名(位)} 已经有人守护了（一名队友同时只能被一人守护）。`; this.刷(); return false; }
    this.选目标 = null;
    return this.设某指令(this.选中位, { 类型: '守护', 目标位: 位 });
  },
  切大招(位) {

  },
  /* ---------------- 肉鸽：网格大地图上的移动与节点（作者 2026-10-10：换成网格 + 推进剂） ----------------
     走到一格之后按**节点类型**决定开哪个屏，返回的是**节点类型字符串**（老的 `去节点(id)` 也是这个约定）：
       作战 / 精英 / 侵蚀源 / 出口守军 → 先进编队屏（摆好阵再点「开战」）；
       招募站 / 事件 / 黑市 → 开对应的屏；
       瞭望站 / 遗迹 / 隧道 / 休整 → 走弹窗（`肉鸽弹窗`），结算完回大地图；
       出口 → 守军没清就先指路，清了就下一层（第 4 层 = 通关）。 */
  去节点(参) {
    const k = Number(参);
    /* 正在用零件：这一下不是普通移动，而是「把零件用在这一格上」（不花推进剂，见 94-零件.js） */
    const 走 = (肉鸽界面.用零件中 != null) ? this.用零件走到(k) : 肉鸽.移动(k);
    if (!走) { 肉鸽界面.提示 = `走不过去：这一格到不了，或者推进剂不够（现在 ${肉鸽.RUN ? 肉鸽.RUN.推进剂 : 0}）。`; this.刷(); return null; }
    肉鸽界面.提示 = '';
    const 类型 = 走.类型;
    if (走.已过) { this.刷(); return 类型; }                    // 走过的空格：只挪位置
    if (['作战', '精英', '侵蚀源', '出口守军'].includes(类型)) { this.准备肉鸽编队(); return 类型; }
    if (类型 === '招募站') { this.开屏('招募'); return 类型; }
    if (类型 === '事件') { this.开屏('奇遇'); return 类型; }
    if (类型 === '黑市') { this.开屏('黑市'); return 类型; }
    if (类型 === '瞭望站') { this.去瞭望(); return 类型; }
    if (类型 === '遗迹') { this.去遗迹(); return 类型; }
    if (类型 === '隧道') { this.穿隧道(); return 类型; }
    if (类型 === '休整') { this.休整(); return 类型; }
    if (类型 === '出口') { this.前进(); return 类型; }
    this.刷();
    return 类型;
  },
  /** 打这一场（战斗节点 / 出口守军 / 侵蚀源 / 追击战都走这里） */
  打这一场() {
    if (!肉鸽.进行中) return false;
    const R = 肉鸽.RUN;
    const 格 = 肉鸽.当前格();
    const 格类型 = this.肉鸽战斗类型 || (格 ? 格.类型 : '作战');
    this.肉鸽战斗类型 = '作战';            // 读掉就用掉：下一场默认回到「这一格的类型」
    /* 抽编成：`抽当前编成详情()` 里带着**兜底**（70-编成.js 的 `抽编成兜底()`：某层某类型没编成
       就退回同层「普通」…，并往 RUN.日志 写一行），所以下面这个 `!条目` 只在**编成表整张空**时成立。 */
    const 详情 = 肉鸽.抽当前编成详情(格类型);
    const 条目 = 详情 && 详情.条目;
    if (!条目) { 肉鸽界面.提示 = `第 ${R.层} 层没有「${肉鸽.当前战斗类型(格类型)}」的编成，写进编成表再打。`; this.开屏('大地图'); return false; }
    /* 出击名单：优先用编队界面摆好的阵（RUN.出击阵 = [{键, 位}]），没有就用名册前几台
       （台数上限 = 肉鸽.出击上限()，作者 2026-10-10 第二次拍板：按肉鸽等级，Lv1 起 3 台） */
    const 阵 = (R.出击阵 && R.出击阵.length) ? R.出击阵 : R.队伍.slice(0, 肉鸽.出击上限()).map((m, i) => ({ 键: m.键, 位: i }));
    const 等级 = 键 => { const m = R.队伍.find(x => x.键 === 键); return (m && m.等级) || 肉鸽数值.招募等级; };
    const 我方 = 阵.map(x => ({ 键: x.键, 位: x.位, 等级: 等级(x.键) }));
    const 敌方 = 编成到单位(条目, R.场次).map(u => ({ 键: u.key, 位: u.slot, 等级: u.lv }));
    this.肉鸽编队模式 = false;
    this.种子 = (R.种子 + R.层 * 131 + R.场次 * 17 + (格 ? 格.k : 0) * 7) >>> 0;
    this.肉鸽战斗 = { 格类型, 类型: 详情.类型, 条目, 兜底: 详情.兜底, 请求类型: 肉鸽.当前战斗类型(格类型), 波次: 肉鸽.增援波次(条目) };
    this.ctx = 开局(我方, 敌方, this.种子, null, { 波次: this.肉鸽战斗.波次 });
    this.指令 = {};
    this.选中位 = null; this.选目标 = null; this.提示 = '';
    this.显示单位 = null; this.战报 = null;
    this.阶段 = '指令';
    this.开屏('战斗');
    return this.ctx;
  },
  /** 肉鸽：进战斗前先编队（方案 8.1 的第 3 条）——候选项是名册，摆进 9 格阵型（前 4 后 5） */
  准备肉鸽编队() {
    const R = 肉鸽.RUN;
    if (!R) return false;
    const 格 = 肉鸽.当前格();
    this.肉鸽编队模式 = true;
    this.肉鸽战斗类型 = 格 ? 格.类型 : '作战';
    this.编队.选中 = null;
    this.编队.出击 = (R.出击阵 && R.出击阵.length ? R.出击阵 : R.队伍.slice(0, 肉鸽.出击上限()).map((m, i) => ({ 键: m.键, 位: i })))
      .map(x => ({ 键: x.键, 位: x.位 }));
    this.开屏('编队');
    return this.编队.出击;
  },
  /** 编队界面点「开战」：把摆好的阵记进 RUN，再开始这一场战斗 */
  从编队开战肉鸽() {
    const R = 肉鸽.RUN;
    if (!R) return false;
    const 阵 = this.编队.出击.slice().sort((a, b) => a.位 - b.位);
    if (!阵.length) { this.提示 = '先把机师拖进格子里。'; this.刷(); return false; }
    R.出击阵 = 阵.map(x => ({ 键: x.键, 位: x.位 }));
    R.出击 = 阵.map(x => x.键);
    肉鸽.存档();
    return this.打这一场();
  },
  招募(键) {
    const R = 肉鸽.RUN;

    if (R.队伍.length >= 肉鸽数值.队伍上限) { 肉鸽界面.提示 = `队伍已经满了（${肉鸽数值.队伍上限} 台）。`; this.开屏('招募'); return false; }
    if (R.队伍.some(m => m.键 === 键)) { 肉鸽界面.提示 = '这位机师已经在队里了。'; this.开屏('招募'); return false; }
    肉鸽.招募(键);                          // 内部会 节点完成()（含存档）
    this.开屏('大地图');
    return true;
  },

  黑市买(id) {
    const r = 肉鸽.黑市买(id);

    this.开屏('黑市');

  },
  黑市离开() { 肉鸽.黑市离开(); 肉鸽界面.提示 = ''; this.开屏('大地图'); return true; },

     照战棋 `29-渲染.js:62-70`：点一下名册上的「→Lv20（N）」就升，扣希望、写日志、进存档。

  /* ---------------- 零件（大地图上用的那几个） ----------------
     点「使用」→ 记下下标 → 回大地图 → 点高亮的格子（`去节点` 会先问 `用零件走到`）。 */
  去零件() {
    /* 进零件屏 = 取消「正在用零件」（不然从零件屏走开时那件零件还挂着） */
    肉鸽界面.用零件中 = null;

  使用零件(i) {
    const R = 肉鸽.RUN;

    if (肉鸽界面.用零件中 === i) {                  // 再点一次 = 取消
      肉鸽界面.用零件中 = null;
      肉鸽界面.提示 = '取消使用零件。';

    const P = 零件表[p.k] || { 名: p.k };

    if (!目标.length) { 肉鸽界面.提示 = `【${P.名}】现在没有能去的格子（换一层或者换一件）。`; this.开屏('零件'); return false; }
    肉鸽界面.用零件中 = i;

  /** 用零件走一格（`去节点` 在「用零件中」时调它）：用掉之后接着按节点类型结算，
   *  结算完的回程和普通移动一样（推进剂为 0 就触发追击战，照战棋 `30:34`）。 */
  用零件走到(k) {
    const R = 肉鸽.RUN;

    const i = 肉鸽界面.用零件中;
    const r = 用零件(i, k);
    if (!r || !r.ok) { 肉鸽界面.提示 = (r && r.why) || '用不了这件零件。'; return null; }

    return { 格, 类型: 格.类型, 距离: r.距离, 追击: R.推进剂 <= 0, 已过: 格.已过 || 格.类型 === '空', 从: r.从, 零件: r.零件 };

  去瞭望() {

  },
  去遗迹() {

    this.开屏('大地图');
    return r;
  },
  /** 隧道：弹窗问一句（**同步**版 —— 弹窗的答案通过 `肉鸽弹窗(标题, 文本, 选项, 回调)` 回填，
   *  这样「点一下 → 传送 → 回大地图」是同一个调用里做完的，测试不用等 Promise）。 */
  穿隧道() {
    const R = 肉鸽.RUN;
    if (!R) return null;
    const 到 = 肉鸽.隧道另一头();
    const 做 = 答案 => {
      if (答案 === 'go') {
        const r = 肉鸽.结算隧道();
        肉鸽界面.提示 = r && r.传送 ? `穿过隧道，到了 ${坐标文字(R.地图.格[r.到])}。` : '隧道另一头不在了。';

      }

      this.开屏('大地图');
      return null;
    };
    if (到 == null) return 做('no');
    return 肉鸽弹窗('废弃隧道',
      `隧道另一端在 ${坐标文字(R.地图.格[到])}（${节点类型表[R.地图.格[到].类型].名}），传送不消耗推进剂。`,
      [['go', '传送过去'], ['no', '留在这里']], 做);
  },
  /** 休整：作战耐久 +2 / **下次晋升 −1 希望**（照战棋 `30:58-61`）/ 花希望换耐久（本仓库初稿）/ 跳过。
   *  同步版同上（弹窗的答案通过 `肉鸽弹窗(标题, 文本, 选项, 回调)` 回填）。 */
  休整(参) {
    const R = 肉鸽.RUN;
    if (!R) return null;
    const 做 = 答案 => {
      const r = 肉鸽.结算休整(答案);
      肉鸽界面.提示 = (r && r.ok === false) ? r.why
        : `休整完了：作战耐久 ${肉鸽.RUN.耐久}、希望 ${肉鸽.RUN.希望}${肉鸽.RUN.下次晋升减价 ? '（下次晋升 −1 希望）' : ''}。`;
      this.开屏('大地图');
      return r;
    };
    if (参) return 做(参);
    return 肉鸽弹窗('休整', `作战耐久 ${R.耐久}、希望 ${R.希望}。选一项：`, [
