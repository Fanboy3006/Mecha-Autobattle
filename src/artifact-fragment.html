<title>机甲指挥 试作版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ============================================================================
 * 机甲指挥 · 游戏样式
 * ----------------------------------------------------------------------------
 * M0 只做骨架，所以这里只有：配色变量、顶栏、卡片。
 * 战斗画面 / 编队 / 大地图的样式在 M2–M4 加进来。
 * 配色沿用战棋的座舱控制台风格（深色 + 琥珀强调色），方便以后搬美术素材。
 * ========================================================================== */

:root{
  color-scheme:dark;
  --bg:#121820; --panel:#19212c; --panel2:#212b38; --line:#2e3b4c;
  --fg:#dfe7ef; --muted:#8a99ab; --accent:#e9a23b;
  --ally:#4f95e0; --enemy:#d9564b; --good:#5cc08a;
  --font-d:'Saira Condensed','Noto Sans SC',system-ui,sans-serif;
  --font-b:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:14px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{min-height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:12px 16px;box-sizing:border-box}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:10px}
.mark{font-family:var(--font-d);font-weight:700;font-size:24px;letter-spacing:.06em}
.ver{color:var(--muted);font-size:12px;letter-spacing:.08em}
.ctrl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ctrl button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px}
.ctrl button:hover:not(:disabled){border-color:var(--muted)}
.ctrl button:disabled{opacity:.4;cursor:not-allowed}

.main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-height:0;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;max-width:820px}
.card h3{margin:0 0 8px;font-family:var(--font-d);font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--muted)}
.card p{margin:0 0 8px}
.card ul{margin:0 0 8px;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.small{font-size:12px;color:var(--muted)}
code{font-family:var(--font-m);font-size:12px;color:var(--accent)}

/* ============================================================================
 * M2：菜单 / 编队 / 战斗 / 结算
 * ========================================================================== */

.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);padding:2px 10px;border-radius:4px}
.chip .lbl{color:var(--muted);font-size:12px}
.chip b{font-family:var(--font-m);font-size:15px;font-variant-numeric:tabular-nums}
.ctrl button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px}
.ctrl button:hover{border-color:var(--muted)}
.ctrl button.on{border-color:var(--accent);color:var(--accent)}
.primary{background:var(--accent);color:#1b1407;border-color:var(--accent);font-weight:700}

.card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mini{font-size:12px;padding:2px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.mini.on{border-color:var(--accent);color:var(--accent)}
.sel{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;font:inherit;font-size:13px;padding:5px 6px;width:100%}
h3 .small{margin-left:6px;font-weight:400}

/* ---------- 编队 ---------- */
.编队屏{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:14px;align-items:start}
.编队屏 .col{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.编队屏 .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.编队屏 .filters .sep{width:8px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:6px;max-height:62vh;overflow:auto;padding-right:2px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--panel2);
  border:1px solid var(--line);border-left:4px solid var(--fc);border-radius:4px;padding:5px 8px;color:var(--fg)}
.pick b{font-size:13px}
.pick small{color:var(--muted);font-size:11px}
.pick .nums{font-family:var(--font-m);font-size:11px;color:var(--accent)}
.pick.on{outline:2px solid var(--accent)}
.pick.used{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:66px;background:var(--panel2);
  border:1px dashed var(--line);border-radius:6px;padding:6px 8px;color:var(--fg);text-align:left}
.slot .pos{font-family:var(--font-m);font-size:10px;color:var(--muted)}
.slot b{font-size:13px}
.slot small{font-size:11px;color:var(--muted)}
.slot .nums{font-family:var(--font-m);font-size:11px;color:var(--accent)}
.slot.filled{border-style:solid;border-left:4px solid var(--fc)}

/* ---------- 战斗 ---------- */
.战斗屏{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 320px;gap:12px;align-items:start}
.战斗屏 .side{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.战斗屏 .side.ally{border-top:3px solid var(--ally)}
.战斗屏 .side.enemy{border-top:3px solid var(--enemy)}
.战斗屏 .side h3{margin:0 0 8px}
.战斗屏 .row{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:6px;margin-bottom:6px}
.uc{position:relative;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--fc);
  border-radius:6px;padding:5px 7px;min-height:74px;overflow:hidden;transition:transform .12s,box-shadow .12s,opacity .2s}
.uc .pos{position:absolute;top:4px;right:6px;font-family:var(--font-m);font-size:10px;color:var(--muted)}
.uc .head{display:flex;flex-direction:column;line-height:1.25}
.uc .head b{font-size:13px}
.uc .head small{font-size:10px;color:var(--muted)}
.uc .bar{height:5px;background:#0d131a;border-radius:3px;overflow:hidden;margin:4px 0 2px}
.uc .bar i{display:block;height:100%;background:var(--good);transition:width .18s}
.uc .nums{font-family:var(--font-m);font-size:10px;color:var(--muted)}
.uc .tags{font-size:10px;color:var(--muted)}
.uc.empty{border-style:dashed;border-left-color:var(--line);opacity:.5;display:flex;align-items:center;justify-content:center}
.uc.down{opacity:.35;filter:grayscale(1)}
.uc.hit{animation:hitflash .18s;box-shadow:0 0 0 2px color-mix(in srgb,var(--enemy) 70%,transparent)}
.uc.hit.crit{box-shadow:0 0 0 3px var(--accent)}
/* 攻击者向前冲一下（方案 8.1）：我方往右、敌方往左，都朝接触线方向 */
.uc.act{animation:lunge .26s ease-out}
.side.ally .uc.act{animation-name:lungeRight}
.side.enemy .uc.act{animation-name:lungeLeft}
@keyframes hitflash{50%{transform:translateX(3px)}}
@keyframes lungeRight{40%{transform:translateX(7px)}}
@keyframes lungeLeft{40%{transform:translateX(-7px)}}
.float{position:absolute;right:6px;top:16px;font-family:var(--font-m);font-weight:700;font-size:15px;color:#fff;
  text-shadow:0 1px 3px #000;animation:floatup .8s ease-out forwards}
.float.crit{font-size:20px;color:var(--accent)}
@keyframes floatup{to{transform:translateY(-18px);opacity:0}}
.logcol{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;min-height:0}
.logcol h3{margin:0 0 8px}
#log{list-style:none;margin:0;padding:0;overflow:auto;max-height:64vh;display:flex;flex-direction:column;gap:5px;font-size:12px}
#log li{border-left:2px solid var(--line);padding-left:8px}
#log li.ally{border-color:var(--ally)}
#log li.enemy{border-color:var(--enemy)}
#log li.sys{border-color:var(--accent);color:var(--accent)}
#log .t{font-family:var(--font-m);color:var(--muted);margin-right:6px}

/* ---------- M3：指令阶段 ---------- */
button:disabled{opacity:.4;cursor:not-allowed}
.warn{color:var(--enemy)}
.uc[data-act]{cursor:pointer}
.uc[data-act]:hover{border-color:var(--muted)}
.uc.sel{outline:2px solid var(--accent);outline-offset:-2px}
.uc .cmd{font-family:var(--font-m);font-size:10px;color:var(--accent);margin-top:2px}
.uc .intent{font-family:var(--font-m);font-size:10px;color:#ffb38a;margin-top:2px}
.cmdpanel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:10px}
.cmdpanel h3{margin:0 0 6px}
.cmdpanel p{margin:4px 0 0}
.cmds{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:2px}
#log li.sys2{border-color:var(--accent);color:var(--accent);opacity:.9}
.filters .mini,.cmds .mini{cursor:pointer}
.cmdpanel .mini.on{border-color:var(--accent);color:var(--accent)}

/* ---------- 结算 ---------- */.card.end .eyebrow{font-family:var(--font-d);letter-spacing:.2em;font-size:13px;color:var(--enemy)}
.card.end.win .eyebrow{color:var(--good)}
.card.end h2{font-family:var(--font-d);letter-spacing:.06em;font-size:30px;margin:2px 0 10px}
.card.end ul{margin:0;padding-left:18px}
.card.end li b{font-family:var(--font-m);color:var(--accent)}

/* ---------- 手机宽度：单列，战斗记录放到下面 ---------- */
@media (max-width:980px){
  .编队屏{grid-template-columns:minmax(0,1fr)}
  .战斗屏{grid-template-columns:minmax(0,1fr)}
  .picks{max-height:none}
  #log{max-height:32vh}
  .uc{min-height:64px;padding:4px 6px}
  .uc .head b{font-size:12px}
}


/* ---------- 拖动（作者 2026-10-10） ---------- */
.pick,.slot{touch-action:none;-webkit-user-select:none;user-select:none}
.pick[draggable],.slot{cursor:grab}
.dragghost{position:fixed;z-index:99;pointer-events:none;background:var(--panel2);border:1px solid var(--accent);
  border-radius:4px;padding:3px 8px;font-size:12px;color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.5)}
/* 编队格子：每一排一行，列数由 05-阵型.js 的 --cols 决定（前排 3、后排 2） */
.编队屏 .grid{display:flex;flex-direction:column;gap:6px}
.编队屏 .grid .row{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:6px;margin:0}</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="mark">机甲指挥</span>
      <span class="ver">试作版 <span id="ver">v0.2.0</span> · <span id="ms">M2</span> 战斗画面</span>
    </div>
    <div class="hud" id="hud"></div>
    <div class="ctrl" id="ctrl"></div>
  </header>
  <main class="main" id="screen"></main>
</div>

<script>
/* ============================================================================
 * 机甲指挥 · 启动（head）
 * ----------------------------------------------------------------------------
 * 这份文件开始一个**贯穿所有 js 片段的 IIFE**，由 `src/js/99-boot.js` 收尾。
 * 约定（从战棋搬过来的）：所有片段共用同一个作用域，互相之间直接看见彼此的
 * 变量和函数，等价于把 js/ 按文件名顺序拼成一个大文件。
 * 所以：新片段直接写「局部的顶层代码」就行，不要自己再包一层 IIFE。
 *
 * M0 只有骨架：版本号、小工具、战场常量。
 * 战斗内核从 M1 开始（计划放 `10-*` 起的片段）。
 * ========================================================================== */
(() => {
'use strict';

/* ---------- 版本 / 里程碑（顶栏会显示，测试也会读） ---------- */
const VERSION = '0.3.0';
const MILESTONE = 'M3';

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* 带种子的随机数（方案 6.1：随机数一律带种子，同一种子同一结果，测试和复盘都要用）。
 * 这份 mulberry32 就是战棋 `src/js/00-head.js` 里的那一份，原样带过来。 */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 战场常量 ----------
   站位在 `src/js/05-阵型.js` 里配置：作者 2026-10-10 定「暂时前 3 后 2」（共 5 格），之后会扩充阵型。
   这里不再写死 ROWS / COLS / SLOTS，需要的地方从 05-阵型.js 取。 */
/* ============================================================================
 * 阵型（作者 2026-10-10 定：暂时「前 3 后 2」，之后会扩充阵型）
 * ----------------------------------------------------------------------------
 * 这里**只改这一个地方**就能换阵型：`阵型表` 里每行写「这一排有几格」。
 * 格子编号 slot 从 0 开始，按排顺序排下来：
 *   前 3 后 2 → 前排 = 0,1,2（前1 前2 前3）· 后排 = 3,4（后1 后2），共 5 格
 *   以后要改「前 4 后 2」「前 3 后 3」，把列数改掉就行，引擎 / 界面 / 测试都从下面这些函数取。
 *
 * 参考：舰娘的阵型（陣形）里和前后排有关的是「かばう（替旗舰挡枪）」和一个叫「警戒陣」的分工——
 * 5 只时是「主力艦 = 1–2 番艦（后）、警戒艦 = 3–5 番艦（前）」，靠前的替靠后的挡枪。
 * 舰娘没有严格的「一列对一列」规则，所以「换位」按作者的话做成**按列对位**：
 * 前排第 c 列 ↔ 后排第 c 列；前排多出来、后排没有对位的那一列，就在本排里换空位/换队友。
 * ========================================================================== */

const 阵型表 = [
  { 名: '前排', 列数: 3 },
  { 名: '后排', 列数: 2 },
];

const 阵型 = (() => {
  const 行 = [];
  let 起 = 0;
  for (let i = 0; i < 阵型表.length; i++) {
    行.push({ 名: 阵型表[i].名, 行: i, 列数: 阵型表[i].列数, 起 });
    起 += 阵型表[i].列数;
  }
  return { 行, 总格数: 起 };
})();

const ROWS = 阵型.行.length;          // 有几排
const SLOTS = 阵型.总格数;            // 一共几个位置（双方各这么多）
const ROW_FRONT = 0, ROW_BACK = 1;    // 排版：0 = 前排（靠敌人）、1 = 后排

const 行列数 = i => 阵型.行[i].列数;
/* 最宽的那一排有几格：界面画格子时用它，保证每张卡片一样宽 */
const 最大列数 = Math.max(...阵型.行.map(r => r.列数));
const 行首格 = i => 阵型.行[i].起;
const 行名 = i => 阵型.行[i].名;
/** slot → 第几排 */
function rowOfSlot(slot) {
  let r = 0;
  while (r < ROWS - 1 && slot >= 行首格(r + 1)) r++;
  return r;
}
/** slot → 这一排的第几列（0 起） */
const colOfSlot = slot => slot - 行首格(rowOfSlot(slot));
/** （排, 列）→ slot */
const slotOf = (row, col) => 行首格(row) + col;
/** 这一排有没有这一列（前 3 后 2 时，后排没有第 3 列） */
const 有这一列 = (row, col) => col >= 0 && col < 行列数(row);
/** 格子的人话名字：前1 / 后2 */
const 位名 = slot => `${行名(rowOfSlot(slot))}${colOfSlot(slot) + 1}`;

/** 某一列上所有真实的格子（前 3 后 2 时：前列0+后列0、前列1+后列1、前列2 只有自己） */
function 列上所有格(col) {
  const out = [];
  for (let r = 0; r < ROWS; r++) if (有这一列(r, col)) out.push(slotOf(r, col));
  return out;
}
/* ============================================================================
 * 数据：角色 / 机体 / 敌人 / 武器（从机甲战棋复制，方案第 2 节）
 * ----------------------------------------------------------------------------
 * 来源：mecha-tactics 的 `Claude hand off/src/js/04-武器与机体.js`（v0.41.11 时点），
 * **整份原样复制**，一个字都没改（除了本文件开头这段说明）。
 * 复制过来之后两边各走各的：战棋冻结不动，这里以后按新项目的需要改。
 *
 * 第一期（M1）只用到：`ALLY_T` / `ENEMY_T` / `wp()` / `ENEMY_POOL` /
 * `ENEMY_BOSS` / `ENEMY_OVERWATCH`。
 * 带 `special` 字段的特殊武器、`trait` 特技、`FORMS` 变身、`DEBRIS_T` /
 * `CHEST_T` 召唤物第一期**不实现**（方案 6.2），但数据先留着。
 * ========================================================================== */

/* 下面这一行抄自战棋 `03-能力与减免管线.js:96`，**必须放在 ALLY_T 之前**：
   本文件末尾（原 04-武器与机体.js:288-314）的初始化代码会读它，而 `const` 在同一个
   `<script>` 里是暂时性死区，放到后面的片段里会直接 ReferenceError。
   第一期不做特技，这里只是**数据**，先留着。 */
const PROMO_PASSIVE = {CB5:'gnArmsGuard', M2:'ironField', M4:'zanshin', S3:'lunaPower', A4:'darkSword', A5:'psyRes', U1:'falkeHunt', U8:'laserGuide', CB3:'superSoldier'};

/* ---------- 武器与机体 ---------- */
/* v0.40.11 双势力：拉米亚同时属于 ATX 和影世界（tags.副势力）。按势力判断的地方都用 inFaction */
const inFaction = (t, f) => !!(t && t.tags) && (t.tags.势力 === f || t.tags.副势力 === f);
const wp = o => Object.assign({range:[1,1], hit:100, critMod:0, stat:'射击', fire:'direct', dmgType:'物理', cd:0, uses:null, unlock:1, upgrades:[], afterMove:true, ignoreDef:false, special:null, power:0, desc:''}, o);
const ALLY_T = [
  {pilot:'雷萨', mech:'B1', short:'B1', trait:'portalTrait', portal:{range:7, cost:25}, tags:{势力:'影世界', 远近分类:'近战', 战斗分类:'近卫'}, hp:5000, armor:1000, eva:15, mov:5, melee:160, shoot:100, awaken:140, flying:false, w:1, h:1, abilities:[], weapons:[
    wp({name:'近战斩击', power:2350, stat:'格斗', fire:'melee', range:[1,1]}),
    wp({name:'传送斩', stat:'格斗', fire:'melee', range:[1,4], critMod:-10, unlock:20, startCd:2, ignoreDef:true, special:'gamble', upgrades:[{lv:30, range:[1,Infinity], note:'Lv30 起射程变为全图'}],
        desc:'命中后 50% 造成 12000 伤害、50% 造成目标当前 HP 90% 的伤害；无视防御。无论是否命中都会传送到目标旁（击破时占据目标位置）。也是门之力：每次使用反噬 +25（和「传送」共用），反噬 ≥100 时不能使用。'}),
  ]},
  {pilot:'蕾卡', mech:'B2', short:'B2', trait:'moveEva', canFly:true, tags:{势力:'影世界', 远近分类:'远程', 战斗分类:'尖兵'}, hp:4500, armor:0, eva:40, mov:7, melee:100, shoot:130, flying:true, w:1, h:1, abilities:[], weapons:[
    wp({name:'直射炮', power:2000, fire:'direct', range:[1,5]}),
    wp({name:'曲射弹', power:1500, fire:'indirect', range:[2,7]}),
    wp({name:'影凤凰', power:2400, statMul:1.2, v37:true, fire:'map', range:[1,4], unlock:20, afterMove:false, dmgType:'特殊',
        desc:'选 8 个方向之一，冲到第 5 格（必须是合法落点），攻击沿途 4 格内所有单位，包括友军。必中，不能被反击。'}),
