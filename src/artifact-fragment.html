      ['晋升', '下次晋升 −1 希望（战棋 30:60）'],
      ['希望', `花 ${肉鸽数值.休整希望} 希望 → 作战耐久 +1（本仓库初稿）`],
      ['跳过', '算了，不休息'],
    ], 做);
  },
  /** 「跳过」：不结算，直接离开这一格（隧道 / 休整这类想反悔的节点） */
  跳过节点() { 肉鸽.节点完成(); 肉鸽界面.提示 = ''; this.开屏('大地图'); return true; },
  /** 出口：守军没清就先指路；清了就换层（第 4 层 = 通关）；
   *  推进剂归零时先在出口这一格打一场追击战（战棋 30:34「结算完再判 prop <= 0」），打完再换层。 */
  前进() {
    const R = 肉鸽.RUN;
    if (!R) return false;
    const 守 = R.地图.格[R.地图.守军];
    if (守 && !守.已过 && 守.类型 !== '空') {
      肉鸽界面.提示 = '出口被守军挡着：先走到 ⇛ 守军那一格把它打掉。';
      this.开屏('大地图');
      return false;
    }
    if (R.推进剂 <= 0 && !R.追击) {
      this.肉鸽战斗类型 = '追击';
      肉鸽界面.提示 = '推进剂用光了 —— 追兵到了，打一场追击战，赢了才出得去。';
      const 层前 = R.层;
      const 打 = this.打这一场();
      /* ★ 追击战自己就会换层（`90-肉鸽.js` 的 `追击之后()` → `换层()`，战棋 31:300 的 chase 分支），
         所以这里**必须**提前收工 —— 否则下面那句 `肉鸽.下一层()` 会**连换两层**，
         第 4 层那一下还会把已经写好的「通关」覆盖成「失败」。 */
      if (!肉鸽.进行中 || R.结局 || R.层 !== 层前) {
        if (R.结局) this.开屏('肉鸽结算');
        return 打;
      }
    }
    const 之前 = R.层;
    肉鸽.下一层();
    if (!肉鸽.进行中 || R.结局) { this.开屏('肉鸽结算'); return true; }
    肉鸽界面.提示 = `进入第 ${R.层} 层（推进剂 ${R.推进剂}）。`;
    this.开屏('大地图');
    return 之前 !== R.层;
  },
  /** 追击战：推进剂用光之后强制打一场（战棋 31:304-307） */
  追击战() {
    const R = 肉鸽.RUN;
    if (!R || !肉鸽.进行中) return false;
    this.肉鸽战斗类型 = '追击';
    肉鸽界面.提示 = '推进剂用光了 —— 追兵到了，打一场追击战！';
    return this.打这一场();
  },
  领补给() { 肉鸽.补给(); this.开屏('大地图'); return true; },
  选奇遇(选) { 肉鸽.奇遇(选); this.开屏('大地图'); return true; },
  存个档() { const ok = 肉鸽.存档(); 肉鸽界面.提示 = ok ? '已存档（关掉页面也能继续）。' : '存档失败（浏览器不让存？）'; this.开屏('大地图'); return ok; },
  放弃本局() { 肉鸽.失败('玩家放弃'); this.开屏('肉鸽结算'); return true; },

  /* ---------------- M5：音乐 ---------------- */
  /** 音乐鉴赏页（audio/music-room.js 的画面）：菜单进，关闭后回到菜单屏。 */
  去音乐鉴赏() {
    const ok = 音乐.打开鉴赏页();
    this.提示 = ok ? '' : (音乐.提示 || '音乐鉴赏页不可用。');
    this.刷();
    return ok;
  },

  /* ---------------- 编队动作 ---------------- */
  选人(键) { this.编队.选中 = this.编队.选中 === 键 ? null : 键; this.刷(); return this.编队.选中; },
  放位(位) {
    const B = this.编队;
    if (!B.选中) return false;
    if (B.出击.some(x => x.键 === B.选中)) return false;      // 同一台不重复上
    const 旧 = B.出击.find(x => x.位 === 位);
    if (旧) B.出击 = B.出击.filter(x => x.位 !== 位);
    if (B.出击.length >= this.当前出击上限()) return false;   // 出击上限（3 → 6，见 当前出击上限()）
    B.出击.push({ 键: B.选中, 位 });
    this.刷();
    return true;
  },
  取回(位) { this.编队.出击 = this.编队.出击.filter(x => x.位 !== 位); this.刷(); return true; },
  清空() { this.编队.出击 = []; this.刷(); return true; },
  设等级(n) { this.编队.等级 = n; this.预览缓存 = {}; this.刷(); return n; },
  设势力(f) { this.编队.势力 = f; this.刷(); return f; },
  设编成(i) { this.编队.编成序号 = Math.max(0, Math.min(编成表.length - 1, i || 0)); this.刷(); return this.编队.编成序号; },
  默认五人队() {
    /* 肉鸽模式：把名册前几台摆上（最多 = 出击上限）；练习模式：默认五人队里前几台（按当前 Lv 的上限） */
    const 上限 = this.当前出击上限();
    if (this.肉鸽编队模式 && 肉鸽.RUN) this.编队.出击 = 肉鸽.RUN.队伍.slice(0, 上限).map((m, i) => ({ 键: m.键, 位: i }));
    else this.编队.出击 = 默认五人队.slice(0, 上限).map(x => ({ 键: x.键, 位: x.位 }));
    this.刷();
    return this.编队.出击;
  },
};
/* ============================================================================
 * 音乐接线（M5，方案 8.2）
 * ----------------------------------------------------------------------------
 * 播放层是 **原样搬过来的** `audio/local-music.js`（全局 `MechAudio`）+ `audio/music-room.js`（音乐鉴赏页），
 * 由 `tools/build-src.mjs` 内联进 HTML 的 AUDIO 块。这里只决定「什么时候放什么」，
 * 场景对应照方案 8.2 和战棋 `31d-音频接线与调试接口.js` 的规则：
 *
 *   开场菜单 = `title`；大地图 / 编队（分队、招募、奇遇这些肉鸽外壳画面）= `mapStrategy`；
 *   战斗中 = `allyPhase`（**敌方行动不切曲**：一回合只切一次，免得一阵一阵的）；
 *   Boss 战 = `boss`（肉鸽的 Boss 节点，或者练习模式里挑了 Boss 编成）；
 *   **放大招**（unlock 20 / 30 的武器）时切成这台机体的**主题曲**，保持到本回合结束
 *   （下一个我方回合开始 / 被另一首主题曲替换才换，普通攻击和敌方行动都不切；战棋 31d:45-50）。
 *   结算屏**不切曲**（战棋的 victory / defeat 两首都没有曲子，切过去就是静音，所以留在原曲上）。
 *
 * 读不到曲子（测试环境、别人的机器上没有作者本地的版权 mp3）时：播放层自己会静音、
 * 声音按钮隐藏，这里所有调用都包了 try/catch，绝不抛异常（方案 8.2 的硬性要求）。
 * ========================================================================== */

const 声音键 = 'mecha-autobattle-sound';

/** 场景 → 曲子。纯函数（测试直接调）：null = 不切曲，留在现在这首上。
 *  `是Boss` 只在「战斗」时有意义（方案 8.2：Boss 战 = boss）。 */
function 场景曲(屏, 是Boss) {
  switch (屏) {
    case '菜单': return 'title';
    case '分队': case '大地图': case '招募': case '奇遇': case '编队': return 'mapStrategy';
    case '战斗': return 是Boss ? 'boss' : 'allyPhase';
    default: return null;                       // 结算 / 肉鸽结算：不切曲
  }
}

const 音乐 = {
  场景: null,          // 现在在哪个屏（菜单 / 大地图 / 战斗 / 结算…）
  主题: null,          // 放大招切过来的主题曲 cue（null = 用场景曲）
  当前曲: null,        // 已经交给播放层的 cue
  是Boss战: false,
  开关: true,          // 顶栏的声音开关（和战棋一样存 localStorage）
  可用: null,          // 播放层报的「读得到曲子吗」；null = 还没回报
  提示: '',

  /** 播放层；AUDIO 块没注入（或者关了）时是 null，所有调用都要能承受。 */
  层() { return (typeof MechAudio !== 'undefined' && MechAudio) ? MechAudio : null; },

  /* ---------------- 启动接线 ---------------- */
  初始化() {
    /* 声音开关的偏好（关掉页面也记得） */
    try { const s = localStorage.getItem(声音键); if (s === 'off') this.开关 = false; } catch (e) {}
    const 钮 = $('#btnSound');
    if (钮) {
      钮.addEventListener('click', () => this.切开关());
      this.写按钮();
      const A = this.层();
      钮.hidden = true;                                // 先藏，等播放层回报能不能用
      if (!A) 钮.hidden = true;                        // 连播放层都没有：一直藏
      else if (A.onAvailable) A.onAvailable(ok => { this.可用 = !!ok; 钮.hidden = !ok; });
    }
    const A = this.层();
    if (A && !this.开关) { try { A.mute(true); } catch (e) {} }
    /* M 键切换（战棋的习惯） */
    if (typeof document !== 'undefined' && document.addEventListener)
      document.addEventListener('keydown', e => { if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey) this.切开关(); });
    return this;
  },

  写按钮() {
    const 钮 = $('#btnSound');
    if (!钮) return;
    钮.textContent = this.开关 ? '声音' : '静音';
    钮.setAttribute('aria-pressed', String(this.开关));
    if (typeof 钮.classList.toggle === 'function') 钮.classList.toggle('on', this.开关);
  },
  /** 声音开关：顶栏按钮 / M 键 / 测试都走这里。 */
  切开关(开) {
    if (开 === undefined) 开 = !this.开关;
    this.开关 = !!开;
    try { localStorage.setItem(声音键, this.开关 ? 'on' : 'off'); } catch (e) {}
    this.写按钮();
    const A = this.层();
    if (A) {
      try {
        if (this.开关) { A.mute(false); if (A.unlock) A.unlock(); this.当前曲 = null; this.刷曲(); }
        else { this.当前曲 = null; A.stop(); A.mute(true); }
      } catch (e) {}
    }
    return this.开关;
  },

  /* ---------------- 场景 ---------------- */
  /** 这一场是不是 Boss 战：肉鸽的 Boss 节点，或者练习模式挑了 Boss 编成（方案 8.2）。 */
  算Boss() {
    const 战 = 界面.肉鸽战斗;
    if (战 && 战.类型 === 'Boss') return true;
    const 条 = 编成表[界面.编队 && 界面.编队.编成序号];
    return !!(条 && 条.类型 === 'Boss');
  },
  /** 界面切屏时调用（80-界面.js 的 开屏）。 */
  场景切换(屏) {
    this.场景 = 屏;
    this.是Boss战 = this.算Boss();
    if (屏 === '战斗') this.主题 = null;        // 新的一场战斗：从 allyPhase / boss 起
    return this.刷曲();
  },
  /** 现在该放哪首：主题曲优先，否则看场景。null = 不切（结算屏）。 */
  该放() { return this.主题 || 场景曲(this.场景, this.是Boss战); },
  /** 把该放的曲子交给播放层（同一首不重复切）。 */
  刷曲() {
    const cue = this.该放();
    if (cue == null || cue === this.当前曲) return cue;
    this.当前曲 = cue;
    const A = this.层();
    if (A) { try { A.play(cue); } catch (e) {} }
    return cue;
  },

  /* ---------------- 放大招切主题曲 ---------------- */
  /** 播放一条战斗记录时看：这是不是我方**放大招**？是的话切这台机体的主题曲。
   *  返回切过去的 cue（没切就是 null），方便测试直接断言。 */
  看记录(ev) {
    if (!ev || ev.类型 !== '攻击' || ev.单位方 !== 'ally') return null;
    const u = 界面.ctx && 界面.ctx.allies ? 界面.ctx.allies.find(x => x.slot === ev.单位位) : null;
    if (!u) return null;
    const 用 = (u.weapons || []).find(e => e.t && e.t.name === ev.武器);
    if (!用 || !isUltimate(用.t)) return null;              // 只有大招才切（普通攻击不切）
    const A = this.层();
    if (!A || !A.themeOf) return null;
    let cue = null;
    try { cue = A.themeOf(u.key, tplOf(u.key)); } catch (e) { cue = null; }
    if (!cue) return null;                                  // 这台机体 / 势力没有主题曲
    this.主题 = cue;
    this.刷曲();
    return cue;
  },
  /** 本回合结束：主题曲放回场景曲（方案 8.2「保持到本回合结束」）。 */
  回合结束() {
    if (!this.主题) return null;
    this.主题 = null;
    return this.刷曲();
  },

  /* ---------------- 音乐鉴赏页（audio/music-room.js） ---------------- */
  打开鉴赏页() {
    const A = this.层();
    if (!A || typeof A.openRoom !== 'function') { this.提示 = '音乐鉴赏页不可用（这台机器上读不到曲子）。'; return false; }
    const units = {};
    const 主题表 = (A.THEMES && A.THEMES.unit) || {};
    for (const k in 主题表) { const t = tplOf(k); units[k] = t ? t.pilot : k; }
    let r = null;
    try { r = A.openRoom({ factions: FACTIONS, units }); } catch (e) { return false; }
    if (r && r.then) r.then(() => { if (!this.开关) { try { A.stop(); } catch (e) {} } });
    return true;
  },
};

音乐.初始化();
/* ============================================================================
 * 机甲指挥 · 收尾（boot）
 * ----------------------------------------------------------------------------
 * 1. 把顶栏上的版本 / 里程碑文字填上；
 * 2. 把界面点亮（菜单屏）；
 * 3. 关闭 `00-head.js` 打开的 IIFE，把调试接口挂到 `window.__game`
 *    （测试 `tests/smoke.js` / `tests/sim.js` / `tests/battle_ui.js` 都从这里取）。
 * ========================================================================== */

function boot() {
  const verEl = $('#ver'); if (verEl) verEl.textContent = 'v' + VERSION;
  const msEl = $('#ms'); if (msEl) msEl.textContent = MILESTONE;
  界面.开屏('菜单');
}

const G = {
  version: VERSION,
  milestone: MILESTONE,
  ready: false,
  slots: SLOTS,          // 双方各几个位置（现在「前 4 后 5」= 9，阵型在 05-阵型.js 里配）
  rows: ROWS, 行列数, 阵型表, 行名, 位名, 列上所有格,
  /* ---- 阵型 9 格（作者 2026-10-10 拍板）：阻挡关系 + 出击上限 ----
     出击上限（作者 2026-10-11 **第三次拍板：两级封顶**）：
     `出击上限(等级, 藏品加成)` = `min(绝对顶 9, min(等级成长顶 6, 3 + floor((等级−1)/3)) + 藏品加成)`；
     「+出击上限」的藏品**永久加**、允许突破 6，**7–9 台只能靠藏品**；
     `藏品部署位加成(RUN)` 从 `RUN.藏品` 里把这类加成求和。
     `出击上限由名册/出击上限按机体等级` 是练习模式那条**旧口径**（保留，别删；没有藏品加成，封顶 6）。 */
  阻挡表, 阻挡关系, 阻挡位, 遮挡位, 对位, 相邻位, 被挡吗, 阻挡束,
  出击上限, 出击上限提示, 出击上限由名册, 出击上限按机体等级, 藏品部署位加成,
  出击上限初值, 等级成长顶, 绝对顶, 每几级加一台, 肉鸽等级基准, 机体等级基准, 机体每几级加一台,
  升级门槛, 加经验,        // 肉鸽等级（战棋 27-开局.js:102-111 的 gainExp）
